<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="theme-color" content="#f6cbd8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon.png" />

  <title>HABITS</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');

    :root {
      --pink-bg: #f6cbd8;
      --pink: #e889a7;
      --pink-dark: #d9678d;
      --pink-soft: #fbe7ee;

      --white: #ffffff;
      --text: #554850;
      --muted: #a18f97;

      --line: #f0d8e0;
      --delete: #ef5f68;

      --mint: #bde8d7;
      --yellow: #f7df9c;

      --radius: 22px;
      --small-radius: 15px;

      --shadow:
        0 7px 18px rgba(136, 86, 104, 0.08),
        0 2px 6px rgba(136, 86, 104, 0.05);

      --delete-width: 88px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--pink-bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--pink-bg);
      color: var(--text);
      font-family: "Zen Maru Gothic", sans-serif;

      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;

      overscroll-behavior-y: none;
    }

    input,
    textarea,
    select {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
    }

    .app {
      width: min(100%, 640px);
      margin: 0 auto;
      padding-bottom: calc(42px + env(safe-area-inset-bottom));
    }

    /* ------------------------------
       HEADER
    ------------------------------ */

    .header {
      padding:
        calc(22px + env(safe-area-inset-top))
        20px
        17px;
    }

    .app-name {
      margin: 0 0 2px;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
      color: var(--pink-dark);
    }

    .date-main {
      margin: 0;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 35px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .date-sub {
      margin-top: 4px;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    /* ------------------------------
       MAIN NAV
    ------------------------------ */

    .nav-sticky {
      position: sticky;
      top: env(safe-area-inset-top);
      z-index: 40;
      padding: 5px 14px 10px;
      background:
        linear-gradient(
          to bottom,
          rgba(246, 203, 216, 0.98),
          rgba(246, 203, 216, 0.95)
        );
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .main-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr) 48px;
      gap: 6px;
      padding: 6px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.45);
    }

    .main-tab,
    .main-add {
      min-height: 42px;
      border-radius: 15px;
      background: transparent;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition:
        transform 0.18s cubic-bezier(.34,1.56,.64,1),
        background 0.18s ease,
        color 0.18s ease;
    }

    .main-tab.active {
      background: var(--white);
      color: var(--pink-dark);
      box-shadow: 0 4px 12px rgba(140, 82, 105, 0.08);
    }

    .main-add {
      background: var(--pink-dark);
      color: white;
      font-size: 22px;
      line-height: 1;
    }

    .main-tab:active,
    .main-add:active,
    .soft-button:active,
    .round-button:active {
      transform: scale(0.9);
    }

    /* ------------------------------
       CONTENT
    ------------------------------ */

    .content {
      padding: 5px 15px 0;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
      animation: sectionIn 0.24s ease both;
    }

    @keyframes sectionIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ------------------------------
       HABIT TOOLBAR
    ------------------------------ */

    .habit-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 6px 2px 14px;
    }

    .habit-filters {
      display: flex;
      gap: 5px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .habit-filters::-webkit-scrollbar {
      display: none;
    }

    .filter-button {
      flex: 0 0 auto;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.48);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      transition: 0.18s ease;
    }

    .filter-button.active {
      background: white;
      color: var(--pink-dark);
      box-shadow: 0 3px 9px rgba(140, 82, 105, 0.07);
    }

    .view-switcher {
      flex: 0 0 auto;
      display: flex;
      gap: 3px;
      padding: 3px;
      border-radius: 12px;
      background: rgba(255,255,255,.5);
    }

    .view-button {
      width: 34px;
      height: 32px;
      border-radius: 9px;
      background: transparent;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: #b49ba4;
      transition:
        transform .18s cubic-bezier(.34,1.56,.64,1),
        background .18s ease,
        color .18s ease;
    }

    .view-button.active {
      background: white;
      color: var(--pink-dark);
      box-shadow: 0 2px 7px rgba(140,82,105,.08);
    }

    .view-button:active {
      transform: scale(.82);
    }

    /* ------------------------------
       BADGE PERMISSION
    ------------------------------ */

    .badge-panel {
      margin: 0 2px 13px;
      padding: 12px 14px;
      border-radius: 17px;
      background: rgba(255,255,255,.68);
      font-size: 12px;
      line-height: 1.55;
      color: var(--muted);
    }

    .badge-panel[hidden] {
      display: none;
    }

    .badge-enable {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border-radius: 13px;
      background: white;
      color: var(--pink-dark);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-weight: 800;
      font-size: 12px;
    }

    /* ------------------------------
       GENERIC SWIPE ROW
    ------------------------------ */

    .swipe-row {
      position: relative;
      margin-bottom: 10px;
    }

    .swipe-delete-button {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: var(--delete-width);

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;
      background: var(--delete);
      color: white;

      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .03em;

      z-index: 1;
    }

    .swipe-surface {
      position: relative;
      z-index: 2;
      transform: translateX(0);
      transition:
        transform .28s cubic-bezier(.22,.8,.28,1),
        box-shadow .2s ease;
      touch-action: pan-y;
      will-change: transform;
    }

    /* ------------------------------
       HABIT LARGE CARD
    ------------------------------ */

    .habit-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .habit-card.large {
      padding: 15px;
    }

    .habit-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .drag-handle {
      flex: 0 0 auto;
      width: 25px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;

      background: transparent;
      color: #ceb7bf;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-weight: 800;
      font-size: 17px;

      cursor: grab;
      touch-action: none;
    }

    .habit-icon-button {
      flex: 0 0 auto;
      width: 43px;
      height: 43px;
      border-radius: 14px;
      background: var(--pink-soft);
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .habit-title-area {
      flex: 1;
      min-width: 0;
    }

    .habit-name {
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .habit-category {
      margin-top: 2px;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
    }

    .today-badge {
      flex: 0 0 auto;
      padding: 7px 11px;
      border-radius: 999px;
      background: #fff0f5;
      color: var(--pink-dark);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 12px;
      font-weight: 800;
      touch-action: none;
    }

    .today-badge.new-today {
      animation: todayPicon .43s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes todayPicon {
      0% {
        opacity: 0;
        transform: translateY(3px) scale(.35);
      }
      48% {
        opacity: 1;
        transform: translateY(-6px) scale(1.24);
      }
      72% {
        transform: translateY(1px) scale(.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .habit-progress-area {
      margin: 14px 0 0 35px;
    }

    .progress-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
    }

    .progress-text {
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
    }

    .done-label {
      color: var(--pink-dark);
    }

    .progress-track {
      height: 8px;
      border-radius: 999px;
      background: #f5ebef;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background:
        linear-gradient(
          90deg,
          #f1a9bf,
          #e889a7
        );
      transition:
        width .55s cubic-bezier(.34,1.56,.64,1);
    }

    .habit-controls {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 7px;
      margin-top: 11px;
    }

    .habit-count {
      min-width: 46px;
      text-align: center;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 13px;
      font-weight: 800;
    }

    .round-button {
      width: 37px;
      height: 37px;
      border-radius: 13px;
      background: var(--pink-soft);
      color: var(--pink-dark);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 19px;
      font-weight: 800;
      transition: transform .18s cubic-bezier(.34,1.56,.64,1);
    }

    .round-button.pop {
      animation: buttonPop .34s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes buttonPop {
      0% { transform: scale(.82); }
      55% { transform: scale(1.18); }
      76% { transform: scale(.95); }
      100% { transform: scale(1); }
    }

    /* ------------------------------
       HABIT COMPACT VIEW
    ------------------------------ */

    .habit-card.compact {
      min-height: 72px;
      padding: 10px 11px 9px 7px;
      display: grid;
      grid-template-columns: 25px 36px minmax(0,1fr) auto;
      align-items: center;
      gap: 7px;
    }

    .habit-card.compact .drag-handle {
      width: 25px;
      height: 48px;
    }

    .compact-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: var(--pink-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
    }

    .compact-main {
      min-width: 0;
    }

    .compact-line1 {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .compact-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 13px;
      font-weight: 800;
    }

    .compact-today {
      flex: 0 0 auto;
      font-size: 9px;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-weight: 800;
      color: var(--pink-dark);
      touch-action: none;
    }

    .compact-line2 {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 5px;
    }

    .compact-category {
      flex: 0 0 auto;
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
    }

    .compact-track {
      flex: 1;
      height: 5px;
      border-radius: 999px;
      background: #f5ebef;
      overflow: hidden;
    }

    .compact-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--pink);
      transition:
        width .5s cubic-bezier(.34,1.56,.64,1);
    }

    .compact-controls {
      display: grid;
      grid-template-columns: 29px 45px 29px;
      align-items: center;
      gap: 3px;
    }

    .compact-button {
      width: 29px;
      height: 29px;
      border-radius: 10px;
      background: var(--pink-soft);
      color: var(--pink-dark);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 16px;
      font-weight: 800;
    }

    .compact-count {
      text-align: center;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
    }

    /* ------------------------------
       DRAG
    ------------------------------ */

    .drag-placeholder {
      border-radius: var(--radius);
      background: rgba(255,255,255,.22);
      border: 2px dashed rgba(255,255,255,.55);
      margin-bottom: 10px;
    }

    .habit-row.drag-floating {
      position: fixed !important;
      z-index: 999 !important;
      margin: 0 !important;
      pointer-events: none;
      transition: none !important;
    }

    .habit-row.drag-floating .habit-card {
      transform: scale(1.025);
      box-shadow:
        0 16px 30px rgba(116, 68, 88, .15),
        0 4px 10px rgba(116, 68, 88, .10);
    }

    .habit-card.land-pop {
      animation: landPop .28s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes landPop {
      0% { transform: scale(1.025); }
      55% { transform: scale(.98); }
      100% { transform: scale(1); }
    }

    /* ------------------------------
       TODO
    ------------------------------ */

    .todo-card {
      min-height: 62px;
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 10px 13px;
      border-radius: 18px;
      background: white;
      box-shadow: var(--shadow);
    }

    .todo-card.done {
      opacity: .62;
    }

    .todo-check {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #fff7f9;
      border: 2px solid #efccd8;
      padding: 2px;

      transition:
        transform .18s cubic-bezier(.34,1.56,.64,1),
        background .18s ease;
    }

    .todo-check img {
      width: 31px;
      height: 31px;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    .todo-check.checked {
      border-color: transparent;
      background: transparent;
    }

    .todo-check.checked img {
      animation: hanamaruPop .42s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes hanamaruPop {
      0% {
        opacity: 0;
        transform: scale(.35) rotate(-9deg);
      }
      56% {
        opacity: 1;
        transform: scale(1.22) rotate(4deg);
      }
      78% {
        transform: scale(.94) rotate(-2deg);
      }
      100% {
        transform: scale(1) rotate(0);
      }
    }

    .todo-copy {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .todo-title {
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .todo-note {
      margin-top: 3px;
      font-size: 11px;
      line-height: 1.4;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .todo-note:empty {
      display: none;
    }

    /* ------------------------------
       MEMO
    ------------------------------ */

    .memo-card {
      padding: 13px 15px 14px;
      border-radius: 19px;
      background: white;
      box-shadow: var(--shadow);
    }

    .memo-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 7px;
    }

    .memo-edit {
      width: 25px;
      height: 25px;
      padding: 0;
      background: transparent;
      color: var(--pink);
      font-size: 17px;
      line-height: 1;
      transition:
        transform .18s cubic-bezier(.34,1.56,.64,1),
        color .18s ease;
    }

    .memo-edit:active {
      transform: scale(.72);
      color: var(--pink-dark);
    }

    .memo-date {
      color: var(--pink-dark);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .memo-text {
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /* ------------------------------
       EMPTY
    ------------------------------ */

    .empty {
      padding: 46px 18px;
      text-align: center;
      color: rgba(100,80,88,.46);
      font-size: 12px;
      line-height: 1.8;
    }

    .empty-symbol {
      display: block;
      margin-bottom: 8px;
      font-size: 27px;
    }

    /* ------------------------------
       NEW ITEM
    ------------------------------ */

    .new-row {
      animation: cardDrop .38s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes cardDrop {
      0% {
        opacity: 0;
        transform: translateY(-9px) scale(.94);
      }
      68% {
        opacity: 1;
        transform: translateY(2px) scale(1.015);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ------------------------------
       SHEETS
    ------------------------------ */

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      padding-top: env(safe-area-inset-top);

      background: rgba(75, 53, 62, .19);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);

      opacity: 0;
      visibility: hidden;
      transition:
        opacity .2s ease,
        visibility .2s ease;
    }

    .sheet-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .sheet {
      width: min(100%, 640px);
      max-height: min(89vh, 760px);
      overflow-y: auto;

      border-radius: 28px 28px 0 0;
      background: #fffafc;

      padding:
        10px
        18px
        calc(21px + env(safe-area-inset-bottom));

      transform: translateY(110%);
      transition:
        transform .38s cubic-bezier(.34,1.18,.42,1);
    }

    .sheet-backdrop.open .sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 38px;
      height: 5px;
      margin: 0 auto 14px;
      border-radius: 999px;
      background: #ead6dd;
    }

    .sheet-title {
      margin: 0 0 17px;
      text-align: center;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 18px;
      font-weight: 800;
    }

    .field {
      margin-bottom: 15px;
    }

    .field-label {
      display: block;
      margin-bottom: 6px;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
    }

    .text-input,
    .text-area,
    .select-input {
      width: 100%;
      border: 2px solid #f2dfe5;
      outline: 0;
      border-radius: 15px;
      background: white;
      color: var(--text);
      padding: 12px 13px;
      font-size: 15px;
      transition: border-color .15s ease;
    }

    .text-input:focus,
    .text-area:focus,
    .select-input:focus {
      border-color: #efadc2;
    }

    .text-area {
      min-height: 105px;
      resize: vertical;
      line-height: 1.6;
    }

    .field-hint {
      margin-top: 5px;
      font-size: 10px;
      color: var(--muted);
    }

    .icon-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
    }

    .icon-choice {
      aspect-ratio: 1;
      border-radius: 11px;
      background: white;
      font-size: 19px;
      transition:
        transform .17s cubic-bezier(.34,1.56,.64,1),
        background .17s ease;
    }

    .icon-choice.selected {
      background: var(--pink-soft);
      transform: scale(1.08);
    }

    .goal-button {
      width: 100%;
      padding: 12px;
      border-radius: 15px;
      background: white;
      border: 2px solid #f2dfe5;
      color: var(--pink-dark);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 15px;
      font-weight: 800;
    }

    .sheet-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 20px;
    }

    .primary-button {
      width: 100%;
      padding: 13px;
      border-radius: 15px;
      background: var(--pink-dark);
      color: white;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 14px;
      font-weight: 800;
    }

    .danger-button {
      width: 100%;
      padding: 12px;
      border-radius: 15px;
      background: #fff0f1;
      color: var(--delete);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 12px;
      font-weight: 800;
    }

    .danger-button[hidden] {
      display: none;
    }

    /* ------------------------------
       WHEEL PICKER
    ------------------------------ */

    .wheel-sheet {
      width: min(100%, 440px);
    }

    .wheel-wrap {
      position: relative;
      height: 260px;
      overflow: hidden;
      border-radius: 20px;
      background: white;
    }

    .wheel-highlight {
      position: absolute;
      z-index: 1;
      top: 104px;
      left: 14px;
      right: 14px;
      height: 52px;
      border-radius: 15px;
      background: var(--pink-soft);
      pointer-events: none;
    }

    .wheel-list {
      position: relative;
      z-index: 2;
      height: 260px;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      padding: 104px 0;
    }

    .wheel-list::-webkit-scrollbar {
      display: none;
    }

    .wheel-item {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-snap-align: center;

      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #baa8ae;

      transition:
        transform .15s ease,
        color .15s ease;
    }

    .wheel-item.selected {
      color: var(--pink-dark);
      transform: scale(1.2);
    }

    /* ------------------------------
       SMALL HELPERS
    ------------------------------ */

    .soft-button {
      width: 100%;
      padding: 11px;
      border-radius: 14px;
      background: white;
      color: var(--pink-dark);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 12px;
      font-weight: 800;
      transition: transform .18s cubic-bezier(.34,1.56,.64,1);
    }

    @media (max-width: 410px) {
      .habit-card.compact {
        grid-template-columns: 22px 33px minmax(0,1fr) auto;
        gap: 5px;
      }

      .compact-controls {
        grid-template-columns: 27px 37px 27px;
      }

      .compact-button {
        width: 27px;
        height: 27px;
      }

      .icon-grid {
        grid-template-columns: repeat(6, 1fr);
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="header">
      <p class="app-name">HABITS</p>
      <h1 class="date-main" id="dateMain"></h1>
      <div class="date-sub" id="dateSub"></div>
    </header>

    <div class="nav-sticky">
      <nav class="main-tabs">
        <button class="main-tab active" data-tab="habits">ハビット</button>
        <button class="main-tab" data-tab="todos">Todo</button>
        <button class="main-tab" data-tab="memos">メモ</button>
        <button class="main-add" id="mainAddButton" aria-label="追加">＋</button>
      </nav>
    </div>

    <main class="content">

      <!-- HABITS -->
      <section class="section active" id="habitsSection">

        <div class="habit-toolbar">
          <div class="habit-filters">
            <button class="filter-button active" data-filter="all">すべて</button>
            <button class="filter-button" data-filter="daily">日常</button>
            <button class="filter-button" data-filter="creative">創作</button>
            <button class="filter-button" data-filter="game">ゲーム</button>
          </div>

          <div class="view-switcher" aria-label="表示切り替え">
            <button class="view-button" id="cardViewButton"
                    aria-label="カード表示"
                    title="カード表示">▦</button>

            <button class="view-button" id="compactViewButton"
                    aria-label="一覧表示"
                    title="一覧表示">≡</button>
          </div>
        </div>

        <div class="badge-panel" id="badgePanel" hidden>
          <div id="badgeMessage">
            ホーム画面アイコンに、まだTODAYになっていないハビット数を表示できます。
          </div>
          <button class="badge-enable" id="badgeEnableButton">
            🔔 ホーム画面バッジを有効にする
          </button>
        </div>

        <div id="habitList"></div>
      </section>

      <!-- TODO -->
      <section class="section" id="todosSection">
        <div id="todoList"></div>
      </section>

      <!-- MEMO -->
      <section class="section" id="memosSection">
        <div id="memoList"></div>
      </section>

    </main>
  </div>


  <!-- HABIT EDITOR -->
  <div class="sheet-backdrop" id="habitSheetBackdrop">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title" id="habitSheetTitle">ハビット追加</h2>

      <div class="field">
        <label class="field-label" for="habitNameInput">ハビット名</label>
        <input class="text-input"
               id="habitNameInput"
               type="text"
               maxlength="40"
               placeholder="例：水を飲む" />
      </div>

      <div class="field">
        <div class="field-label">アイコン</div>
        <div class="icon-grid" id="iconGrid"></div>
      </div>

      <div class="field">
        <label class="field-label" for="habitCategoryInput">カテゴリー</label>
        <select class="select-input" id="habitCategoryInput">
          <option value="daily">日常</option>
          <option value="creative">創作</option>
          <option value="game">ゲーム</option>
        </select>
      </div>

      <div class="field">
        <div class="field-label">目標回数</div>
        <button class="goal-button" id="goalButton">
          1 回
        </button>
      </div>

      <div class="field">
        <label class="field-label" for="barResetInput">進捗バーのリセット</label>
        <select class="select-input" id="barResetInput">
          <option value="none">リセットしない</option>
          <option value="midnight">毎日 0:00</option>
          <option value="four">毎日 4:00</option>
        </select>
      </div>

      <div class="sheet-actions">
        <button class="primary-button" id="saveHabitButton">保存</button>
        <button class="danger-button" id="deleteHabitFromEditor" hidden>
          このハビットを削除
        </button>
      </div>
    </div>
  </div>


  <!-- TODO EDITOR -->
  <div class="sheet-backdrop" id="todoSheetBackdrop">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title" id="todoSheetTitle">Todo追加</h2>

      <div class="field">
        <label class="field-label" for="todoTitleInput">タイトル</label>
        <input class="text-input"
               id="todoTitleInput"
               type="text"
               maxlength="70"
               placeholder="例：牛乳を買う" />
      </div>

      <div class="field">
        <label class="field-label" for="todoNoteInput">
          一言メモ
        </label>
        <input class="text-input"
               id="todoNoteInput"
               type="text"
               maxlength="120"
               placeholder="入力しなくてもOK" />
        <div class="field-hint">補足がなければ空欄のままで大丈夫。</div>
      </div>

      <div class="sheet-actions">
        <button class="primary-button" id="saveTodoButton">保存</button>
        <button class="danger-button" id="deleteTodoFromEditor" hidden>
          このTodoを削除
        </button>
      </div>
    </div>
  </div>


  <!-- MEMO EDITOR -->
  <div class="sheet-backdrop" id="memoSheetBackdrop">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title" id="memoSheetTitle">一言メモ</h2>

      <div class="field">
        <label class="field-label" for="memoTextInput">メモ</label>
        <textarea class="text-area"
                  id="memoTextInput"
                  maxlength="180"
                  placeholder="今日やったことを、ひとこと。"></textarea>

        <div class="field-hint">
          新規作成時の日付は自動で記録されます。
        </div>
      </div>

      <div class="sheet-actions">
        <button class="primary-button" id="saveMemoButton">保存</button>
        <button class="danger-button" id="deleteMemoFromEditor" hidden>
          このメモを削除
        </button>
      </div>
    </div>
  </div>


  <!-- GOAL WHEEL -->
  <div class="sheet-backdrop" id="wheelBackdrop">
    <div class="sheet wheel-sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title">目標回数</h2>

      <div class="wheel-wrap">
        <div class="wheel-highlight"></div>
        <div class="wheel-list" id="wheelList"></div>
      </div>

      <div class="sheet-actions">
        <button class="primary-button" id="wheelDoneButton">
          決定
        </button>
      </div>
    </div>
  </div>


<script>
(() => {
  "use strict";

  /* =========================================================
     CONSTANTS
  ========================================================= */

  const STORAGE_KEY = "habitTrackerData";

  const MAX_GOAL = 30;
  const WHEEL_ITEM_HEIGHT = 52;

  const DELETE_REVEAL_WIDTH = 88;
  const SWIPE_OPEN_THRESHOLD = 34;

  const SWAP_OVERLAP_RATIO = 0.25;
  const REVERSE_UNLOCK_DISTANCE = 46;

  const ICONS = [
    "🌷","💗","💧","🎨","✏️","📖","🧹","🛁",
    "💊","🌱","⭐","🐰","🎮","🕹️","🎧","☕"
  ];

  const CATEGORY_NAMES = {
    daily: "日常",
    creative: "創作",
    game: "ゲーム"
  };


  /* =========================================================
     STATE
  ========================================================= */

  let data = loadData();

  let currentTab = "habits";
  let currentHabitFilter = "all";

  let editingHabitId = null;
  let editingTodoId = null;
  let editingMemoId = null;

  let selectedHabitIcon = ICONS[0];
  let selectedGoal = 1;

  let newHabitId = null;
  let newTodoId = null;
  let newMemoId = null;
  let newTodayHabitId = null;

  let suppressClickUntil = 0;

  let openSwipeRow = null;
  let swipeGesture = null;

  let dragPending = null;
  let dragState = null;

  let todayPress = null;


  /* =========================================================
     DOM
  ========================================================= */

  const dateMain = document.getElementById("dateMain");
  const dateSub = document.getElementById("dateSub");

  const habitList = document.getElementById("habitList");
  const todoList = document.getElementById("todoList");
  const memoList = document.getElementById("memoList");

  const mainAddButton = document.getElementById("mainAddButton");

  const cardViewButton = document.getElementById("cardViewButton");
  const compactViewButton = document.getElementById("compactViewButton");

  const badgePanel = document.getElementById("badgePanel");
  const badgeMessage = document.getElementById("badgeMessage");
  const badgeEnableButton = document.getElementById("badgeEnableButton");

  const habitSheetBackdrop =
    document.getElementById("habitSheetBackdrop");

  const habitSheetTitle =
    document.getElementById("habitSheetTitle");

  const habitNameInput =
    document.getElementById("habitNameInput");

  const habitCategoryInput =
    document.getElementById("habitCategoryInput");

  const barResetInput =
    document.getElementById("barResetInput");

  const iconGrid =
    document.getElementById("iconGrid");

  const goalButton =
    document.getElementById("goalButton");

  const saveHabitButton =
    document.getElementById("saveHabitButton");

  const deleteHabitFromEditor =
    document.getElementById("deleteHabitFromEditor");


  const todoSheetBackdrop =
    document.getElementById("todoSheetBackdrop");

  const todoSheetTitle =
    document.getElementById("todoSheetTitle");

  const todoTitleInput =
    document.getElementById("todoTitleInput");

  const todoNoteInput =
    document.getElementById("todoNoteInput");

  const saveTodoButton =
    document.getElementById("saveTodoButton");

  const deleteTodoFromEditor =
    document.getElementById("deleteTodoFromEditor");


  const memoSheetBackdrop =
    document.getElementById("memoSheetBackdrop");

  const memoSheetTitle =
    document.getElementById("memoSheetTitle");

  const memoTextInput =
    document.getElementById("memoTextInput");

  const saveMemoButton =
    document.getElementById("saveMemoButton");

  const deleteMemoFromEditor =
    document.getElementById("deleteMemoFromEditor");


  const wheelBackdrop =
    document.getElementById("wheelBackdrop");

  const wheelList =
    document.getElementById("wheelList");

  const wheelDoneButton =
    document.getElementById("wheelDoneButton");


  /* =========================================================
     DATA
  ========================================================= */

  function defaultData() {
    return {
      habits: [],
      todos: [],
      memos: [],
      settings: {
        habitView: "card"
      }
    };
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);

      if (!raw) {
        return defaultData();
      }

      const parsed = JSON.parse(raw);

      if (!Array.isArray(parsed.habits)) {
        parsed.habits = [];
      }

      if (!Array.isArray(parsed.todos)) {
        parsed.todos = [];
      }

      if (!Array.isArray(parsed.memos)) {
        parsed.memos = [];
      }

      if (!parsed.settings ||
          typeof parsed.settings !== "object") {
        parsed.settings = {};
      }

      if (!["card","compact"].includes(parsed.settings.habitView)) {
        parsed.settings.habitView = "card";
      }

      parsed.habits = parsed.habits.map((habit) => ({
        id: habit.id || createId(),
        name: habit.name || "ハビット",
        icon: habit.icon || "🌷",
        category: CATEGORY_NAMES[habit.category]
          ? habit.category
          : "daily",

        goal: Math.max(
          1,
          Number(habit.goal || 1)
        ),

        count: Math.max(
          0,
          Number(habit.count || 0)
        ),

        barReset:
          ["none","midnight","four"].includes(habit.barReset)
            ? habit.barReset
            : "none",

        barResetKey:
          habit.barResetKey || null,

        lastDoneAt:
          Number(habit.lastDoneAt || 0) || null
      }));

      parsed.todos = parsed.todos.map((todo) => ({
        id: todo.id || createId(),
        title: String(todo.title || ""),
        note: String(todo.note || ""),
        done: Boolean(todo.done),
        createdAt:
          Number(todo.createdAt) || Date.now(),
        completedAt:
          Number(todo.completedAt) || null
      }));

      parsed.memos = parsed.memos.map((memo) => ({
        id: memo.id || createId(),
        text: String(memo.text || ""),
        createdAt:
          Number(memo.createdAt) || Date.now(),
        updatedAt:
          Number(memo.updatedAt) || null
      }));

      return parsed;

    } catch (error) {
      console.error("データ読込エラー:", error);
      return defaultData();
    }
  }

  function saveData() {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );
  }

  function createId() {
    if (crypto && crypto.randomUUID) {
      return crypto.randomUUID();
    }

    return (
      Date.now().toString(36) +
      Math.random().toString(36).slice(2)
    );
  }


  /* =========================================================
     HELPERS
  ========================================================= */

  function escapeHTML(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function closeAllSheets() {
    [
      habitSheetBackdrop,
      todoSheetBackdrop,
      memoSheetBackdrop,
      wheelBackdrop
    ].forEach((sheet) => {
      sheet.classList.remove("open");
    });
  }


  /* =========================================================
     DATE
  ========================================================= */

  function renderDate() {
    const now = new Date();

    dateMain.textContent =
      `${now.getMonth() + 1}月${now.getDate()}日`;

    const weekdays = [
      "日曜日","月曜日","火曜日","水曜日",
      "木曜日","金曜日","土曜日"
    ];

    dateSub.textContent =
      `${now.getFullYear()}年 ${weekdays[now.getDay()]}`;
  }


  /* =========================================================
     PERIOD / RESET
  ========================================================= */

  function getPeriodKey(timestamp, resetHour) {
    const date = new Date(timestamp);

    const shifted =
      new Date(
        date.getTime() -
        resetHour * 60 * 60 * 1000
      );

    return [
      shifted.getFullYear(),
      String(shifted.getMonth() + 1).padStart(2, "0"),
      String(shifted.getDate()).padStart(2, "0")
    ].join("-");
  }

  function getBarResetHour(habit) {
    if (habit.barReset === "midnight") return 0;
    if (habit.barReset === "four") return 4;
    return null;
  }

  function getTodayResetHour(habit) {
    if (habit.category === "game") {
      return 4;
    }

    return 0;
  }

  function isDoneToday(habit) {
    if (!habit.lastDoneAt) {
      return false;
    }

    const resetHour =
      getTodayResetHour(habit);

    return (
      getPeriodKey(
        habit.lastDoneAt,
        resetHour
      ) ===
      getPeriodKey(
        Date.now(),
        resetHour
      )
    );
  }

  function applyHabitResets() {
    let changed = false;

    for (const habit of data.habits) {
      const resetHour =
        getBarResetHour(habit);

      if (resetHour === null) {
        continue;
      }

      const nowKey =
        getPeriodKey(
          Date.now(),
          resetHour
        );

      if (!habit.barResetKey) {
        habit.barResetKey = nowKey;
        changed = true;
        continue;
      }

      if (habit.barResetKey !== nowKey) {
        habit.count = 0;
        habit.barResetKey = nowKey;
        changed = true;
      }
    }

    if (changed) {
      saveData();
    }

    return changed;
  }


  /* =========================================================
     MAIN RENDER
  ========================================================= */

  function renderAll() {
    applyHabitResets();
    renderDate();
    renderNavigation();
    renderHabits();
    renderTodos();
    renderMemos();
    renderBadgePanel();
    updateAppBadge();
  }

  function renderNavigation() {
    document
      .querySelectorAll(".main-tab")
      .forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset.tab === currentTab
        );
      });

    document
      .querySelectorAll(".section")
      .forEach((section) => {
        section.classList.remove("active");
      });

    const sectionMap = {
      habits: "habitsSection",
      todos: "todosSection",
      memos: "memosSection"
    };

    document
      .getElementById(sectionMap[currentTab])
      .classList.add("active");
  }


  /* =========================================================
     HABITS RENDER
  ========================================================= */

  function renderHabits() {
    const view =
      data.settings.habitView;

    cardViewButton.classList.toggle(
      "active",
      view === "card"
    );

    compactViewButton.classList.toggle(
      "active",
      view === "compact"
    );

    document
      .querySelectorAll(".filter-button")
      .forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset.filter === currentHabitFilter
        );
      });

    const visible =
      data.habits.filter((habit) => {
        if (currentHabitFilter === "all") {
          return true;
        }

        return habit.category === currentHabitFilter;
      });

    if (visible.length === 0) {
      habitList.innerHTML = `
        <div class="empty">
          <span class="empty-symbol">🌷</span>
          まだハビットがありません。<br>
          ＋から追加できます。
        </div>
      `;

      return;
    }

    habitList.innerHTML =
      visible
        .map((habit) => {
          return view === "card"
            ? habitLargeHTML(habit)
            : habitCompactHTML(habit);
        })
        .join("");

    bindSwipeSurfaces(habitList);

    if (newHabitId) {
      setTimeout(() => {
        newHabitId = null;
      }, 500);
    }

    if (newTodayHabitId) {
      setTimeout(() => {
        newTodayHabitId = null;
      }, 500);
    }
  }

  function habitLargeHTML(habit) {
    const percent =
      clamp(
        (habit.count / habit.goal) * 100,
        0,
        100
      );

    const done =
      habit.count >= habit.goal;

    const today =
      isDoneToday(habit);

    const newRowClass =
      habit.id === newHabitId
        ? " new-row"
        : "";

    const newTodayClass =
      habit.id === newTodayHabitId
        ? " new-today"
        : "";

    return `
      <div class="habit-row swipe-row${newRowClass}"
           data-id="${habit.id}">

        <button class="swipe-delete-button"
                data-action="delete-habit"
                data-id="${habit.id}">
          削除
        </button>

        <div class="habit-card large swipe-surface">

          <div class="habit-top">

            <button class="drag-handle"
                    data-action="drag"
                    aria-label="並び替え">
              ≡
            </button>

            <button class="habit-icon-button"
                    data-action="edit-habit"
                    data-id="${habit.id}"
                    aria-label="編集">
              ${escapeHTML(habit.icon)}
            </button>

            <div class="habit-title-area">
              <div class="habit-name">
                ${escapeHTML(habit.name)}
              </div>
              <div class="habit-category">
                ${CATEGORY_NAMES[habit.category]}
              </div>
            </div>

            ${
              today
                ? `
                  <div class="today-badge${newTodayClass}"
                       data-action="today-badge"
                       data-id="${habit.id}">
                    TODAY ✓
                  </div>
                `
                : ""
            }

          </div>

          <div class="habit-progress-area">

            <div class="progress-info">
              <div class="progress-text ${done ? "done-label" : ""}">
                ${done ? "✓ DONE" : "PROGRESS"}
              </div>

              <div class="habit-count">
                ${habit.count} / ${habit.goal}
              </div>
            </div>

            <div class="progress-track">
              <div class="progress-fill"
                   style="width:${percent}%"></div>
            </div>

            <div class="habit-controls">

              <button class="round-button"
                      data-action="habit-minus"
                      data-id="${habit.id}">
                −
              </button>

              <button class="round-button"
                      data-action="habit-plus"
                      data-id="${habit.id}">
                ＋
              </button>

            </div>

          </div>

        </div>
      </div>
    `;
  }

  function habitCompactHTML(habit) {
    const percent =
      clamp(
        (habit.count / habit.goal) * 100,
        0,
        100
      );

    const done =
      habit.count >= habit.goal;

    const today =
      isDoneToday(habit);

    const newRowClass =
      habit.id === newHabitId
        ? " new-row"
        : "";

    return `

  /* =========================================================
     SWIPE TO REVEAL
  ========================================================= */

  function bindSwipeSurfaces(container) {
    container
      .querySelectorAll(".swipe-surface")
      .forEach((surface) => {

        surface.addEventListener(
          "pointerdown",
          startSwipe
        );

      });
  }

  function isSwipeBlockedTarget(target) {
    return Boolean(
      target.closest(
        "button," +
        ".today-badge," +
        ".compact-today," +
        "input," +
        "textarea," +
        "select," +
        "a"
      )
    );
  }

  function startSwipe(event) {
    if (dragState || dragPending) {
      return;
    }

    if (isSwipeBlockedTarget(event.target)) {
      return;
    }

    const surface =
      event.currentTarget;

    const row =
      surface.closest(".swipe-row");

    if (!row) return;

    if (
      openSwipeRow &&
      openSwipeRow !== row
    ) {
      closeOpenSwipe();
    }

    const wasOpen =
      row === openSwipeRow;

    swipeGesture = {
      pointerId: event.pointerId,
      row,
      surface,
      startX: event.clientX,
      startY: event.clientY,
      startOffset:
        wasOpen
          ? -DELETE_REVEAL_WIDTH
          : 0,
      currentOffset:
        wasOpen
          ? -DELETE_REVEAL_WIDTH
          : 0,
      mode: null,
      moved: false,
      wasOpen
    };

    surface.style.transition = "none";
  }

  window.addEventListener(
    "pointermove",
    (event) => {

      if (!swipeGesture) {
        return;
      }

      if (
        event.pointerId !==
        swipeGesture.pointerId
      ) {
        return;
      }

      const dx =
        event.clientX -
        swipeGesture.startX;

      const dy =
        event.clientY -
        swipeGesture.startY;

      if (!swipeGesture.mode) {
        if (
          Math.abs(dx) < 6 &&
          Math.abs(dy) < 6
        ) {
          return;
        }

        if (
          Math.abs(dx) >
          Math.abs(dy) * 1.16
        ) {
          swipeGesture.mode = "horizontal";
        } else {
          swipeGesture.mode = "vertical";
          swipeGesture.surface.style.transition = "";
          swipeGesture = null;
          return;
        }
      }

      if (
        swipeGesture.mode !== "horizontal"
      ) {
        return;
      }

      event.preventDefault();

      swipeGesture.moved = true;

      let offset =
        swipeGesture.startOffset + dx;

      if (offset > 0) {
        offset *= .22;
      }

      if (
        offset <
        -DELETE_REVEAL_WIDTH
      ) {
        const overflow =
          offset +
          DELETE_REVEAL_WIDTH;

        offset =
          -DELETE_REVEAL_WIDTH +
          overflow * .22;
      }

      swipeGesture.currentOffset = offset;

      swipeGesture.surface.style.transform =
        `translateX(${offset}px)`;
    },
    { passive: false }
  );

  window.addEventListener(
    "pointerup",
    finishSwipe
  );

  window.addEventListener(
    "pointercancel",
    finishSwipe
  );

  function finishSwipe(event) {
    if (!swipeGesture) {
      return;
    }

    if (
      event.pointerId !==
      swipeGesture.pointerId
    ) {
      return;
    }

    const gesture =
      swipeGesture;

    swipeGesture = null;

    gesture.surface.style.transition = "";

    if (!gesture.moved) {
      if (gesture.wasOpen) {
        closeSwipeRow(gesture.row);
        suppressClickUntil =
          Date.now() + 220;
      }

      return;
    }

    suppressClickUntil =
      Date.now() + 220;

    const shouldOpen =
      gesture.currentOffset <
      -SWIPE_OPEN_THRESHOLD;

    if (shouldOpen) {
      openSwipe(gesture.row);
    } else {
      closeSwipeRow(gesture.row);
    }
  }

  function openSwipe(row) {
    if (
      openSwipeRow &&
      openSwipeRow !== row
    ) {
      closeSwipeRow(openSwipeRow);
    }

    const surface =
      row.querySelector(".swipe-surface");

    if (!surface) return;

    surface.style.transform =
      `translateX(-${DELETE_REVEAL_WIDTH}px)`;

    openSwipeRow = row;
  }

  function closeSwipeRow(row) {
    if (!row) return;

    const surface =
      row.querySelector(".swipe-surface");

    if (surface) {
      surface.style.transform =
        "translateX(0px)";
    }

    if (openSwipeRow === row) {
      openSwipeRow = null;
    }
  }

  function closeOpenSwipe() {
    if (!openSwipeRow) {
      return;
    }

    closeSwipeRow(openSwipeRow);
  }

  document.addEventListener("pointerdown", (event) => {
    if (!openSwipeRow) return;

    if (
      !event.target.closest(".swipe-row")
    ) {
      closeOpenSwipe();
    }
  });


  /* =========================================================
     TODAY LONG PRESS
  ========================================================= */

  habitList.addEventListener(
    "pointerdown",
    (event) => {

      const badge =
        event.target.closest(
          '[data-action="today-badge"]'
        );

      if (!badge) return;

      event.preventDefault();

      const id =
        badge.dataset.id;

      todayPress = {
        pointerId: event.pointerId,
        id,
        startX: event.clientX,
        startY: event.clientY,
        fired: false,
        timer: setTimeout(() => {

          if (!todayPress) return;

          const habit =
            data.habits.find(
              (item) =>
                item.id === todayPress.id
            );

          if (!habit) {
            todayPress = null;
            return;
          }

          habit.lastDoneAt = null;

          todayPress.fired = true;

          saveData();
          renderHabits();
          updateAppBadge();

          todayPress = null;

        }, 550)
      };
    }
  );

  window.addEventListener(
    "pointermove",
    (event) => {

      if (!todayPress) return;

      if (
        event.pointerId !==
        todayPress.pointerId
      ) {
        return;
      }

      const dx =
        event.clientX -
        todayPress.startX;

      const dy =
        event.clientY -
        todayPress.startY;

      if (
        Math.hypot(dx, dy) > 10
      ) {
        clearTimeout(todayPress.timer);
        todayPress = null;
      }
    }
  );

  function cancelTodayPress(event) {
    if (!todayPress) return;

    if (
      event.pointerId !==
      todayPress.pointerId
    ) {
      return;
    }

    clearTimeout(todayPress.timer);
    todayPress = null;
  }

  window.addEventListener(
    "pointerup",
    cancelTodayPress
  );

  window.addEventListener(
    "pointercancel",
    cancelTodayPress
  );

  habitList.addEventListener(
    "contextmenu",
    (event) => {
      if (
        event.target.closest(
          ".today-badge,.compact-today,.drag-handle"
        )
      ) {
        event.preventDefault();
      }
    }
  );


  /* =========================================================
     HABIT DRAG REORDER
  ========================================================= */

  habitList.addEventListener(
    "pointerdown",
    (event) => {

      const handle =
        event.target.closest(".drag-handle");

      if (!handle) return;

      const row =
        handle.closest(".habit-row");

      if (!row) return;

      closeOpenSwipe();

      dragPending = {
        pointerId: event.pointerId,
        row,
        id: row.dataset.id,
        startX: event.clientX,
        startY: event.clientY,
        currentY: event.clientY,
        timer: null
      };

      dragPending.timer =
        setTimeout(() => {

          if (!dragPending) {
            return;
          }

          beginDrag(
            dragPending.row,
            dragPending.id,
            dragPending.currentY,
            dragPending.pointerId
          );

          dragPending = null;

        }, 380);
    }
  );

  window.addEventListener(
    "pointermove",
    (event) => {

      if (
        dragPending &&
        event.pointerId ===
        dragPending.pointerId
      ) {
        dragPending.currentY =
          event.clientY;

        const moved =
          Math.hypot(
            event.clientX -
              dragPending.startX,
            event.clientY -
              dragPending.startY
          );

        if (moved > 9) {
          clearTimeout(
            dragPending.timer
          );

          dragPending = null;
        }
      }

      if (
        dragState &&
        event.pointerId ===
        dragState.pointerId
      ) {
        event.preventDefault();
        updateDrag(event.clientY);
      }

    },
    { passive: false }
  );

  window.addEventListener(
    "pointerup",
    (event) => {

      if (
        dragPending &&
        event.pointerId ===
        dragPending.pointerId
      ) {
        clearTimeout(
          dragPending.timer
        );

        dragPending = null;
      }

      if (
        dragState &&
        event.pointerId ===
        dragState.pointerId
      ) {
        finishDrag();
      }
    }
  );

  window.addEventListener(
    "pointercancel",
    (event) => {

      if (
        dragPending &&
        event.pointerId ===
        dragPending.pointerId
      ) {
        clearTimeout(
          dragPending.timer
        );

        dragPending = null;
      }

      if (
        dragState &&
        event.pointerId ===
        dragState.pointerId
      ) {
        finishDrag();
      }
    }
  );

  function beginDrag(
    row,
    id,
    pointerY,
    pointerId
  ) {
    const rect =
      row.getBoundingClientRect();

    const placeholder =
      document.createElement("div");

    placeholder.className =
      "drag-placeholder";

    placeholder.style.height =
      `${rect.height}px`;

    row.parentNode.insertBefore(
      placeholder,
      row
    );

    const offsetY =
      pointerY - rect.top;

    document.body.appendChild(row);

    row.classList.add("drag-floating");

    Object.assign(
      row.style,
      {
        left: `${rect.left}px`,
        top: `${rect.top}px`,
        width: `${rect.width}px`,
        height: `${rect.height}px`
      }
    );

    dragState = {
      pointerId,
      row,
      id,
      placeholder,
      offsetY,
      pointerY,
      lastPointerY: pointerY,
      lastSwapDirection: null,
      lastSwapPointerY: null
    };

    navigator.vibrate?.(18);
  }

  function updateDrag(pointerY) {
    if (!dragState) return;

    const state =
      dragState;

    const previousY =
      state.pointerY;

    state.lastPointerY = previousY;
    state.pointerY = pointerY;

    const top =
      pointerY -
      state.offsetY;

    state.row.style.top =
      `${top}px`;

    const direction =
      pointerY > previousY
        ? "down"
        : pointerY < previousY
          ? "up"
          : null;

    if (!direction) {
      return;
    }

    if (
      state.lastSwapDirection &&
      direction !== state.lastSwapDirection &&
      state.lastSwapPointerY !== null &&
      Math.abs(
        pointerY -
        state.lastSwapPointerY
      ) < REVERSE_UNLOCK_DISTANCE
    ) {
      autoScroll(pointerY);
      return;
    }

    if (direction === "down") {
      const next =
        findAdjacentHabitRow(
          state.placeholder,
          "next"
        );

      if (next) {
        const nextRect =
          next.getBoundingClientRect();

        const movingRect =
          state.row.getBoundingClientRect();

        const overlap =
          movingRect.bottom -
          nextRect.top;

        if (
          overlap >=
          nextRect.height *
          SWAP_OVERLAP_RATIO
        ) {
          const before =
            next.getBoundingClientRect();

          next.parentNode.insertBefore(
            state.placeholder,
            next.nextSibling
          );

          swapHabitPositions(
            state.id,
            next.dataset.id
          );

          animateFlip(
            next,
            before
          );

          state.lastSwapDirection =
            "down";

          state.lastSwapPointerY =
            pointerY;
        }
      }

    } else {

      const previous =
        findAdjacentHabitRow(
          state.placeholder,
          "previous"
        );

      if (previous) {
        const previousRect =
          previous.getBoundingClientRect();

        const movingRect =
          state.row.getBoundingClientRect();

        const overlap =
          previousRect.bottom -
          movingRect.top;

        if (
          overlap >=
          previousRect.height *
          SWAP_OVERLAP_RATIO
        ) {
          const before =
            previous.getBoundingClientRect();

          previous.parentNode.insertBefore(
            state.placeholder,
            previous
          );

          swapHabitPositions(
            state.id,
            previous.dataset.id
          );

          animateFlip(
            previous,
            before
          );

          state.lastSwapDirection =
            "up";

          state.lastSwapPointerY =
            pointerY;
        }
      }
    }

    autoScroll(pointerY);
  }

  function findAdjacentHabitRow(
    placeholder,
    direction
  ) {
    let node =
      direction === "next"
        ? placeholder.nextElementSibling
        : placeholder.previousElementSibling;

    while (node) {
      if (
        node.classList &&
        node.classList.contains(
          "habit-row"
        )
      ) {
        return node;
      }

      node =
        direction === "next"
          ? node.nextElementSibling
          : node.previousElementSibling;
    }

    return null;
  }

  function swapHabitPositions(
    idA,
    idB
  ) {
    const indexA =
      data.habits.findIndex(
        (habit) => habit.id === idA
      );

    const indexB =
      data.habits.findIndex(
        (habit) => habit.id === idB
      );

    if (
      indexA < 0 ||
      indexB < 0
    ) {
      return;
    }

    [
      data.habits[indexA],
      data.habits[indexB]
    ] = [
      data.habits[indexB],
      data.habits[indexA]
    ];
  }

  function animateFlip(
    element,
    before
  ) {
    const after =
      element.getBoundingClientRect();

    const dy =
      before.top -
      after.top;

    if (!dy) return;

    element.style.transition = "none";
    element.style.transform =
      `translateY(${dy}px)`;

    requestAnimationFrame(() => {
      element.style.transition =
        "transform .28s cubic-bezier(.22,.8,.28,1)";

      element.style.transform =
        "translateY(0)";
    });

    setTimeout(() => {
      element.style.transition = "";
      element.style.transform = "";
    }, 310);
  }

  function autoScroll(pointerY) {
    const edge = 92;

    if (pointerY < edge) {
      window.scrollBy(
        0,
        -Math.max(
          5,
          (edge - pointerY) * .13
        )
      );

      return;
    }

    if (
      pointerY >
      window.innerHeight - edge
    ) {
      window.scrollBy(
        0,
        Math.max(
          5,
          (
            pointerY -
            (window.innerHeight - edge)
          ) * .13
        )
      );
    }
  }

  function finishDrag() {
    if (!dragState) return;

    const state =
      dragState;

    const parent =
      state.placeholder.parentNode;

    parent.insertBefore(
      state.row,
      state.placeholder
    );

    state.placeholder.remove();

    state.row.classList.remove(
      "drag-floating"
    );

    Object.assign(
      state.row.style,
      {
        left: "",
        top: "",
        width: "",
        height: ""
      }
    );

    const card =
      state.row.querySelector(
        ".habit-card"
      );

    if (card) {
      card.classList.add("land-pop");
    }

    saveData();

    dragState = null;

    setTimeout(() => {
      renderHabits();
    }, 280);
  }

  function forceFinishDrag() {
    if (dragPending) {
      clearTimeout(
        dragPending.timer
      );

      dragPending = null;
    }

    if (dragState) {
      finishDrag();
    }
  }

  window.addEventListener(
    "blur",
    forceFinishDrag
  );

  document.addEventListener(
    "visibilitychange",
    () => {
      if (document.hidden) {
        forceFinishDrag();
      }
    }
  );


  /* =========================================================
     APP BADGE
  ========================================================= */

  function getRemainingTodayCount() {
    return data.habits.filter(
      (habit) =>
        !isDoneToday(habit)
    ).length;
  }

  async function updateAppBadge() {
    if (!("setAppBadge" in navigator)) {
      return;
    }

    const remaining =
      getRemainingTodayCount();

    try {
      if (remaining > 0) {
        await navigator.setAppBadge(
          remaining
        );
      } else {
        await navigator.clearAppBadge();
      }
    } catch (error) {
      console.warn(
        "Badge update failed:",
        error
      );
    }
  }

  function renderBadgePanel() {
    if (currentTab !== "habits") {
      badgePanel.hidden = true;
      return;
    }

    if (!("Notification" in window)) {
      badgePanel.hidden = true;
      return;
    }

    if (
      Notification.permission ===
      "granted"
    ) {
      badgePanel.hidden = true;
      return;
    }

    badgePanel.hidden = false;

    if (
      Notification.permission ===
      "denied"
    ) {
      badgeMessage.textContent =
        "通知がオフになっています。iPhoneの設定からこのWebアプリの通知を許可すると、ホーム画面バッジを使えます。";

      badgeEnableButton.hidden = true;
    } else {
      badgeMessage.textContent =
        "ホーム画面アイコンに、まだTODAYになっていないハビット数を表示できます。";

      badgeEnableButton.hidden = false;
    }
  }

  badgeEnableButton.addEventListener(
    "click",
    async () => {

      if (!("Notification" in window)) {
        return;
      }

      try {
        const permission =
          await Notification.requestPermission();

        renderBadgePanel();

        if (permission === "granted") {
          updateAppBadge();
        }

      } catch (error) {
        console.warn(
          "Notification permission failed:",
          error
        );
      }

    }
  );


  /* =========================================================
     PERIODIC REFRESH
  ========================================================= */

  setInterval(() => {
    if (
      dragState ||
      dragPending ||
      swipeGesture
    ) {
      return;
    }

    const resetChanged =
      applyHabitResets();

    /*
      TODAYの日付境界も変化するので
      30秒おきに軽く再描画。
    */
    renderDate();
    renderHabits();

    if (resetChanged) {
      saveData();
    }

    updateAppBadge();

  }, 30000);


  /* =========================================================
     SERVICE WORKER
  ========================================================= */

  if ("serviceWorker" in navigator) {
    window.addEventListener(
      "load",
      () => {
        navigator.serviceWorker
          .register(
            "./service-worker.js"
          )
          .catch((error) => {
            console.warn(
              "Service Worker error:",
              error
            );
          });
      }
    );
  }


  /* =========================================================
     INIT
  ========================================================= */

  buildWheel();
  renderAll();

})();
</script>

</body>
