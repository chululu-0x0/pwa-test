<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HABITS</title>

  <meta
    name="theme-color"
    content="#f6cbd8"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="HABITS"
  >

  <link
    rel="apple-touch-icon"
    href="icon.png"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <style>

    @import url(
      'https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap'
    );


    /* ==========================================
       基本
    ========================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;

      background: #f6cbd8;
    }

    body {
      color: #51464a;

      font-family:
        "Zen Maru Gothic",
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      -webkit-tap-highlight-color: transparent;
    }

    button,
    input {
      font-family:
        "M PLUS Rounded 1c",
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
    }

    button {
      touch-action: manipulation;

      -webkit-user-select: none;
      user-select: none;

      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      max-width: 520px;

      margin: 0 auto;

      padding:
        max(32px, env(safe-area-inset-top))
        18px
        max(80px, env(safe-area-inset-bottom));
    }

    /* ==========================================
   長押し時の文字選択を禁止
========================================== */

body {
  -webkit-user-select: none;
  user-select: none;

  -webkit-touch-callout: none;
}

/*
  習慣名入力欄だけは
  普通に文字選択できるように戻す
*/

input,
textarea {
  -webkit-user-select: text;
  user-select: text;

  -webkit-touch-callout: default;
}


/*
  並び替え中は画面スクロールを停止
*/

body.drag-active {
  overflow: hidden;

  touch-action: none;
}


/*
  並び替えハンドル
*/

.drag-handle {
  touch-action: none;

  -webkit-user-select: none;
  user-select: none;

  -webkit-touch-callout: none;
}


/*
  浮いているカード
*/

.habit-card.dragging {
  position: fixed;

  z-index: 9999;

  margin: 0;

  pointer-events: none;

  opacity: 0.97;

  transform: scale(1.035);

  box-shadow:
    0 24px 55px
    rgba(91, 55, 67, 0.25);

  transition: none;
}


/*
  カードが抜けた場所
*/

.drag-placeholder {
  flex-shrink: 0;

  border-radius: 24px;

  background:
    rgba(
      255,
      255,
      255,
      0.20
    );

  border:
    2px dashed
    rgba(
      255,
      255,
      255,
      0.48
    );
}


/*
  指を離したとき
*/

.habit-card.landing {
  animation:
    dragLanding
    0.42s
    cubic-bezier(
      0.34,
      1.56,
      0.64,
      1
    );
}

@keyframes dragLanding {

  0% {
    transform: scale(1.035);
  }

  45% {
    transform: scale(0.975);
  }

  72% {
    transform: scale(1.018);
  }

  100% {
    transform: scale(1);
  }
}


    /* ==========================================
       ヘッダー
    ========================================== */

    header {
      padding-bottom: 20px;
    }

    .app-title {
      color: white;

      font-family:
        "M PLUS Rounded 1c",
        sans-serif;

      font-size: 18px;
      font-weight: 800;

      letter-spacing: 0.18em;

      opacity: 0.88;
    }

    .big-date {
      margin-top: 5px;

      color: white;

      font-size: 35px;
      font-weight: 700;

      line-height: 1.25;

      letter-spacing: 0.01em;
    }

    .date-sub {
      margin-top: 3px;

      color:
        rgba(
          255,
          255,
          255,
          0.88
        );

      font-size: 14px;
      font-weight: 500;
    }


    /* ==========================================
       固定タブ
    ========================================== */

    .tabs-sticky {
      position: sticky;

      top: env(safe-area-inset-top);

      z-index: 100;

      margin:
        0 -18px
        16px;

      padding:
        8px 18px;

      background:
        rgba(
          246,
          203,
          216,
          0.91
        );

      -webkit-backdrop-filter:
        blur(14px);

      backdrop-filter:
        blur(14px);
    }

    .tabs {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr)
        44px;

      gap: 6px;
    }

    .tab-button {
      min-width: 0;

      border: none;
      border-radius: 999px;

      padding:
        10px 5px;

      background:
        rgba(
          255,
          255,
          255,
          0.36
        );

      color: white;

      font-size: 12px;
      font-weight: 700;

      transition:
        transform 0.15s ease,
        background 0.2s ease,
        color 0.2s ease;
    }

    .tab-button.active {
      background: white;

      color: #d67391;

      box-shadow:
        0 5px 15px
        rgba(
          105,
          70,
          80,
          0.07
        );
    }

    .tab-button:active {
      transform: scale(0.93);
    }

    .tab-add-button {
      width: 44px;
      height: 40px;

      padding: 0;

      border: none;
      border-radius: 50%;

      background: white;
      color: #dd7896;

      font-size: 24px;
      font-weight: 500;

      box-shadow:
        0 5px 15px
        rgba(
          105,
          70,
          80,
          0.07
        );

      transition:
        transform 0.15s ease;
    }

    .tab-add-button:active {
      transform: scale(0.86);
    }


    /* ==========================================
       習慣リスト
    ========================================== */

    .habit-list {
      display: flex;
      flex-direction: column;

      gap: 14px;

      min-height: 100px;
    }

    .empty {
      padding:
        50px 20px;

      text-align: center;

      color:
        rgba(
          255,
          255,
          255,
          0.93
        );

      font-size: 14px;
      line-height: 1.8;
    }


    /* ==========================================
       カード
    ========================================== */

    .habit-card {
      position: relative;

      padding:
        18px 18px
        16px;

      background: white;

      border-radius: 24px;

      box-shadow:
        0 7px 20px
        rgba(
          105,
          70,
          80,
          0.08
        );
    }

    .habit-card.new-card {
      animation:
        cardDrop
        0.65s
        cubic-bezier(
          0.22,
          1.25,
          0.45,
          1
        );
    }

    @keyframes cardDrop {

      0% {
        opacity: 0;

        transform:
          translateY(-90px)
          scale(0.95);
      }

      64% {
        opacity: 1;

        transform:
          translateY(11px)
          scale(1.018);
      }

      82% {
        transform:
          translateY(-5px)
          scale(0.995);
      }

      100% {
        transform:
          translateY(0)
          scale(1);
      }
    }


    /* 達成時 */

    .habit-card.completed-pop {
      animation:
        completedPop
        0.45s ease;
    }

    @keyframes completedPop {

      0% {
        transform: scale(1);
      }

      45% {
        transform: scale(1.026);
      }

      72% {
        transform: scale(0.99);
      }

      100% {
        transform: scale(1);
      }
    }


    /* ==========================================
       カード上部
    ========================================== */

    .habit-top {
      display: flex;
      align-items: center;

      gap: 9px;
    }


    /* 並び替え */

    .drag-handle {
      width: 33px;
      height: 42px;

      flex-shrink: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 0;

      border: none;
      border-radius: 13px;

      background: #faf0f3;
      color: #c9aeb6;

      font-size: 19px;

      touch-action: none;
    }


    /* アイコン */

    .habit-icon-button {
      width: 46px;
      height: 46px;

      flex-shrink: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 0;

      border: none;
      border-radius: 15px;

      background: #fff0f4;

      font-size: 24px;

      transition:
        transform 0.15s ease;
    }

    .habit-icon-button:active {
      transform:
        scale(0.88);
    }


    /* タイトル */

    .habit-title-area {
      min-width: 0;
      flex: 1;
    }

    .habit-name {
      font-size: 18px;
      font-weight: 700;

      word-break: break-word;
    }

    .habit-category {
      margin-top: 2px;

      color: #b4a0a7;

      font-family:
        "M PLUS Rounded 1c",
        sans-serif;

      font-size: 10px;
      font-weight: 700;
    }


    /* ==========================================
       TODAY
    ========================================== */

    .today-badge {
      flex-shrink: 0;

      padding:
        7px 11px;

      border-radius: 999px;

      background: #fbe4eb;

      color: #d66e8e;

      font-family:
        "M PLUS Rounded 1c",
        sans-serif;

      font-size: 12px;
      font-weight: 800;

      opacity: 0;
      visibility: hidden;

      transform: scale(0.8);

      pointer-events: none;

      -webkit-user-select: none;
      user-select: none;

      -webkit-touch-callout: none;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .today-badge.visible {
      opacity: 1;
      visibility: visible;

      transform: scale(1);

      pointer-events: auto;

      touch-action: none;
    }


    /* 初回にピコン */

    .today-badge.today-pop {
      animation:
        todayPicon
        0.58s
        cubic-bezier(
          0.34,
          1.56,
          0.64,
          1
        );
    }

    @keyframes todayPicon {

      0% {
        opacity: 0;

        transform:
          translateY(3px)
          scale(0.35);
      }

      48% {
        opacity: 1;

        transform:
          translateY(-6px)
          scale(1.24);
      }

      72% {
        transform:
          translateY(1px)
          scale(0.95);
      }

      100% {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    /* 長押し削除 */

    .today-badge.clearing {
      animation:
        todayClear
        0.24s ease forwards;
    }

    @keyframes todayClear {

      0% {
        opacity: 1;
        transform: scale(1);
      }

      45% {
        transform: scale(1.12);
      }

      100% {
        opacity: 0;

        transform:
          scale(0.4)
          translateY(-5px);
      }
    }


    /* ==========================================
       進捗
    ========================================== */

    .progress-info {
      margin-top: 15px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .done {
      color: #d97796;

      font-family:
        "M PLUS Rounded 1c",
        sans-serif;

      font-size: 11px;
      font-weight: 800;

      opacity: 0;

      transition:
        opacity 0.25s ease;
    }

    .done.visible {
      opacity: 1;
    }

    .count {
      color: #8d7f84;

      font-family:
        "M PLUS Rounded 1c",
        sans-serif;

      font-size: 13px;
      font-weight: 700;
    }

    .progress-bg {
      width: 100%;
      height: 13px;

      margin-top: 8px;

      overflow: hidden;

      background: #f3e5e9;

      border-radius: 999px;
    }

    .progress-bar {
      width: 0;
      height: 100%;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          #f2b0c2,
          #eb8fac
        );

      transition:
        width
        0.55s
        cubic-bezier(
          0.34,
          1.56,
          0.64,
          1
        );
    }


    /* ==========================================
       ＋ −
    ========================================== */

    .habit-actions {
      margin-top: 13px;

      display: flex;
      justify-content: flex-end;

      gap: 8px;
    }

    .round-button {
      width: 44px;
      height: 44px;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 0;

      border: none;
      border-radius: 50%;

      background: #f5d7df;
      color: #7e646d;

      font-size: 22px;
      font-weight: 700;
    }

    .round-button.plus {
      background: #ee9fb6;
      color: white;
    }

    .round-button:active {
      transform: scale(0.82);
    }

    .round-button.button-pop {
      animation:
        buttonPop
        0.32s ease;
    }

    @keyframes buttonPop {

      0% {
        transform: scale(0.82);
      }

      55% {
        transform: scale(1.18);
      }

      76% {
        transform: scale(0.95);
      }

      100% {
        transform: scale(1);
      }
    }


    /* ==========================================
       ドラッグ中
    ========================================== */

    .drag-placeholder {
      flex-shrink: 0;

      border-radius: 24px;

      background:
        rgba(
          255,
          255,
          255,
          0.21
        );

      border:
        2px dashed
        rgba(
          255,
          255,
          255,
          0.45
        );
    }

    .habit-card.dragging {
      position: fixed;

      z-index: 999;

      margin: 0;

      pointer-events: none;

      opacity: 0.97;

      transform:
        scale(1.025);

      box-shadow:
        0 22px 50px
        rgba(
          91,
          55,
          67,
          0.24
        );
    }

    .habit-card.landing {
      animation:
        landingPop
        0.42s
        cubic-bezier(
          0.34,
          1.56,
          0.64,
          1
        );
    }

    @keyframes landingPop {

      0% {
        transform: scale(1.025);
      }

      45% {
        transform: scale(0.975);
      }

      75% {
        transform: scale(1.018);
      }

      100% {
        transform: scale(1);
      }
    }


    /* ==========================================
       共通オーバーレイ
    ========================================== */

    .sheet-overlay {
      position: fixed;

      inset: 0;

      z-index: 1100;

      display: flex;
      justify-content: center;
      align-items: flex-end;

      padding:
        14px
        14px
        max(
          14px,
          env(safe-area-inset-bottom)
        );

      background:
        rgba(
          89,
          57,
          68,
          0.20
        );

      -webkit-backdrop-filter:
        blur(5px);

      backdrop-filter:
        blur(5px);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.24s ease,
        visibility 0.24s ease;
    }

    .sheet-overlay.open {
      opacity: 1;
      visibility: visible;
    }


    /* ==========================================
       編集・追加パネル
    ========================================== */

    .editor-sheet {
      width: 100%;
      max-width: 500px;

      max-height: 88vh;

      overflow-y: auto;

      padding:
        12px 20px
        24px;

      background:
        rgba(
          255,
          255,
          255,
          0.98
        );

      border-radius: 29px;

      box-shadow:
        0 20px 60px
        rgba(
          90,
          60,
          70,
          0.20
        );

      transform:
        translateY(110%)
        scale(0.98);

      transition:
        transform
        0.4s
        cubic-bezier(
          0.34,
          1.28,
          0.64,
          1
        );
    }

    .sheet-overlay.open
    .editor-sheet {
      transform:
        translateY(0)
        scale(1);
    }

    .sheet-handle {
      width: 42px;
      height: 5px;

      margin:
        0 auto
        14px;

      border-radius: 999px;

      background: #eadde1;
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 10px;

      margin-bottom: 16px;
    }

    .editor-title {
      margin: 0;

      font-size: 21px;
      font-weight: 700;
    }

    .editor-close {
      width: 36px;
      height: 36px;

      border: none;
      border-radius: 50%;

      background: #f6ebee;
      color: #9f858d;

      font-size: 18px;
    }

    .field-label {
      display: block;

      margin:
        14px 0
        7px;

      color: #917b82;

      font-family:
        "M PLUS Rounded 1c",
        sans-serif;

      font-size: 11px;
      font-weight: 700;
    }

    #editorHabitName {
      width: 100%;

      border: none;
      outline: none;

      border-radius: 14px;

      padding:
        13px 14px;

      background: #fff4f7;
      color: #4f4549;

      font-size: 16px;
    }


    /* ==========================================
       アイコン選択
    ========================================== */

    .icon-grid {
      display: grid;

      grid-template-columns:
        repeat(6, 1fr);

      gap: 7px;
    }

    .icon-choice {
      aspect-ratio: 1;

      border:
        2px solid
        transparent;

      border-radius: 13px;

      background: #fff4f7;

      font-size: 21px;

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .icon-choice.selected {
      background: #ffffff;

      border-color: #ed9db5;

      transform: scale(1.08);
    }


    /* ==========================================
       カテゴリ
    ========================================== */

    .category-choice {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 7px;
    }

    .category-button,
    .reset-option {
      border: none;
      border-radius: 13px;

      padding:
        11px 5px;

      background: #fff4f7;
      color: #917b82;

      font-size: 11px;
      font-weight: 700;

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        color 0.15s ease;
    }

    .category-button.selected,
    .reset-option.selected {
      background: #f5bfd0;
      color: white;
    }


    /* ==========================================
       目標回数
    ========================================== */

    .goal-picker-button {
      width: 100%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border: none;
      border-radius: 14px;

      padding:
        13px 15px;

      background: #fff4f7;
      color: #594b50;

      font-size: 14px;
      font-weight: 700;
    }

    .goal-picker-value {
      color: #d77492;

      font-size: 18px;
      font-weight: 800;
    }


    /* ==========================================
       バーリセット
    ========================================== */

    .reset-selector {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 7px;
    }


    /* ==========================================
       編集ボタン
    ========================================== */

    .editor-save-button {
      width: 100%;

      margin-top: 20px;

      border: none;
      border-radius: 16px;

      padding: 14px;

      background: #ee9fb6;
      color: white;

      font-size: 15px;
      font-weight: 800;

      transition:
        transform 0.15s ease;
    }

    .editor-save-button:active {
      transform: scale(0.96);
    }

    .editor-delete-button {
      width: 100%;

      margin-top: 12px;

      border: none;

      padding: 10px;

      background: transparent;

      color: #bd969f;

      font-size: 11px;
      font-weight: 700;
    }

    .editor-delete-button.hidden {
      display: none;
    }


    /* ==========================================
       回数ルーレット
    ========================================== */

    #goalPickerOverlay {
      z-index: 1300;
    }

    .picker-sheet {
      width: 100%;
      max-width: 480px;

      padding:
        18px 18px
        22px;

      background:
        rgba(
          255,
          255,
          255,
          0.99
        );

      border-radius: 28px;

      transform:
        translateY(110%)
        scale(0.98);

      transition:
        transform
        0.38s
        cubic-bezier(
          0.34,
          1.3,
          0.64,
          1
        );
    }

    .sheet-overlay.open
    .picker-sheet {
      transform:
        translateY(0)
        scale(1);
    }

    .picker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 8px;
    }

    .picker-header button {
      border: none;

      padding: 8px;

      background: transparent;
      color: #d37491;

      font-size: 13px;
      font-weight: 800;
    }

    .picker-header button.cancel {
      color: #aa9ba0;
    }

    .picker-title {
      font-size: 14px;
      font-weight: 800;
    }

    .wheel-container {
      position: relative;

      height: 260px;

      overflow: hidden;

      border-radius: 20px;

      background:
        linear-gradient(
          to bottom,
          #fff7f9,
          white 30%,
          white 70%,
          #fff7f9
        );
    }

    .picker-wheel {
      height: 260px;

      overflow-y: scroll;
      overflow-x: hidden;

      padding:
        104px 0;

      scroll-snap-type:
        y mandatory;

      -webkit-overflow-scrolling:
        touch;

      scrollbar-width: none;

      touch-action: pan-y;
    }

    .picker-wheel::-webkit-scrollbar {
      display: none;
    }

    .wheel-item {
      height: 52px;

      display: flex;
      justify-content: center;
      align-items: center;

      scroll-snap-align: center;

      color: #b4a4aa;

      font-size: 19px;
      font-weight: 500;

      opacity: 0.5;

      transition:
        transform 0.18s,
        color 0.18s,
        opacity 0.18s;
    }

    .wheel-item.selected {
      color: #dc7896;

      font-size: 25px;
      font-weight: 800;

      opacity: 1;

      transform: scale(1.08);
    }

    .wheel-highlight {
      position: absolute;

      pointer-events: none;

      left: 18px;
      right: 18px;

      top: 104px;

      height: 52px;

      border-top:
        1px solid #f0c7d3;

      border-bottom:
        1px solid #f0c7d3;

      background:
        rgba(
          247,
          207,
          219,
          0.12
        );
    }

    .wheel-unit {
      position: absolute;

      pointer-events: none;

      top: 50%;

      left:
        calc(
          50% + 38px
        );

      transform:
        translateY(-50%);

      color: #aa929a;

      font-size: 13px;
      font-weight: 700;
    }

  </style>
</head>


<body>

<main class="app">

  <!-- =========================
       上段
  ========================== -->

  <header>

    <div class="app-title">
      HABITS
    </div>

    <div
      class="big-date"
      id="bigDate"
    ></div>

    <div
      class="date-sub"
      id="dateSub"
    ></div>

  </header>


  <!-- =========================
       固定タブ
  ========================== -->

  <div class="tabs-sticky">

    <nav class="tabs">

      <button
        class="tab-button active"

        すべて

      <button
        class="tab-button"

  <!-- =========================

<!-- ==========================================
     習慣追加・編集
========================================== -->

<div
  class="sheet-overlay"

>

  <section class="editor-sheet">

    <div class="sheet-handle"></div>

      <h2

      >

      </button>

    </div>


    <label class="field-label">

    </label>

    <input
      id="editorHabitName"
      type="text"

    >


    <label class="field-label">

    </label>

    <div
      class="icon-grid"

    ></div>


    <label class="field-label">

    </label>

    <div class="category-choice">

      <button
        class="category-button"

      <button

    <label class="field-label">

<!-- ==========================================
     回数ルーレット
========================================== -->

<div
  class="sheet-overlay"
  id="goalPickerOverlay"
  onclick="goalPickerBackdrop(event)"
>

  <div class="picker-sheet">

    <div class="picker-header">

      <button
        class="cancel"
        onclick="closeGoalPicker(false)"
      >
        キャンセル
      </button>

      <div class="picker-title">
        目標回数
      </div>

      <button
        onclick="closeGoalPicker(true)"
      >
        決定
      </button>

    </div>


    <div class="wheel-container">

      <div
        class="picker-wheel"
        id="goalWheel"

      <div
        class="wheel-highlight"
      ></div>

      <div class="wheel-unit">
        回
      </div>

    </div>

  </div>

</div>


<script>

  /* ==========================================
     基本
  ========================================== */

  const STORAGE_KEY =
    "habitTrackerData";

  const MAX_GOAL = 30;

  const WHEEL_ITEM_HEIGHT = 52;

  const ICONS = [
    "🌷",
    "💗",
    "💧",
    "🎨",
    "✏️",
    "📖",
    "🧹",
    "🛁",
    "💊",
    "🌱",
    "⭐",
    "🐰",
    "🎮",
    "🕹️",
    "🎧",
    "☕"
  ];


  let currentTab = "all";

  let newHabitId = null;

  let todayPopId = null;

  let editingHabitId = null;


  /* 編集中の値 */

  let editorIcon = "🌷";

  let editorCategory = "daily";

  let editorGoal = 1;

  let editorBarReset = "four";


  /* ルーレット */

  let pendingGoal = 1;

  let wheelFrame = null;


  /* ドラッグ */

  let dragState = null;


  /* ==========================================
     データ
  ========================================== */

  function createInitialData() {

    return {
      habits: []
    };
  }


  function loadData() {

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    if (!saved) {

      return createInitialData();
    }


    try {

      const parsed =
        JSON.parse(saved);


      if (
        !Array.isArray(
          parsed.habits
        )
      ) {

        return createInitialData();
      }


      return parsed;

    } catch {

      return createInitialData();
    }
  }


  let data =
    loadData();


  function saveData() {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );
  }


  /* ==========================================
     ID
  ========================================== */

  function createId() {

    if (
      window.crypto
      &&
      crypto.randomUUID
    ) {

      return crypto.randomUUID();
    }


    return (
      Date.now().toString()
      +
      Math.random()
        .toString(16)
        .slice(2)
    );
  }


  /* ==========================================
     日付
  ========================================== */

  function renderDate() {

    const now =
      new Date();


    document
      .getElementById(
        "bigDate"
      )
      .textContent =
        now.toLocaleDateString(
          "ja-JP",
          {
            month: "long",
            day: "numeric"
          }
        );


    document
      .getElementById(
        "dateSub"
      )
      .textContent =
        now.toLocaleDateString(
          "ja-JP",
          {
            year: "numeric",
            weekday: "long"
          }
        );
  }


  /* ==========================================
     0時 / 4時の期間キー
  ========================================== */

  function getPeriodKey(
    resetHour
  ) {

    const now =
      new Date();


    const shifted =
      new Date(
        now.getTime()
        -
        resetHour
        * 60
        * 60
        * 1000
      );


    return (
      shifted.getFullYear()
      + "-"
      +
      String(
        shifted.getMonth() + 1
      ).padStart(2, "0")
      + "-"
      +
      String(
        shifted.getDate()
      ).padStart(2, "0")
    );
  }


  function getPeriodStart(
    resetHour
  ) {

    const now =
      new Date();


    const start =
      new Date(now);


    start.setHours(
      resetHour,
      0,
      0,
      0
    );


    if (
      now < start
    ) {

      start.setDate(
        start.getDate() - 1
      );
    }


    return start.getTime();
  }


  /* ==========================================
     TODAY

     日常・創作 = 0時
     ゲーム = 4時
  ========================================== */

  function getTodayResetHour(
    habit
  ) {

    if (
      habit.category
      === "game"
    ) {

      return 4;
    }


    return 0;
  }


  function isDoneToday(
    habit
  ) {

    if (
      !habit.lastDoneAt
    ) {

      return false;
    }


    const resetHour =
      getTodayResetHour(
        habit
      );


    return (
      habit.lastDoneAt
      >=
      getPeriodStart(
        resetHour
      )
    );
  }


  /* ==========================================
     バーのリセット
  ========================================== */

  function getBarPeriodKey(
    habit
  ) {

    if (
      habit.barReset
      === "midnight"
    ) {

      return getPeriodKey(0);
    }


    if (
      habit.barReset
      === "four"
    ) {

      return getPeriodKey(4);
    }


    return null;
  }


  function checkBarResets() {

    let changed = false;


    data.habits.forEach(
      habit => {

        if (
          habit.barReset
          === "none"
        ) {

          return;
        }


        const currentKey =
          getBarPeriodKey(
            habit
          );


        if (
          !habit.barResetKey
        ) {

          habit.barResetKey =
            currentKey;

          changed = true;

          return;
        }


        if (
          habit.barResetKey
          !== currentKey
        ) {

          habit.current = 0;

          habit.barResetKey =
            currentKey;

          changed = true;
        }

      }
    );


    if (changed) {

      saveData();
    }


    return changed;
  }


  /* ==========================================
     カテゴリ名
  ========================================== */

  function getCategoryName(
    category
  ) {

    if (
      category === "creative"
    ) {

      return "創作";
    }


    if (
      category === "game"
    ) {

      return "ゲーム";
    }


    return "日常";
  }


  /* ==========================================
     タブ
  ========================================== */

  function changeTab(
    tab
  ) {

    currentTab = tab;


    document
      .querySelectorAll(
        ".tab-button"
      )
      .forEach(
        button => {

          button.classList
            .toggle(
              "active",
              button.dataset.tab
              === tab
            );
        }
      );


    render();
  }


  /* ==========================================
     メイン描画
  ========================================== */

  function render(
    progressAnimation = null
  ) {

    checkBarResets();

    renderDate();


    const list =
      document.getElementById(
        "habitList"
      );


    list.innerHTML = "";


    const visibleHabits =
      data.habits.filter(
        habit => {

          if (
            currentTab
            === "all"
          ) {

            return true;
          }


          return (
            habit.category
            === currentTab
          );
        }
      );


    if (
      visibleHabits.length
      === 0
    ) {

      list.innerHTML =
        `
        <div class="empty">

          まだ習慣がありません。<br>

          上の＋から追加できます。

        </div>
        `;

      return;
    }


    visibleHabits.forEach(
      habit => {

        const percent =
          Math.min(
            100,
            habit.current
            /
            habit.goal
            *
            100
          );


        const completed =
          habit.current
          >= habit.goal;


        const doneToday =
          isDoneToday(
            habit
          );


        let initialPercent =
          percent;


        if (
          progressAnimation
          &&
          progressAnimation.id
          === habit.id
        ) {

          initialPercent =
            progressAnimation.from;
        }


        const card =
          document.createElement(
            "article"
          );


        card.className =
          "habit-card";


        card.dataset.id =
          habit.id;


        if (
          habit.id
          === newHabitId
        ) {

          card.classList
            .add(
              "new-card"
            );
        }


        card.innerHTML =
          `

          <div class="habit-top">

            <button
              class="drag-handle"
              aria-label="長押しして並び替え"
            >
              ≡
            </button>


            <button
              class="habit-icon-button"
              onclick="
                openHabitEditor(
                  '${habit.id}'
                )
              "
              aria-label="習慣を編集"
            >
              ${habit.icon}
            </button>


            <div class="habit-title-area">

              <div class="habit-name">

                ${escapeHtml(
                  habit.name
                )}

              </div>


              <div class="habit-category">

                ${getCategoryName(
                  habit.category
                )}

              </div>

            </div>


            <div
              class="
                today-badge
                ${
                  doneToday
                  ? "visible"
                  : ""
                }
                ${
                  todayPopId
                  === habit.id
                  ? "today-pop"
                  : ""
                }
              "
            >
              TODAY ✓
            </div>

          </div>


          <div class="progress-info">

            <div
              class="
                done
                ${
                  completed
                  ? "visible"
                  : ""
                }
              "
            >
              ✓ DONE
            </div>


            <div class="count">

              ${habit.current}
              /
              ${habit.goal}

            </div>

          </div>


          <div class="progress-bg">

            <div
              class="progress-bar"
              data-progress="${habit.id}"
              style="
                width:
                ${initialPercent}%;
              "
            ></div>

          </div>


          <div class="habit-actions">

            <button
              class="round-button"
              onclick="
                decreaseHabit(
                  '${habit.id}',
                  this
                )
              "
            >
              −
            </button>


            <button
              class="
                round-button
                plus
              "
              onclick="
                increaseHabit(
                  '${habit.id}',
                  this
                )
              "
            >
              ＋
            </button>

          </div>

          `;


        list.appendChild(
          card
        );


        setupTodayLongPress(
          card,
          habit.id
        );


        setupLongPressDrag(
          card,
          habit.id
        );

      }
    );


    /* バーをびよーん */

    if (
      progressAnimation
    ) {

      requestAnimationFrame(
        () => {

          requestAnimationFrame(
            () => {

              const bar =
                document.querySelector(
                  `[data-progress="${progressAnimation.id}"]`
                );


              if (bar) {

                bar.style.width =
                  progressAnimation.to
                  + "%";
              }

            }
          );

        }
      );
    }


    /* 新規カード判定解除 */

    if (newHabitId) {

      const id =
        newHabitId;


      setTimeout(
        () => {

          if (
            newHabitId
            === id
          ) {

            newHabitId = null;
          }

        },
        700
      );
    }


    /* TODAYピコン判定解除 */

    if (todayPopId) {

      const id =
        todayPopId;


      setTimeout(
        () => {

          if (
            todayPopId
            === id
          ) {

            todayPopId = null;
          }

        },
        650
      );
    }
  }


  /* ==========================================
     ＋
  ========================================== */

  function increaseHabit(
    id,
    button
  ) {

    animateButton(
      button
    );


    const habit =
      data.habits.find(
        item =>
          item.id === id
      );


    if (!habit) {
      return;
    }


    const alreadyDoneToday =
      isDoneToday(
        habit
      );


    const beforePercent =
      Math.min(
        100,
        habit.current
        /
        habit.goal
        *
        100
      );


    const wasCompleted =
      habit.current
      >= habit.goal;


    habit.current++;


    habit.lastDoneAt =
      Date.now();


    if (
      habit.barReset
      !== "none"
    ) {

      habit.barResetKey =
        getBarPeriodKey(
          habit
        );
    }


    const afterPercent =
      Math.min(
        100,
        habit.current
        /
        habit.goal
        *
        100
      );


    const nowCompleted =
      habit.current
      >= habit.goal;


    if (
      !alreadyDoneToday
    ) {

      todayPopId =
        id;
    }


    saveData();


    setTimeout(
      () => {

        render({

          id: id,

          from:
            beforePercent,

          to:
            afterPercent

        });


        if (
          !wasCompleted
          &&
          nowCompleted
        ) {

          requestAnimationFrame(
            () => {

              const card =
                document.querySelector(
                  `.habit-card[data-id="${id}"]`
                );


              if (card) {

                card.classList
                  .add(
                    "completed-pop"
                  );
              }

            }
          );
        }

      },
      75
    );
  }


  /* ==========================================
     −
  ========================================== */

  function decreaseHabit(
    id,
    button
  ) {

    animateButton(
      button
    );


    const habit =
      data.habits.find(
        item =>
          item.id === id
      );


    if (
      !habit
      ||
      habit.current <= 0
    ) {

      return;
    }


    const beforePercent =
      Math.min(
        100,
        habit.current
        /
        habit.goal
        *
        100
      );


    habit.current--;


    const afterPercent =
      Math.min(
        100,
        habit.current
        /
        habit.goal
        *
        100
      );


    saveData();


    setTimeout(
      () => {

        render({

          id: id,

          from:
            beforePercent,

          to:
            afterPercent

        });

      },
      75
    );
  }


  /* ==========================================
     ボタンぽよん
  ========================================== */

  function animateButton(
    button
  ) {

    if (!button) {
      return;
    }


    button.classList
      .remove(
        "button-pop"
      );


    void button.offsetWidth;


    button.classList
      .add(
        "button-pop"
      );
  }


  /* ==========================================
     TODAY長押し

     TODAYだけ消す。
     バーは減らさない。
  ========================================== */

  function setupTodayLongPress(
    card,
    habitId
  ) {

    const badge =
      card.querySelector(
        ".today-badge"
      );


    if (
      !badge
      ||
      !badge.classList
        .contains("visible")
    ) {

      return;
    }


    let timer = null;

    let startX = 0;

    let startY = 0;

    let triggered = false;


    badge.addEventListener(
      "pointerdown",
      event => {

        startX =
          event.clientX;

        startY =
          event.clientY;


        triggered = false;


        timer =
          setTimeout(
            () => {

              triggered = true;


              badge.classList
                .add(
                  "clearing"
                );


              setTimeout(
                () => {

                  const habit =
                    data.habits.find(
                      item =>
                        item.id
                        === habitId
                    );


                  if (!habit) {
                    return;
                  }


                  habit.lastDoneAt =
                    null;


                  saveData();

                  render();

                },
                220
              );

            },
            550
          );

      }
    );


    badge.addEventListener(
      "pointermove",
      event => {

        const distance =
          Math.hypot(
            event.clientX
            - startX,

            event.clientY
            - startY
          );


        if (
          distance > 10
        ) {

          clearTimeout(
            timer
          );
        }

      }
    );


    function cancel() {

      if (!triggered) {

        clearTimeout(
          timer
        );
      }
    }


    badge.addEventListener(
      "pointerup",
      cancel
    );

    badge.addEventListener(
      "pointercancel",
      cancel
    );
  }


  /* ==========================================
   並び替え
========================================== */

function setupLongPressDrag(
  card,
  habitId
) {

  const handle =
    card.querySelector(
      ".drag-handle"
    );


  if (!handle) {
    return;
  }


  let pressTimer = null;

  let pointerId = null;

  let startX = 0;

  let startY = 0;


  /* ------------------------------------------
     長押し開始
  ------------------------------------------ */

  handle.addEventListener(
    "pointerdown",
    event => {

      if (dragState) {
        return;
      }


      pointerId =
        event.pointerId;


      startX =
        event.clientX;

      startY =
        event.clientY;


      /*
        ここが今回かなり重要。

        指が≡ボタンの外へ行っても、
        このハンドルが最後まで
        pointerイベントを受け取る。
      */

      try {

        handle.setPointerCapture(
          pointerId
        );

      } catch {}


      pressTimer =
        setTimeout(
          () => {

            beginDrag(
              card,
              habitId,
              event.clientY,
              pointerId,
              handle
            );

          },
          380
        );

    }
  );


  /* ------------------------------------------
     指移動
  ------------------------------------------ */

  handle.addEventListener(
    "pointermove",
    event => {

      /*
        既にドラッグ中
      */

      if (
        dragState
        &&
        dragState.pointerId
        === event.pointerId
      ) {

        event.preventDefault();


        updateDrag(
          event.clientY
        );


        return;
      }


      /*
        長押し成立前に
        大きく動いた場合はキャンセル
      */

      if (pressTimer) {

        const distance =
          Math.hypot(

            event.clientX
            - startX,

            event.clientY
            - startY

          );


        if (
          distance > 10
        ) {

          clearTimeout(
            pressTimer
          );


          pressTimer = null;
        }
      }

    }
  );


  /* ------------------------------------------
     指を離す
  ------------------------------------------ */

  function endPointer(
    event
  ) {

    if (pressTimer) {

      clearTimeout(
        pressTimer
      );


      pressTimer = null;
    }


    if (
      dragState
      &&
      dragState.pointerId
      === event.pointerId
    ) {

      finishDrag();
    }


    try {

      if (
        handle.hasPointerCapture(
          event.pointerId
        )
      ) {

        handle.releasePointerCapture(
          event.pointerId
        );
      }

    } catch {}

  }


  handle.addEventListener(
    "pointerup",
    endPointer
  );


  handle.addEventListener(
    "pointercancel",
    endPointer
  );


  /*
    iOS側からpointerを
    強制的に奪われた場合も終了
  */

  handle.addEventListener(
    "lostpointercapture",
    event => {

      if (
        dragState
        &&
        dragState.pointerId
        === event.pointerId
      ) {

        finishDrag();
      }

    }
  );


  /*
    長押しメニューを出さない
  */

  handle.addEventListener(
    "contextmenu",
    event => {

      event.preventDefault();

    }
  );

}


/* ==========================================
   カードを持ち上げる
========================================== */

function beginDrag(
  card,
  habitId,
  pointerY,
  pointerId,
  handle
) {

  if (dragState) {
    return;
  }


  const rect =
    card.getBoundingClientRect();


  const placeholder =
    document.createElement(
      "div"
    );


  placeholder.className =
    "drag-placeholder";


  placeholder.style.height =
    rect.height
    + "px";


  /*
    元の場所に
    空席を作る
  */

  card.parentNode
    .insertBefore(
      placeholder,
      card
    );


  /*
    カード自体はbodyに移して
    画面上を自由に動けるようにする
  */

  document.body
    .appendChild(
      card
    );


  card.classList
    .add(
      "dragging"
    );


  card.style.left =
    rect.left
    + "px";


  card.style.top =
    rect.top
    + "px";


  card.style.width =
    rect.width
    + "px";


  card.style.height =
    rect.height
    + "px";


  /*
    指がカードのどの位置を
    掴んだかを記録
  */

  const pointerOffsetY =
    pointerY
    - rect.top;


  dragState = {

    id:
      habitId,

    card:
      card,

    placeholder:
      placeholder,

    pointerId:
      pointerId,

    handle:
      handle,

    pointerOffsetY:
      pointerOffsetY,

    currentTop:
      rect.top,

    height:
      rect.height,

    finishing:
      false

  };


  document.body
    .classList
    .add(
      "drag-active"
    );
}


/* ==========================================
   持っているカードを動かす
========================================== */

function updateDrag(
  pointerY
) {

  if (
    !dragState
    ||
    dragState.finishing
  ) {

    return;
  }


  let top =
    pointerY
    -
    dragState.pointerOffsetY;


  /*
    画面外へ飛びすぎないよう制限
  */

  top =
    Math.max(
      6,

      Math.min(

        window.innerHeight
        -
        dragState.height
        -
        6,

        top

      )
    );


  dragState.currentTop =
    top;


  dragState.card.style.top =
    top
    + "px";


  checkDragReorder();
}


/* ==========================================
   他カードへの重なりを判定
========================================== */

function checkDragReorder() {

  if (!dragState) {
    return;
  }


  const placeholder =
    dragState.placeholder;


  const dragTop =
    dragState.currentTop;


  const dragBottom =
    dragTop
    +
    dragState.height;


  /* ------------------------------------------
     下方向
  ------------------------------------------ */

  let next =
    placeholder
      .nextElementSibling;


  while (
    next
    &&
    next.classList
      .contains(
        "habit-card"
      )
  ) {

    const rect =
      next
        .getBoundingClientRect();


    /*
      次のカードへ約25%ほど
      被ったら入れ替える
    */

    const threshold =
      rect.top
      +
      rect.height
      * 0.25;


    if (
      dragBottom
      <= threshold
    ) {

      break;
    }


    animateListShift(
      () => {

        next.after(
          placeholder
        );

      }
    );


    next =
      placeholder
        .nextElementSibling;
  }


  /* ------------------------------------------
     上方向
  ------------------------------------------ */

  let previous =
    placeholder
      .previousElementSibling;


  while (
    previous
    &&
    previous.classList
      .contains(
        "habit-card"
      )
  ) {

    const rect =
      previous
        .getBoundingClientRect();


    /*
      上のカードへ約25%ほど
      被ったら入れ替える
    */

    const threshold =
      rect.bottom
      -
      rect.height
      * 0.25;


    if (
      dragTop
      >= threshold
    ) {

      break;
    }


    animateListShift(
      () => {

        previous.before(
          placeholder
        );

      }
    );


    previous =
      placeholder
        .previousElementSibling;
  }

}


/* ==========================================
   周りのカードを「にゅるん」と移動
========================================== */

function animateListShift(
  changeLayout
) {

  const cards =
    Array.from(

      document.querySelectorAll(
        "#habitList .habit-card"
      )

    );


  const before =
    new Map();


  cards.forEach(
    card => {

      before.set(
        card,
        card.getBoundingClientRect()
      );

    }
  );


  /*
    placeholderの場所を変更
  */

  changeLayout();


  /*
    FLIPアニメーション
  */

  cards.forEach(
    card => {

      const oldRect =
        before.get(
          card
        );


      if (!oldRect) {
        return;
      }


      const newRect =
        card.getBoundingClientRect();


      const moveY =
        oldRect.top
        -
        newRect.top;


      if (
        Math.abs(
          moveY
        ) < 1
      ) {

        return;
      }


      card.animate(

        [

          {
            transform:
              `translateY(${moveY}px)`
          },

          {
            transform:
              "translateY(0)"
          }

        ],

        {
          duration: 260,

          easing:
            "cubic-bezier(0.22, 1, 0.36, 1)"
        }

      );

    }
  );

}


/* ==========================================
   指を離す
========================================== */

function finishDrag() {

  if (
    !dragState
    ||
    dragState.finishing
  ) {

    return;
  }


  dragState.finishing =
    true;


  const state =
    dragState;


  const target =
    state.placeholder
      .getBoundingClientRect();


  /*
    今いる場所から
    placeholderへ吸い込まれる
  */

  state.card.style.transition =
    `
      top
      180ms
      cubic-bezier(0.22,1,0.36,1),

      left
      180ms
      cubic-bezier(0.22,1,0.36,1),

      transform
      180ms
      ease
    `;


  requestAnimationFrame(
    () => {

      state.card.style.top =
        target.top
        + "px";


      state.card.style.left =
        target.left
        + "px";


      state.card.style.transform =
        "scale(1)";

    }
  );


  setTimeout(
    () => {

      /*
        通常のカードへ戻す
      */

      state.card
        .classList
        .remove(
          "dragging"
        );


      state.card.style.position =
        "";

      state.card.style.left =
        "";

      state.card.style.top =
        "";

      state.card.style.width =
        "";

      state.card.style.height =
        "";

      state.card.style.transform =
        "";

      state.card.style.transition =
        "";


      /*
        placeholderと置換
      */

      state.placeholder
        .replaceWith(
          state.card
        );


      document.body
        .classList
        .remove(
          "drag-active"
        );


      /*
        DOM上の順番を
        データへ保存
      */

      updateDataOrderFromDom();


      saveData();


      /*
        着地ぽよん
      */

      state.card
        .classList
        .add(
          "landing"
        );


      setTimeout(
        () => {

          state.card
            .classList
            .remove(
              "landing"
            );

        },
        430
      );


      dragState = null;

    },
    190
  );

}


/* ==========================================
   DOM順を保存
========================================== */

function updateDataOrderFromDom() {

  const orderedIds =
    Array.from(

      document.querySelectorAll(
        "#habitList .habit-card"
      )

    )
    .map(
      card =>
        card.dataset.id
    );


  /*
    「すべて」タブなら
    そのまま全体順
  */

  if (
    currentTab
    === "all"
  ) {

    const map =
      new Map(

        data.habits.map(
          habit => [
            habit.id,
            habit
          ]
        )

      );


    data.habits =
      orderedIds

        .map(
          id =>
            map.get(id)
        )

        .filter(Boolean);


    return;
  }


  /*
    カテゴリタブ内なら
    そのカテゴリだけ並び替える
  */

  const categoryIndexes =
    [];


  data.habits.forEach(
    (habit, index) => {

      if (
        habit.category
        === currentTab
      ) {

        categoryIndexes.push(
          index
        );
      }

    }
  );


  const map =
    new Map(

      data.habits.map(
        habit => [
          habit.id,
          habit
        ]
      )

    );


  const orderedCategoryHabits =
    orderedIds

      .map(
        id =>
          map.get(id)
      )

      .filter(Boolean);


  categoryIndexes.forEach(
    (dataIndex, orderIndex) => {

      if (
        orderedCategoryHabits[
          orderIndex
        ]
      ) {

        data.habits[
          dataIndex
        ] =
          orderedCategoryHabits[
            orderIndex
          ];
      }

    }
  );

}


/* ==========================================
   万一操作が中断された場合

   ホームへ戻る・画面切替などでも
   浮きっぱなしを防ぐ
========================================== */

window.addEventListener(
  "blur",
  () => {

    if (dragState) {

      finishDrag();
    }

  }
);


document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.hidden
      &&
      dragState
    ) {

      finishDrag();
    }

  }
);


  /* ==========================================
     編集パネル
  ========================================== */

  function openHabitEditor(
    habitId = null
  ) {

    editingHabitId =
      habitId;


    const nameInput =
      document.getElementById(
        "editorHabitName"
      );


    if (habitId) {

      const habit =
        data.habits.find(
          item =>
            item.id
            === habitId
        );


      if (!habit) {
        return;
      }


      editorIcon =
        habit.icon;

      editorCategory =
        habit.category;

      editorGoal =
        habit.goal;

      editorBarReset =
        habit.barReset;


      nameInput.value =
        habit.name;


      document
        .getElementById(
          "editorTitle"
        )
        .textContent =
          "習慣を編集";


      document
        .getElementById(
          "editorSaveButton"
        )
        .textContent =
          "保存する";


      document
        .getElementById(
          "editorDeleteButton"
        )
        .classList
        .remove(
          "hidden"
        );

    } else {

      editorIcon =
        "🌷";


      if (
        currentTab === "daily"
        ||
        currentTab === "creative"
        ||
        currentTab === "game"
      ) {

        editorCategory =
          currentTab;

      } else {

        editorCategory =
          "daily";
      }


      editorGoal = 1;

      editorBarReset =
        "four";


      nameInput.value =
        "";


      document
        .getElementById(
          "editorTitle"
        )
        .textContent =
          "習慣を追加";


      document
        .getElementById(
          "editorSaveButton"
        )
        .textContent =
          "追加する";


      document
        .getElementById(
          "editorDeleteButton"
        )
        .classList
        .add(
          "hidden"
        );
    }


    refreshEditorUI();


    document
      .getElementById(
        "habitEditorOverlay"
      )
      .classList
      .add(
        "open"
      );


    syncBodyLock();
  }


  function closeHabitEditor() {

    document
      .getElementById(
        "habitEditorOverlay"
      )
      .classList
      .remove(
        "open"
      );


    editingHabitId =
      null;


    syncBodyLock();
  }


  function habitEditorBackdrop(
    event
  ) {

    if (
      event.target.id
      === "habitEditorOverlay"
    ) {

      closeHabitEditor();
    }
  }


  /* ==========================================
     編集UI更新
  ========================================== */

  function refreshEditorUI() {

    renderEditorIcons();


    document
      .querySelectorAll(
        "[data-editor-category]"
      )
      .forEach(
        button => {

          button.classList
            .toggle(
              "selected",
              button.dataset
                .editorCategory
              === editorCategory
            );
        }
      );


    document
      .querySelectorAll(
        "[data-editor-reset]"
      )
      .forEach(
        button => {

          button.classList
            .toggle(
              "selected",
              button.dataset
                .editorReset
              === editorBarReset
            );
        }
      );


    document
      .getElementById(
        "editorGoalValue"
      )
      .textContent =
        editorGoal
        + "回";
  }


  function renderEditorIcons() {

    const grid =
      document.getElementById(
        "editorIconGrid"
      );


    grid.innerHTML = "";


    ICONS.forEach(
      icon => {

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "icon-choice";


        if (
          icon === editorIcon
        ) {

          button.classList
            .add(
              "selected"
            );
        }


        button.textContent =
          icon;


        button.onclick =
          () => {

            editorIcon =
              icon;


            renderEditorIcons();
          };


        grid.appendChild(
          button
        );
      }
    );
  }


  function selectEditorCategory(
    category
  ) {

    editorCategory =
      category;


    refreshEditorUI();
  }


  function selectEditorBarReset(
    type
  ) {

    editorBarReset =
      type;


    refreshEditorUI();
  }


  /* ==========================================
     保存
  ========================================== */

  function saveHabitEditor() {

    const name =
      document
        .getElementById(
          "editorHabitName"
        )
        .value
        .trim();


    if (!name) {

      alert(
        "習慣名を入力してね。"
      );

      return;
    }


    if (editingHabitId) {

      const habit =
        data.habits.find(
          item =>
            item.id
            === editingHabitId
        );


      if (!habit) {
        return;
      }


      const resetChanged =
        habit.barReset
        !== editorBarReset;


      habit.name =
        name;

      habit.icon =
        editorIcon;

      habit.category =
        editorCategory;

      habit.goal =
        editorGoal;

      habit.barReset =
        editorBarReset;


      if (resetChanged) {

        habit.barResetKey =
          editorBarReset
          === "none"
          ? null
          : getBarPeriodKey(
              habit
            );
      }

    } else {

      const habit = {

        id:
          createId(),

        name:
          name,

        icon:
          editorIcon,

        category:
          editorCategory,

        goal:
          editorGoal,

        current:
          0,

        barReset:
          editorBarReset,

        barResetKey:
          null,

        lastDoneAt:
          null

      };


      if (
        habit.barReset
        !== "none"
      ) {

        habit.barResetKey =
          getBarPeriodKey(
            habit
          );
      }


      data.habits.push(
        habit
      );


      newHabitId =
        habit.id;
    }


    saveData();


    document
      .getElementById(
        "habitEditorOverlay"
      )
      .classList
      .remove(
        "open"
      );


    editingHabitId =
      null;


    syncBodyLock();

    render();
  }


  /* ==========================================
     編集中習慣削除
  ========================================== */

  function deleteEditingHabit() {

    if (
      !editingHabitId
    ) {

      return;
    }


    const habit =
      data.habits.find(
        item =>
          item.id
          === editingHabitId
      );


    if (!habit) {
      return;
    }


    if (
      !confirm(
        `「${habit.name}」を削除しますか？`
      )
    ) {

      return;
    }


    data.habits =
      data.habits.filter(
        item =>
          item.id
          !== editingHabitId
      );


    saveData();


    document
      .getElementById(
        "habitEditorOverlay"
      )
      .classList
      .remove(
        "open"
      );


    editingHabitId =
      null;


    syncBodyLock();

    render();
  }


  /* ==========================================
     ルーレット
  ========================================== */

  function initGoalPicker() {

    const wheel =
      document.getElementById(
        "goalWheel"
      );


    wheel.innerHTML = "";


    for (
      let number = 1;
      number <= MAX_GOAL;
      number++
    ) {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "wheel-item";


      item.dataset.value =
        number;


      item.textContent =
        number;


      wheel.appendChild(
        item
      );
    }


    wheel.addEventListener(
      "scroll",
      handleWheelScroll,
      {
        passive: true
      }
    );
  }


  function openGoalPicker() {

    pendingGoal =
      editorGoal;


    document
      .getElementById(
        "goalPickerOverlay"
      )
      .classList
      .add(
        "open"
      );


    syncBodyLock();


    requestAnimationFrame(
      () => {

        requestAnimationFrame(
          () => {

            scrollWheelToValue(
              pendingGoal,
              false
            );

          }
        );
      }
    );
  }


  function scrollWheelToValue(
    value,
    smooth = true
  ) {

    const wheel =
      document.getElementById(
        "goalWheel"
      );


    wheel.scrollTo({

      top:
        (value - 1)
        *
        WHEEL_ITEM_HEIGHT,

      behavior:
        smooth
        ? "smooth"
        : "auto"

    });


    pendingGoal =
      value;


    updateWheelHighlight();
  }


  function handleWheelScroll() {

    if (wheelFrame) {

      cancelAnimationFrame(
        wheelFrame
      );
    }


    wheelFrame =
      requestAnimationFrame(
        () => {

          const wheel =
            document.getElementById(
              "goalWheel"
            );


          let index =
            Math.round(
              wheel.scrollTop
              /
              WHEEL_ITEM_HEIGHT
            );


          index =
            Math.max(
              0,
              Math.min(
                MAX_GOAL - 1,
                index
              )
            );


          pendingGoal =
            index + 1;


          updateWheelHighlight();

        }
      );
  }


  function updateWheelHighlight() {

    document
      .querySelectorAll(
        ".wheel-item"
      )
      .forEach(
        item => {

          item.classList
            .toggle(
              "selected",
              Number(
                item.dataset.value
              )
              === pendingGoal
            );
        }
      );
  }


  function closeGoalPicker(
    save
  ) {

    if (save) {

      editorGoal =
        pendingGoal;


      refreshEditorUI();
    }


    document
      .getElementById(
        "goalPickerOverlay"
      )
      .classList
      .remove(
        "open"
      );


    syncBodyLock();
  }


  function goalPickerBackdrop(
    event
  ) {

    if (
      event.target.id
      === "goalPickerOverlay"
    ) {

      closeGoalPicker(
        false
      );
    }
  }


  /* ==========================================
     オーバーレイ時スクロール固定
  ========================================== */

  function syncBodyLock() {

    const editorOpen =
      document
        .getElementById(
          "habitEditorOverlay"
        )
        .classList
        .contains(
          "open"
        );


    const pickerOpen =
      document
        .getElementById(
          "goalPickerOverlay"
        )
        .classList
        .contains(
          "open"
        );


    document.body.style
      .overflow =
        editorOpen
        ||
        pickerOpen
        ? "hidden"
        : "";
  }


  /* ==========================================
     HTML安全化
  ========================================== */

  function escapeHtml(
    text
  ) {

    return String(text)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );
  }


  /* ==========================================
     Service Worker
  ========================================== */

  if (
    "serviceWorker"
    in navigator
  ) {

    window.addEventListener(
      "load",
      () => {

        navigator
          .serviceWorker
          .register(
            "./service-worker.js"
          )
          .catch(
            error => {

              console.log(
                "Service Worker:",
                error
              );
            }
          );

      }
    );
  }


  /* ==========================================
     起動
  ========================================== */

  initGoalPicker();

  checkBarResets();

  saveData();

  render();


  /*
    0時・4時を跨いだとき、
    開きっぱなしでも表示を更新
  */

  setInterval(
    () => {

      checkBarResets();

      render();

    },
    30000
  );

</script>
