<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HABITS</title>

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="HABITS"
  >

  <link
    rel="apple-touch-icon"
    href="icon.png"
  >


  <!-- =========================
       フォント
  ========================== -->

  <style>
    @import url(
      'https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap'
    );


    /* =========================
       基本
    ========================== */

    * {
      box-sizing: border-box;
    }

    html {
      background: #f6cbd8;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: #f6cbd8;
      color: #51464a;

      font-family:
        "Zen Maru Gothic",
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      -webkit-tap-highlight-color:
        transparent;

      overscroll-behavior-y: none;
    }


    .app {
      width: 100%;
      max-width: 520px;

      margin: 0 auto;

      padding:
        max(36px, env(safe-area-inset-top))
        18px
        max(80px, env(safe-area-inset-bottom));
    }


    /* =========================
       UI系フォント
    ========================== */

    button,
    input,
    select,
    .count,
    .reset-label,
    .reset-toggle,
    .field-label,
    .goal-picker-button,
    .picker-sheet,
    .reset-info {
      font-family:
        "M PLUS Rounded 1c",
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
    }


    /* =========================
       ヘッダー
    ========================== */

    header {
      margin-bottom: 26px;
    }

    h1 {
      margin: 0;

      font-size: 31px;
      font-weight: 700;

      letter-spacing: 0.08em;

      color: white;
    }

    .date {
      margin-top: 6px;

      font-size: 14px;
      font-weight: 500;

      color:
        rgba(
          255,
          255,
          255,
          0.92
        );
    }


    /* =========================
       習慣一覧
    ========================== */

    .habit-list {
      display: flex;
      flex-direction: column;

      gap: 14px;
    }

    .habit-card {
      position: relative;

      background: white;

      border-radius: 24px;

      padding: 20px;

      box-shadow:
        0 7px 20px
        rgba(
          105,
          70,
          80,
          0.08
        );
    }


    /* =========================
       新規カード落下
    ========================== */

    .habit-card.new-card {
      animation:
        cardDrop
        0.65s
        cubic-bezier(
          0.22,
          1.25,
          0.45,
          1
        );
    }

    @keyframes cardDrop {

      0% {
        opacity: 0;

        transform:
          translateY(-90px)
          scale(0.96);
      }

      65% {
        opacity: 1;

        transform:
          translateY(10px)
          scale(1.015);
      }

      82% {
        transform:
          translateY(-5px)
          scale(0.995);
      }

      100% {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    /* =========================
       カード上
    ========================== */

    .habit-top {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 12px;
    }

    .habit-name {
      min-width: 0;

      font-size: 18px;
      font-weight: 700;

      word-break: break-word;
    }

    .count {
      flex-shrink: 0;

      font-size: 14px;
      font-weight: 700;

      color: #8d7f84;
    }


    /* =========================
       進捗バー
    ========================== */

    .progress-bg {
      width: 100%;
      height: 13px;

      margin-top: 16px;

      overflow: hidden;

      background: #f3e5e9;

      border-radius: 999px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;

      background:
        linear-gradient(
          90deg,
          #f2b0c2,
          #eb8fac
        );

      border-radius: 999px;

      transition:
        width
        0.55s
        cubic-bezier(
          0.34,
          1.56,
          0.64,
          1
        );
    }


    /* =========================
       達成ぽよん
    ========================== */

    .habit-card.completed-pop {
      animation:
        completedPop
        0.45s
        ease;
    }

    @keyframes completedPop {

      0% {
        transform: scale(1);
      }

      45% {
        transform: scale(1.025);
      }

      70% {
        transform: scale(0.99);
      }

      100% {
        transform: scale(1);
      }
    }


    /* =========================
       カード下
    ========================== */

    .habit-bottom {
      margin-top: 15px;

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 10px;
    }

    .done {
      font-family:
        "M PLUS Rounded 1c",
        sans-serif;

      font-size: 13px;
      font-weight: 800;

      letter-spacing: 0.05em;

      color: #d97796;

      opacity: 0;

      transform:
        translateY(4px);

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .done.visible {
      opacity: 1;

      transform:
        translateY(0);
    }


    /* =========================
       ＋ −
    ========================== */

    .buttons {
      display: flex;
      gap: 8px;
    }

    button {
      touch-action: manipulation;

      -webkit-user-select: none;
      user-select: none;

      -webkit-tap-highlight-color:
        transparent;
    }

    .round-button {
      width: 44px;
      height: 44px;

      padding: 0;

      border: none;
      border-radius: 50%;

      display: flex;

      justify-content: center;
      align-items: center;

      background: #f5d7df;
      color: #7e646d;

      font-size: 22px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.1s ease,
        background 0.2s ease;
    }

    .round-button.plus {
      background: #ee9fb6;
      color: white;
    }

    .round-button:active {
      transform:
        scale(0.82);
    }

    .round-button.button-pop {
      animation:
        buttonPop
        0.32s
        ease;
    }

    @keyframes buttonPop {

      0% {
        transform:
          scale(0.82);
      }

      55% {
        transform:
          scale(1.18);
      }

      75% {
        transform:
          scale(0.95);
      }

      100% {
        transform:
          scale(1);
      }
    }


    /* =========================
       リセット設定
    ========================== */

    .habit-settings {
      margin-top: 15px;
      padding-top: 13px;

      border-top:
        1px solid #f4e7eb;

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 10px;
    }

    .reset-label {
      font-size: 12px;

      color: #a39197;
    }

    .reset-toggle {
      border: none;

      border-radius: 999px;

      padding: 7px 11px;

      background: #f7dce4;
      color: #c66d88;

      font-size: 11px;
      font-weight: 700;

      cursor: pointer;
    }

    .reset-toggle.off {
      background: #efedef;
      color: #8e8689;
    }


    /* =========================
       削除
    ========================== */

    .delete-button {
      margin-top: 12px;

      padding: 0;

      border: none;

      background: transparent;
      color: #c2b3b8;

      font-size: 11px;

      cursor: pointer;
    }


    /* =========================
       追加カード
    ========================== */

    .add-card {
      margin-top: 20px;

      background:
        rgba(
          255,
          255,
          255,
          0.68
        );

      border-radius: 24px;

      padding: 20px;
    }

    .add-title {
      margin-bottom: 15px;

      font-size: 17px;
      font-weight: 700;
    }

    .field-label {
      display: block;

      margin:
        5px 0 7px;

      font-size: 12px;
      font-weight: 700;

      color: #917b82;
    }

    input {
      width: 100%;

      border: none;
      outline: none;

      border-radius: 14px;

      padding: 13px 14px;

      font-size: 16px;

      background: white;
      color: #4f4549;

      appearance: none;
    }

    #habitName {
      margin-bottom: 12px;
    }


    /* =========================
       目標回数ボタン
    ========================== */

    .goal-picker-button {
      width: 100%;

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      padding: 13px 15px;

      border: none;
      border-radius: 14px;

      background: white;
      color: #594b50;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.12s ease;
    }

    .goal-picker-button:active {
      transform:
        scale(0.98);
    }

    .goal-picker-value {
      color: #d77492;

      font-size: 18px;
      font-weight: 800;
    }

    .goal-picker-arrow {
      color: #beaab0;

      font-size: 18px;
    }


    /* =========================
       リセットON/OFFスイッチ
    ========================== */

    .reset-choice {
      margin-top: 16px;

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 12px;
    }

    .reset-choice-text {
      font-size: 13px;

      color: #735f66;
    }

    .switch {
      position: relative;

      width: 50px;
      height: 30px;

      flex-shrink: 0;
    }

    .switch input {
      display: none;
    }

    .slider {
      position: absolute;

      inset: 0;

      border-radius: 999px;

      background: #d8d0d3;

      cursor: pointer;

      transition:
        background 0.25s ease;
    }

    .slider::before {
      content: "";

      position: absolute;

      width: 24px;
      height: 24px;

      left: 3px;
      top: 3px;

      border-radius: 50%;

      background: white;

      box-shadow:
        0 2px 5px
        rgba(0, 0, 0, 0.12);

      transition:
        transform
        0.25s
        cubic-bezier(
          0.34,
          1.56,
          0.64,
          1
        );
    }

    .switch input:checked
    + .slider {
      background: #ee9fb6;
    }

    .switch input:checked
    + .slider::before {
      transform:
        translateX(20px);
    }


    /* =========================
       追加ボタン
    ========================== */

    .add-button {
      width: 100%;

      margin-top: 18px;

      border: none;
      border-radius: 16px;

      padding: 14px;

      background: white;
      color: #d56f8e;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;

      transition:
        transform 0.12s ease;
    }

    .add-button:active {
      transform:
        scale(0.96);
    }


    /* =========================
       空表示
    ========================== */

    .empty {
      padding: 30px 20px;

      text-align: center;

      color:
        rgba(
          255,
          255,
          255,
          0.95
        );

      font-size: 14px;

      line-height: 1.7;
    }

    .reset-info {
      margin-top: 17px;

      text-align: center;

      font-size: 11px;

      color:
        rgba(
          255,
          255,
          255,
          0.87
        );
    }


    /* =========================================
       回数ルーレット 背景
    ========================================== */

    .picker-overlay {
      position: fixed;

      inset: 0;

      z-index: 1000;

      display: flex;

      justify-content: center;
      align-items: flex-end;

      padding:
        20px
        14px
        max(
          14px,
          env(safe-area-inset-bottom)
        );

      background:
        rgba(
          90,
          60,
          70,
          0.18
        );

      backdrop-filter:
        blur(4px);

      -webkit-backdrop-filter:
        blur(4px);

      opacity: 0;

      visibility: hidden;

      transition:
        opacity 0.25s ease,
        visibility 0.25s ease;
    }

    .picker-overlay.open {
      opacity: 1;
      visibility: visible;
    }


    /* =========================
       下から出るパネル
    ========================== */

    .picker-sheet {
      width: 100%;
      max-width: 480px;

      background:
        rgba(
          255,
          255,
          255,
          0.97
        );

      border-radius:
        28px;

      padding:
        18px 18px 22px;

      box-shadow:
        0 18px 50px
        rgba(
          90,
          60,
          70,
          0.16
        );

      transform:
        translateY(110%)
        scale(0.98);

      transition:
        transform
        0.38s
        cubic-bezier(
          0.34,
          1.3,
          0.64,
          1
        );
    }

    .picker-overlay.open
    .picker-sheet {
      transform:
        translateY(0)
        scale(1);
    }


    /* =========================
       ルーレット上部
    ========================== */

    .picker-header {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      margin-bottom: 8px;
    }

    .picker-title {
      font-size: 15px;
      font-weight: 800;

      color: #66565c;
    }

    .picker-header-button {
      border: none;

      background: transparent;

      padding: 8px;

      color: #d37491;

      font-size: 14px;
      font-weight: 800;

      cursor: pointer;
    }

    .picker-header-button.cancel {
      color: #aa9ba0;
    }


    /* =========================
       ルーレット本体
    ========================== */

    .wheel-container {
      position: relative;

      height: 260px;

      overflow: hidden;

      border-radius: 20px;

      background:
        linear-gradient(
          to bottom,
          #fff7f9,
          white 30%,
          white 70%,
          #fff7f9
        );
    }


    .picker-wheel {
      position: relative;

      height: 260px;

      overflow-y: scroll;
      overflow-x: hidden;

      padding:
        104px 0;

      scroll-snap-type:
        y mandatory;

      -webkit-overflow-scrolling:
        touch;

      scrollbar-width: none;

      touch-action: pan-y;
    }

    .picker-wheel::-webkit-scrollbar {
      display: none;
    }


    .wheel-item {
      height: 52px;

      display: flex;

      justify-content: center;
      align-items: center;

      scroll-snap-align: center;

      color: #b4a4aa;

      font-size: 19px;
      font-weight: 500;

      transition:
        transform 0.18s ease,
        color 0.18s ease,
        opacity 0.18s ease;

      opacity: 0.55;
    }

    .wheel-item.selected {
      color: #dc7896;

      font-size: 25px;
      font-weight: 800;

      transform:
        scale(1.08);

      opacity: 1;
    }


    /* 中央選択部分 */

    .wheel-highlight {
      position: absolute;

      pointer-events: none;

      left: 18px;
      right: 18px;

      top: 104px;

      height: 52px;

      border-top:
        1px solid #f0c7d3;

      border-bottom:
        1px solid #f0c7d3;

      background:
        rgba(
          247,
          207,
          219,
          0.12
        );
    }


    .wheel-unit {
      position: absolute;

      pointer-events: none;

      top: 50%;

      left:
        calc(50% + 38px);

      transform:
        translateY(-50%);

      color: #aa929a;

      font-size: 14px;
      font-weight: 700;
    }

  </style>
</head>


<body>

  <main class="app">

    <header>

      <h1>
        HABITS
      </h1>

      <div
        class="date"
        id="dateText"
      ></div>

    </header>


    <section
      class="habit-list"
      id="habitList"
    ></section>


    <!-- =========================
         習慣追加
    ========================== -->

    <section class="add-card">

      <div class="add-title">
        ＋ 習慣を追加
      </div>


      <label class="field-label">
        習慣名
      </label>

      <input
        id="habitName"
        type="text"
        placeholder="例：水を飲む"
      >


      <label class="field-label">
        目標回数
      </label>


      <!-- 数字入力ではなく
           ルーレットを開く -->

      <button
        class="goal-picker-button"
        type="button"
        onclick="openGoalPicker()"
      >

        <span>
          目標
        </span>

        <span>

          <span
            class="goal-picker-value"
            id="goalPickerValue"
          >
            1回
          </span>

          <span
            class="goal-picker-arrow"
          >
            ›
          </span>

        </span>

      </button>


      <div class="reset-choice">

        <div class="reset-choice-text">
          毎日4:00にリセット
        </div>


        <label class="switch">

          <input
            id="habitReset"
            type="checkbox"
            checked
          >

          <span class="slider"></span>

        </label>

      </div>


      <button
        class="add-button"
        onclick="addHabit()"
      >
        追加する
      </button>

    </section>


    <div class="reset-info">
      「毎日リセット」がONの項目のみ、午前4:00に進捗が0へ戻ります。
    </div>

  </main>


  <!-- =========================================
       回数ルーレット
  ========================================== -->

  <div
    class="picker-overlay"
    id="goalPickerOverlay"
    onclick="overlayClicked(event)"
  >

    <div class="picker-sheet">

      <div class="picker-header">

        <button
          class="picker-header-button cancel"
          onclick="closeGoalPicker(false)"
        >
          キャンセル
        </button>


        <div class="picker-title">
          目標回数
        </div>


        <button
          class="picker-header-button"
          onclick="closeGoalPicker(true)"
        >
          決定
        </button>

      </div>


      <div class="wheel-container">

        <div
          class="picker-wheel"
          id="goalWheel"
        ></div>

        <div
          class="wheel-highlight"
        ></div>

        <div class="wheel-unit">
          回
        </div>

      </div>

    </div>

  </div>


  <script>

    /* =========================
       基本設定
    ========================== */

    const STORAGE_KEY =
      "habitTrackerData";

    const RESET_HOUR = 4;

    const WHEEL_ITEM_HEIGHT = 52;

    const MAX_GOAL = 30;


    let newHabitId = null;

    let selectedGoal = 1;

    let pendingGoal = 1;

    let wheelScrollFrame = null;


    /* =========================
       4時基準の日付
    ========================== */

    function getHabitDate() {

      const now =
        new Date();

      const shifted =
        new Date(
          now.getTime()
          -
          RESET_HOUR
          * 60
          * 60
          * 1000
        );


      return (

        shifted.getFullYear()
        + "-"
        +
        String(
          shifted.getMonth() + 1
        ).padStart(2, "0")
        + "-"
        +
        String(
          shifted.getDate()
        ).padStart(2, "0")

      );
    }


    function getDisplayDate() {

      const now =
        new Date();

      const shifted =
        new Date(
          now.getTime()
          -
          RESET_HOUR
          * 60
          * 60
          * 1000
        );


      return shifted
        .toLocaleDateString(
          "ja-JP",
          {
            month: "long",
            day: "numeric",
            weekday: "short"
          }
        );
    }


    /* =========================
       ID
    ========================== */

    function createId() {

      if (
        window.crypto
        &&
        crypto.randomUUID
      ) {

        return crypto.randomUUID();

      }


      return (

        Date.now().toString()
        +
        Math.random()
          .toString(16)
          .slice(2)

      );
    }


    /* =========================
       保存読込
    ========================== */

    function loadData() {

      const saved =
        localStorage.getItem(
          STORAGE_KEY
        );


      if (!saved) {

        return {

          habitDate:
            getHabitDate(),

          habits: []

        };
      }


      try {

        const parsed =
          JSON.parse(saved);


        if (
          !Array.isArray(
            parsed.habits
          )
        ) {

          parsed.habits = [];
        }


        parsed.habits =
          parsed.habits.map(
            habit => ({

              ...habit,

              id:
                habit.id
                || createId(),

              resetDaily:
                habit.resetDaily
                === undefined
                ? true
                : habit.resetDaily

            })
          );


        if (
          !parsed.habitDate
        ) {

          parsed.habitDate =
            getHabitDate();
        }


        return parsed;

      } catch {

        return {

          habitDate:
            getHabitDate(),

          habits: []

        };
      }
    }


    let data =
      loadData();


    function saveData() {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
      );
    }


    /* =========================
       リセット
    ========================== */

    function checkReset() {

      const today =
        getHabitDate();


      if (
        data.habitDate
        === today
      ) {

        return false;
      }


      data.habits.forEach(
        habit => {

          if (
            habit.resetDaily
            !== false
          ) {

            habit.current = 0;

          }

        }
      );


      data.habitDate =
        today;


      saveData();

      return true;
    }


    /* =========================
       描画
    ========================== */

    function render(
      progressAnimation = null
    ) {

      checkReset();


      document
        .getElementById(
          "dateText"
        )
        .textContent =
          getDisplayDate();


      const list =
        document.getElementById(
          "habitList"
        );


      list.innerHTML = "";


      if (
        data.habits.length === 0
      ) {

        list.innerHTML =
          `
          <div class="empty">

            まだ習慣がありません。<br>

            下から追加してみてね。

          </div>
          `;

        return;
      }


      data.habits.forEach(
        habit => {


          const percent =
            Math.min(
              100,
              habit.current
              /
              habit.goal
              *
              100
            );


          const completed =
            habit.current
            >= habit.goal;


          const card =
            document.createElement(
              "article"
            );


          card.className =
            "habit-card";


          card.dataset.id =
            habit.id;


          if (
            habit.id
            === newHabitId
          ) {

            card.classList
              .add(
                "new-card"
              );

          }


          let initialPercent =
            percent;


          if (
            progressAnimation
            &&
            progressAnimation.id
            === habit.id
          ) {

            initialPercent =
              progressAnimation.from;

          }


          card.innerHTML =
            `

            <div class="habit-top">

              <div class="habit-name">

                ${escapeHtml(
                  habit.name
                )}

              </div>


              <div class="count">

                ${habit.current}
                /
                ${habit.goal}

              </div>

            </div>


            <div class="progress-bg">

              <div
                class="progress-bar"
                data-progress="${habit.id}"

                style="
                  width:
                  ${initialPercent}%;
                "
              ></div>

            </div>


            <div class="habit-bottom">

              <div
                class="
                  done
                  ${
                    completed
                    ? "visible"
                    : ""
                  }
                "
              >
                ✓ DONE
              </div>


              <div class="buttons">

                <button
                  class="round-button"

                  onclick="
                    decreaseHabit(
                      '${habit.id}',
                      this
                    )
                  "
                >
                  −
                </button>


                <button
                  class="
                    round-button
                    plus
                  "

                  onclick="
                    increaseHabit(
                      '${habit.id}',
                      this
                    )
                  "
                >
                  ＋
                </button>

              </div>

            </div>


            <div class="habit-settings">

              <span class="reset-label">

                ${
                  habit.resetDaily
                  ? "毎日 4:00 リセット"
                  : "日付を跨いでも継続"
                }

              </span>


              <button
                class="
                  reset-toggle
                  ${
                    habit.resetDaily
                    ? ""
                    : "off"
                  }
                "

                onclick="
                  toggleReset(
                    '${habit.id}'
                  )
                "
              >

                ${
                  habit.resetDaily
                  ? "RESET ON"
                  : "RESET OFF"
                }

              </button>

            </div>


            <button
              class="delete-button"

              onclick="
                deleteHabit(
                  '${habit.id}'
                )
              "
            >

              この習慣を削除

            </button>

            `;


          list.appendChild(
            card
          );

        }
      );


      if (
        progressAnimation
      ) {

        requestAnimationFrame(
          () => {

            requestAnimationFrame(
              () => {

                const bar =
                  document.querySelector(
                    `[data-progress="${progressAnimation.id}"]`
                  );


                if (bar) {

                  bar.style.width =
                    progressAnimation.to
                    + "%";

                }

              }
            );

          }
        );

      }


      if (newHabitId) {

        const idToClear =
          newHabitId;


        setTimeout(
          () => {

            if (
              newHabitId
              === idToClear
            ) {

              newHabitId = null;

            }

          },
          700
        );

      }

    }


    /* =========================================
       ルーレット初期化
    ========================================== */

    function initGoalPicker() {

      const wheel =
        document.getElementById(
          "goalWheel"
        );


      wheel.innerHTML = "";


      for (
        let number = 1;
        number <= MAX_GOAL;
        number++
      ) {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "wheel-item";


        item.dataset.value =
          number;


        item.textContent =
          number;


        wheel.appendChild(
          item
        );

      }


      wheel.addEventListener(
        "scroll",
        handleWheelScroll,
        {
          passive: true
        }
      );


      updateWheelHighlight();

    }


    /* =========================
       ルーレットを開く
    ========================== */

    function openGoalPicker() {

      pendingGoal =
        selectedGoal;


      const overlay =
        document.getElementById(
          "goalPickerOverlay"
        );


      overlay.classList
        .add(
          "open"
        );


      document.body.style
        .overflow =
          "hidden";


      /*
        下から出てきた後に
        現在値まで移動
      */

      requestAnimationFrame(
        () => {

          requestAnimationFrame(
            () => {

              scrollWheelToValue(
                pendingGoal,
                false
              );

            }
          );

        }
      );

    }


    /* =========================
       選択値までスクロール
    ========================== */

    function scrollWheelToValue(
      value,
      smooth = true
    ) {

      const wheel =
        document.getElementById(
          "goalWheel"
        );


      const top =
        (value - 1)
        *
        WHEEL_ITEM_HEIGHT;


      wheel.scrollTo({

        top: top,

        behavior:
          smooth
          ? "smooth"
          : "auto"

      });


      pendingGoal =
        value;


      updateWheelHighlight();

    }


    /* =========================
       回した時
    ========================== */

    function handleWheelScroll() {

      if (
        wheelScrollFrame
      ) {

        cancelAnimationFrame(
          wheelScrollFrame
        );

      }


      wheelScrollFrame =
        requestAnimationFrame(
          () => {

            const wheel =
              document.getElementById(
                "goalWheel"
              );


            let index =
              Math.round(
                wheel.scrollTop
                /
                WHEEL_ITEM_HEIGHT
              );


            index =
              Math.max(
                0,
                Math.min(
                  MAX_GOAL - 1,
                  index
                )
              );


            pendingGoal =
              index + 1;


            updateWheelHighlight();

          }
        );

    }


    /* =========================
       中央数字を強調
    ========================== */

    function updateWheelHighlight() {

      const items =
        document.querySelectorAll(
          ".wheel-item"
        );


      items.forEach(
        item => {

          const value =
            Number(
              item.dataset.value
            );


          item.classList
            .toggle(
              "selected",
              value
              === pendingGoal
            );

        }
      );

    }


    /* =========================
       ルーレットを閉じる
    ========================== */

    function closeGoalPicker(
      save
    ) {

      if (save) {

        selectedGoal =
          pendingGoal;


        document
          .getElementById(
            "goalPickerValue"
          )
          .textContent =
            selectedGoal
            + "回";

      }


      const overlay =
        document.getElementById(
          "goalPickerOverlay"
        );


      overlay.classList
        .remove(
          "open"
        );


      document.body.style
        .overflow =
          "";

    }


    function overlayClicked(
      event
    ) {

      if (
        event.target.id
        === "goalPickerOverlay"
      ) {

        closeGoalPicker(
          false
        );

      }

    }


    /* =========================
       習慣追加
    ========================== */

    function addHabit() {

      const nameInput =
        document.getElementById(
          "habitName"
        );


      const resetInput =
        document.getElementById(
          "habitReset"
        );


      const name =
        nameInput
          .value
          .trim();


      if (!name) {

        alert(
          "習慣名を入力してね。"
        );

        return;
      }


      const habit = {

        id:
          createId(),

        name:
          name,

        goal:
          selectedGoal,

        current:
          0,

        resetDaily:
          resetInput.checked

      };


      data.habits.push(
        habit
      );


      newHabitId =
        habit.id;


      saveData();


      nameInput.value =
        "";


      selectedGoal = 1;

      pendingGoal = 1;


      document
        .getElementById(
          "goalPickerValue"
        )
        .textContent =
          "1回";


      resetInput.checked =
        true;


      render();

    }


    /* =========================
       ＋
    ========================== */

    function increaseHabit(
      id,
      button
    ) {

      animateButton(
        button
      );


      const habit =
        data.habits.find(
          habit =>
            habit.id === id
        );


      if (!habit) {
        return;
      }


      const beforePercent =
        Math.min(
          100,
          habit.current
          /
          habit.goal
          *
          100
        );


      const wasCompleted =
        habit.current
        >= habit.goal;


      habit.current++;


      const afterPercent =
        Math.min(
          100,
          habit.current
          /
          habit.goal
          *
          100
        );


      const nowCompleted =
        habit.current
        >= habit.goal;


      saveData();


      setTimeout(
        () => {

          render({

            id: id,

            from:
              beforePercent,

            to:
              afterPercent

          });


          if (
            !wasCompleted
            &&
            nowCompleted
          ) {

            requestAnimationFrame(
              () => {

                const card =
                  document.querySelector(
                    `.habit-card[data-id="${id}"]`
                  );


                if (card) {

                  card.classList
                    .add(
                      "completed-pop"
                    );

                }

              }
            );

          }

        },
        80
      );

    }


    /* =========================
       −
    ========================== */

    function decreaseHabit(
      id,
      button
    ) {

      animateButton(
        button
      );


      const habit =
        data.habits.find(
          habit =>
            habit.id === id
        );


      if (
        !habit
        ||
        habit.current <= 0
      ) {

        return;
      }


      const beforePercent =
        Math.min(
          100,
          habit.current
          /
          habit.goal
          *
          100
        );


      habit.current--;


      const afterPercent =
        Math.min(
          100,
          habit.current
          /
          habit.goal
          *
          100
        );


      saveData();


      setTimeout(
        () => {

          render({

            id: id,

            from:
              beforePercent,

            to:
              afterPercent

          });

        },
        80
      );

    }


    /* =========================
       ボタンぽよん
    ========================== */

    function animateButton(
      button
    ) {

      if (!button) {
        return;
      }


      button.classList
        .remove(
          "button-pop"
        );


      void button.offsetWidth;


      button.classList
        .add(
          "button-pop"
        );

    }


    /* =========================
       リセット切替
    ========================== */

    function toggleReset(
      id
    ) {

      const habit =
        data.habits.find(
          habit =>
            habit.id === id
        );


      if (!habit) {
        return;
      }


      habit.resetDaily =
        !habit.resetDaily;


      saveData();

      render();

    }


    /* =========================
       削除
    ========================== */

    function deleteHabit(
      id
    ) {

      const index =
        data.habits.findIndex(
          habit =>
            habit.id === id
        );


      if (
        index === -1
      ) {

        return;
      }


      const habit =
        data.habits[index];


      const ok =
        confirm(
          "「"
          +
          habit.name
          +
          "」を削除しますか？"
        );


      if (!ok) {
        return;
      }


      data.habits.splice(
        index,
        1
      );


      saveData();

      render();

    }


    /* =========================
       HTML安全化
    ========================== */

    function escapeHtml(
      text
    ) {

      return String(text)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =========================
       起動
    ========================== */

    initGoalPicker();

    checkReset();

    saveData();

    render();


    /*
      アプリを開いたまま
      午前4時を跨いだ場合
    */

    setInterval(
      () => {

        const changed =
          checkReset();


        if (changed) {

          render();

        }

      },
      30000
    );

  </script>
