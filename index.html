<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="theme-color" content="#f6cbd8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon.png" />

  <title>HABITS</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');

    :root {
      /* ===== 色 =====
         ここを変えるとアプリ全体の配色をまとめて調整できます。 */
      --pink-bg: #f6cbd8;   /* 画面いちばん後ろの背景色 */
      --pink: #e889a7;      /* バーや小さな装飾に使う基本ピンク */
      --pink-dark: #d9678d; /* 強調文字・選択中・主要ボタンの濃いピンク */
      --pink-soft: #fbe7ee; /* アイコン背景やボタン背景の薄いピンク */

      --white: #ffffff;     /* カードの白 */
      --text: #554850;      /* 通常文字 */
      --muted: #a18f97;     /* 補助文字・カテゴリー名 */

      --line: #f0d8e0;      /* 入力欄などの薄い境界線 */
      --delete: #ef5f68;    /* スワイプ削除ボタン */

      --mint: #bde8d7;      /* 今後の差し色用 */
      --yellow: #f7df9c;    /* 今後の差し色用 */

      /* ===== 角丸・影 ===== */
      --radius: 22px;       /* ハビットカードなど、大きめカードの角丸 */
      --small-radius: 15px; /* 小さな入力欄・ボタンの角丸 */

      --shadow:
        0 7px 18px rgba(136, 86, 104, 0.08),
        0 2px 6px rgba(136, 86, 104, 0.05);

      /* 左スワイプした時に見える「削除」領域の横幅。
         JS側の DELETE_REVEAL_WIDTH も同じ 88 にしてあります。 */
      --delete-width: 88px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================================================
   スクロールバーを非表示
   ※ スクロール操作そのものはそのまま使える
    ========================================================= */

/* Firefox */
* {
  scrollbar-width: none;
}

/* 古いMicrosoft系ブラウザ */
* {
  -ms-overflow-style: none;
}

/* Chrome / Safari / Edge / iPhone */
*::-webkit-scrollbar {
  display: none;
  width: 0;
  height: 0;
}

    html {
      background: var(--pink-bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--pink-bg);
      color: var(--text);
      font-family: "Zen Maru Gothic", sans-serif;

      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;

      overscroll-behavior-y: none;
    }

    input,
    textarea,
    select {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
    }

    .app {
      width: min(100%, 640px);
      margin: 0 auto;
      padding-bottom: calc(42px + env(safe-area-inset-bottom));
    }

    /* ------------------------------
       ヘッダー
    ------------------------------ */

    .header {
      padding:
        calc(22px + env(safe-area-inset-top))
        20px
        17px;
    }

    .app-name {
      margin: 0 0 2px;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
      color: var(--pink-dark);
    }

    .date-main {
      margin: 0;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 35px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .date-sub {
      margin-top: 4px;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    /* ------------------------------
       メインナビゲーション
    ------------------------------ */

    .nav-sticky {
      position: sticky;
      top: env(safe-area-inset-top);
      z-index: 40;
      padding: 5px 14px 10px;
      background:
        linear-gradient(
          to bottom,
          rgba(246, 203, 216, 0.98),
          rgba(246, 203, 216, 0.95)
        );
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .main-tabs {
      display: grid;

      /* ハビット / Todo / メモ / タイマー の4タブ + 右端の＋ボタン。
         48px が「＋」ボタンの横幅です。 */
      grid-template-columns: repeat(4, minmax(0, 1fr)) 48px;

      gap: 6px;
      padding: 6px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.45);
    }

    /* タイマー画面では追加する項目がないため＋ボタンを隠し、
       4タブだけで均等に横幅を使います。 */
    .main-tabs.timer-mode {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .main-tabs.timer-mode .main-add {
      display: none;
    }

    .main-tab,
    .main-add {
      min-height: 42px;
      border-radius: 15px;
      background: transparent;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition:
        transform 0.18s cubic-bezier(.34,1.56,.64,1),
        background 0.18s ease,
        color 0.18s ease;
    }

    .main-tab.active {
      background: var(--white);
      color: var(--pink-dark);
      box-shadow: 0 4px 12px rgba(140, 82, 105, 0.08);
    }

    .main-add {
      background: var(--pink-dark);
      color: white;
      font-size: 22px;
      line-height: 1;
    }

    .main-tab:active,
    .main-add:active,
    .soft-button:active,
    .round-button:active {
      transform: scale(0.9);
    }

    /* ------------------------------
       メインコンテンツ
    ------------------------------ */

    .content {
      padding: 5px 15px 0;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
      animation: sectionIn 0.24s ease both;
    }

    @keyframes sectionIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ------------------------------
       ハビット：フィルター・表示切り替え
    ------------------------------ */

    .habit-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 6px 2px 14px;
    }

    .habit-filters {
      display: flex;
      gap: 5px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .habit-filters::-webkit-scrollbar {
      display: none;
    }

    .filter-button {
      flex: 0 0 auto;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.48);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      transition: 0.18s ease;
    }

    .filter-button.active {
      background: white;
      color: var(--pink-dark);
      box-shadow: 0 3px 9px rgba(140, 82, 105, 0.07);
    }

    .view-switcher {
      flex: 0 0 auto;
      display: flex;
      gap: 3px;
      padding: 3px;
      border-radius: 12px;
      background: rgba(255,255,255,.5);
    }

    .view-button {
      width: 34px;
      height: 32px;
      border-radius: 9px;
      background: transparent;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: #b49ba4;
      transition:
        transform .18s cubic-bezier(.34,1.56,.64,1),
        background .18s ease,
        color .18s ease;
    }

    .view-button.active {
      background: white;
      color: var(--pink-dark);
      box-shadow: 0 2px 7px rgba(140,82,105,.08);
    }

    .view-button:active {
      transform: scale(.82);
    }

    /* ------------------------------
       ホーム画面バッジの案内
    ------------------------------ */

    .badge-panel {
      margin: 0 2px 13px;
      padding: 12px 14px;
      border-radius: 17px;
      background: rgba(255,255,255,.68);
      font-size: 12px;
      line-height: 1.55;
      color: var(--muted);
    }

    .badge-panel[hidden] {
      display: none;
    }

    .badge-enable {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border-radius: 13px;
      background: white;
      color: var(--pink-dark);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-weight: 800;
      font-size: 12px;
    }

    /* ------------------------------
       共通：左スワイプで削除ボタン表示
    ------------------------------ */

    .swipe-row {
      position: relative;
      margin-bottom: 10px;
    }

    .swipe-delete-button {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: var(--delete-width);

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;
      background: var(--delete);
      color: white;

      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .03em;

      z-index: 1;
    }

    .swipe-surface {
      position: relative;
      z-index: 2;
      transform: translateX(0);
      transition:
        transform .28s cubic-bezier(.22,.8,.28,1),
        box-shadow .2s ease;
      touch-action: pan-y;
      will-change: transform;
    }

    /* ハビットカードは角丸が大きいため、閉じた状態でも
       右端の丸い角から赤い削除ボタンが数pxだけ見えることがあります。
       ハビット行だけ削除ボタンを2px内側に入れて、その「赤い縁」を隠します。
       Todo・メモ側の見え方には影響しません。 */
    .habit-row > .swipe-delete-button {
      right: 2px;
      top: 2px;
      bottom: 2px;
    }

    /* ------------------------------
       ハビット：カード表示
    ------------------------------ */

    .habit-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .habit-card.large {
      padding: 15px;
    }

    .habit-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .drag-handle {
      flex: 0 0 auto;
      width: 25px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;

      background: transparent;
      color: #ceb7bf;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-weight: 800;
      font-size: 17px;

      cursor: grab;
      touch-action: none;
    }

    .habit-icon-button {
      flex: 0 0 auto;
      width: 43px;
      height: 43px;
      border-radius: 14px;
      background: var(--pink-soft);
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .habit-title-area {
      flex: 1;
      min-width: 0;
    }

    .habit-name {
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .habit-category {
      margin-top: 2px;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
    }

    .today-badge {
      flex: 0 0 auto;
      padding: 7px 11px;
      border-radius: 999px;
      background: #fff0f5;
      color: var(--pink-dark);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 12px;
      font-weight: 800;
      touch-action: none;
    }

    .today-badge.new-today,
    .compact-today.new-today {
      /* TODAYが初めて付いた瞬間の「ぽこん」と出る演出。
         .43s を大きくすると、出現がゆっくりになります。 */
      animation: todayPicon .43s cubic-bezier(.34,1.56,.64,1);
    }

    .today-badge.today-disappear,
    .compact-today.today-disappear {
      /* 長押し解除時の「しゅわん」と消える演出。
         JS側の TODAY_DISAPPEAR_MS とほぼ同じ長さにしてあります。 */
      animation: todayShuwan .34s ease-in forwards;
      pointer-events: none;
    }

    @keyframes todayPicon {
      0% {
        opacity: 0;
        transform: translateY(3px) scale(.35);
      }
      48% {
        opacity: 1;
        transform: translateY(-6px) scale(1.24);
      }
      72% {
        transform: translateY(1px) scale(.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes todayShuwan {
      0% {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0) scale(1);
      }
      38% {
        opacity: .9;
        filter: blur(.4px);
        transform: translateY(-2px) scale(1.08);
      }
      100% {
        opacity: 0;
        filter: blur(5px);
        transform: translateY(-6px) scale(.45);
      }
    }

    .habit-progress-area {
      margin: 14px 0 0 35px;
    }

    .progress-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
    }

    .progress-text {
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
    }

    .done-label {
      color: var(--pink-dark);
    }

    .progress-track {
      height: 8px;
      border-radius: 999px;
      background: #f5ebef;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background:
        linear-gradient(
          90deg,
          #f1a9bf,
          #e889a7
        );

      /* ハビットの＋／−を押した時にバーが「びよーん」と伸縮する速度。
         .55s を .35s にすると速く、.75s にするとゆっくりになります。 */
      transition:
        width .55s cubic-bezier(.34,1.56,.64,1);
      will-change: width;
    }

    .habit-controls {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 7px;
      margin-top: 11px;
    }

    .habit-count {
      min-width: 46px;
      text-align: center;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 13px;
      font-weight: 800;
    }

    .round-button {
      width: 37px;
      height: 37px;
      border-radius: 13px;
      background: var(--pink-soft);
      color: var(--pink-dark);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 19px;
      font-weight: 800;
      transition: transform .18s cubic-bezier(.34,1.56,.64,1);
    }

    .round-button.pop {
      animation: buttonPop .34s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes buttonPop {
      0% { transform: scale(.82); }
      55% { transform: scale(1.18); }
      76% { transform: scale(.95); }
      100% { transform: scale(1); }
    }

    /* ------------------------------
       ハビット：一覧表示
    ------------------------------ */

    .habit-card.compact {
      min-height: 72px;
      padding: 10px 11px 9px 7px;
      display: grid;
      grid-template-columns: 25px 36px minmax(0,1fr) auto;
      align-items: center;
      gap: 7px;
    }

    .habit-card.compact .drag-handle {
      width: 25px;
      height: 48px;
    }

    .compact-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: var(--pink-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
    }

    .compact-main {
      min-width: 0;

      /* 一覧表示で「左アイコン」と「タイトル」が近すぎないようにする余白。
         4px を増減すると、この2つの間隔だけを調整できます。 */
      margin-left: 4px;
    }

    .compact-line1 {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .compact-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 13px;
      font-weight: 800;
    }

    .compact-today {
      flex: 0 0 auto;
      font-size: 9px;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-weight: 800;
      color: var(--pink-dark);
      touch-action: none;
    }

    .compact-line2 {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 5px;
    }

    .compact-category {
      flex: 0 0 auto;
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
    }

    .compact-track {
      flex: 1;
      height: 5px;
      border-radius: 999px;
      background: #f5ebef;
      overflow: hidden;
    }

    .compact-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--pink);

      /* 一覧表示側のバー伸縮。
         カード表示より少しだけ速い .5s にしています。 */
      transition:
        width .5s cubic-bezier(.34,1.56,.64,1);
      will-change: width;
    }

    .compact-controls {
      display: grid;
      grid-template-columns: 29px 45px 29px;
      align-items: center;
      gap: 3px;
    }

    .compact-button {
      width: 29px;
      height: 29px;
      border-radius: 10px;
      background: var(--pink-soft);
      color: var(--pink-dark);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 16px;
      font-weight: 800;
    }

    .compact-count {
      text-align: center;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
    }

    /* ------------------------------
       ハビット：長押し並び替え
    ------------------------------ */

    .drag-placeholder {
      border-radius: var(--radius);
      background: rgba(255,255,255,.22);
      border: 2px dashed rgba(255,255,255,.55);
      margin-bottom: 10px;
    }

    .habit-row.drag-floating {
      position: fixed !important;
      z-index: 999 !important;
      margin: 0 !important;
      pointer-events: none;
      transition: none !important;
    }

    .habit-row.drag-floating .habit-card {
      transform: scale(1.025);
      box-shadow:
        0 16px 30px rgba(116, 68, 88, .15),
        0 4px 10px rgba(116, 68, 88, .10);
    }

    .habit-card.land-pop {
      animation: landPop .28s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes landPop {
      0% { transform: scale(1.025); }
      55% { transform: scale(.98); }
      100% { transform: scale(1); }
    }

    /* ------------------------------
       Todo
    ------------------------------ */

    .todo-card {
      min-height: 62px;
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 10px 13px;
      border-radius: 18px;
      background: white;
      box-shadow: var(--shadow);
    }

    .todo-card.done {
      opacity: .62;
    }

    .todo-check {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #fff7f9;
      border: 2px solid #efccd8;
      padding: 2px;

      transition:
        transform .18s cubic-bezier(.34,1.56,.64,1),
        background .18s ease;
    }

    .todo-check img {
      width: 31px;
      height: 31px;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    .todo-check.checked {
      border-color: transparent;
      background: transparent;
    }

    .todo-check.checked img {
      animation: hanamaruPop .42s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes hanamaruPop {
      0% {
        opacity: 0;
        transform: scale(.35) rotate(-9deg);
      }
      56% {
        opacity: 1;
        transform: scale(1.22) rotate(4deg);
      }
      78% {
        transform: scale(.94) rotate(-2deg);
      }
      100% {
        transform: scale(1) rotate(0);
      }
    }

    .todo-copy {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .todo-title {
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .todo-note {
      margin-top: 3px;
      font-size: 11px;
      line-height: 1.4;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .todo-note:empty {
      display: none;
    }

    /* ------------------------------
       メモ
    ------------------------------ */

    .memo-card {
      /* カード左端の余白。
         8px を小さくすると、ハートと本文全体がさらに左へ寄ります。 */
      padding: 12px 14px 13px 8px;
      border-radius: 19px;
      background: white;
      box-shadow: var(--shadow);

      /* 左：小さなハート / 右：日付＋本文。
         本文を丸ごと右列に入れることで、1行目も2行目以降も必ず同じ位置から始まります。 */
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      column-gap: 4px;
      align-items: start;
    }

    .memo-edit {
      width: 18px;
      height: 20px;
      padding: 0;
      margin: 0;
      background: transparent;
      border-radius: 7px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      transition:
        transform .18s cubic-bezier(.34,1.56,.64,1),
        opacity .18s ease;
    }

    .memo-edit:active {
      transform: scale(.76);
      opacity: .72;
    }

    .memo-heart-image {
      /* memo_heart.png の表示サイズ。18px が現在の大きさです。 */
      width: 18px;
      height: 18px;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    .memo-body {
      min-width: 0;
      padding-top: 0;
    }

    .memo-date {
      margin: 0 0 5px;
      min-height: 18px;
      display: flex;
      align-items: center;
      color: var(--pink-dark);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 11px;
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .memo-text {
      margin: 0;
      padding: 0;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;

      /* 重要：HTML側でも本文をタグ直下に置いています。
         テンプレートコードの字下げ空白を拾わないため、折り返した2行目が左へずれるのを防ぎます。 */
    }

    /* ------------------------------
       インターバルタイマー
    ------------------------------ */

    .timer-card {
      padding: 20px 16px 18px;
      border-radius: 24px;
      background: white;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .timer-kicker {
      margin-bottom: 12px;
      color: var(--muted);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .timer-ring-wrap {
      /* 円形タイマー全体の大きさ。220px を変えると円ごと拡大・縮小します。 */
      width: min(220px, 68vw);
      aspect-ratio: 1;
      margin: 0 auto;
      position: relative;
    }

    .timer-ring {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .timer-ring-bg,
    .timer-ring-progress {
      fill: none;
      stroke-width: 12;
    }

    .timer-ring-bg {
      stroke: #f5ebef;
    }

    .timer-ring-progress {
      stroke: var(--pink);
      stroke-linecap: round;

      /* SVG側で pathLength=100 にしているため、100が円一周ぶんです。 */
      stroke-dasharray: 100;
      stroke-dashoffset: 0;
      transform: rotate(-90deg);
      transform-origin: 100px 100px;
      transition: stroke-dashoffset .1s linear;
    }

    .timer-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .timer-display {
      /* 円の真ん中に出る「残り秒数」。 */
      min-width: 3ch;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: clamp(54px, 17vw, 74px);
      line-height: .95;
      font-weight: 800;
      letter-spacing: -.04em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .timer-seconds-label {
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .timer-position {
      margin-top: 11px;
      min-height: 20px;
      color: var(--pink-dark);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 11px;
      font-weight: 800;
    }

    .timer-flow-preview {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 11px;
    }

    .timer-flow-step {
      padding: 5px 8px;
      border-radius: 999px;
      background: #fff7f9;
      color: var(--muted);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 10px;
      font-weight: 800;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }

    .timer-flow-step.active {
      background: var(--pink-soft);
      color: var(--pink-dark);
      transform: scale(1.05);
    }

    .timer-flow-arrow {
      color: #d9bec8;
      font-size: 10px;
      font-weight: 800;
    }

    .timer-main-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 92px;
      gap: 8px;
      margin-top: 16px;
    }

    .timer-main-button {
      min-height: 47px;
      border-radius: 14px;
      background: var(--pink-dark);
      color: white;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 14px;
      font-weight: 800;
      transition:
        transform .17s cubic-bezier(.34,1.56,.64,1),
        background .17s ease;
    }

    .timer-main-button.paused {
      background: #ca8098;
    }

    .timer-reset-button {
      min-height: 47px;
      border-radius: 14px;
      background: #fff0f5;
      color: var(--pink-dark);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 12px;
      font-weight: 800;
    }

    .timer-main-button:active,
    .timer-reset-button:active,
    .timer-config-button:active,
    .timer-phase-delete:active,
    .timer-set-button:active {
      transform: scale(.94);
    }

    .timer-status {
      min-height: 22px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .timer-config {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #f4e2e8;
      text-align: left;
    }

    .timer-config-title {
      margin-bottom: 8px;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
    }

    .timer-phase-editor {
      display: grid;
      gap: 6px;
    }

    .timer-phase-row {
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr) 32px 34px;
      align-items: center;
      gap: 6px;
      min-height: 42px;
      padding: 5px 6px 5px 10px;
      border-radius: 13px;
      background: #fff7f9;
    }

    .timer-phase-label {
      color: var(--muted);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 10px;
      font-weight: 800;
    }

    .timer-phase-input {
      width: 100%;
      min-width: 0;
      height: 32px;
      border: 0;
      outline: 0;
      border-radius: 9px;
      background: white;
      color: var(--text);
      text-align: right;
      padding: 0 8px;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 14px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .timer-phase-unit {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
    }

    .timer-phase-delete {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: white;
      color: #c7a9b4;
      font-size: 16px;
      font-weight: 800;
      transition: transform .17s cubic-bezier(.34,1.56,.64,1);
    }

    .timer-phase-delete:disabled {
      opacity: .35;
    }

    .timer-config-button {
      width: 100%;
      min-height: 38px;
      margin-top: 7px;
      border-radius: 12px;
      background: white;
      border: 2px solid #f2dfe5;
      color: var(--pink-dark);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 11px;
      font-weight: 800;
      transition: transform .17s cubic-bezier(.34,1.56,.64,1);
    }

    .timer-config-button:disabled {
      opacity: .45;
    }

    .timer-set-editor {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) 40px;
      align-items: center;
      gap: 7px;
      margin-top: 12px;
    }

    .timer-set-button {
      height: 38px;
      border-radius: 11px;
      background: var(--pink-soft);
      color: var(--pink-dark);
      font-size: 18px;
      font-weight: 800;
      transition: transform .17s cubic-bezier(.34,1.56,.64,1);
    }

    .timer-set-count {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border-radius: 11px;
      background: #fff7f9;
      color: var(--text);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 12px;
      font-weight: 800;
    }

    .timer-set-number {
      min-width: 2ch;
      text-align: right;
      color: var(--pink-dark);
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }

    .timer-card.timer-finished {
      animation: timerFinishPop .46s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes timerFinishPop {
      0% { transform: scale(1); }
      42% { transform: scale(1.025); }
      72% { transform: scale(.992); }
      100% { transform: scale(1); }
    }

    /* ------------------------------
       空データ表示
    ------------------------------ */

    .empty {
      padding: 46px 18px;
      text-align: center;
      color: rgba(100,80,88,.46);
      font-size: 12px;
      line-height: 1.8;
    }

    .empty-symbol {
      display: block;
      margin-bottom: 8px;
      font-size: 27px;
    }

    /* ------------------------------
       新規追加時の出現演出
    ------------------------------ */

    .new-row {
      animation: cardDrop .38s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes cardDrop {
      0% {
        opacity: 0;
        transform: translateY(-9px) scale(.94);
      }
      68% {
        opacity: 1;
        transform: translateY(2px) scale(1.015);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ------------------------------
       編集シート
    ------------------------------ */

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      padding-top: env(safe-area-inset-top);

      background: rgba(75, 53, 62, .19);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);

      opacity: 0;
      visibility: hidden;
      transition:
        opacity .2s ease,
        visibility .2s ease;
    }

    .sheet-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .sheet {
      width: min(100%, 640px);
      max-height: min(89vh, 760px);
      overflow-y: auto;

      border-radius: 28px 28px 0 0;
      background: #fffafc;

      padding:
        10px
        18px
        calc(21px + env(safe-area-inset-bottom));

      transform: translateY(110%);
      transition:
        transform .38s cubic-bezier(.34,1.18,.42,1);
    }

    .sheet-backdrop.open .sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 38px;
      height: 5px;
      margin: 0 auto 14px;
      border-radius: 999px;
      background: #ead6dd;
    }

    .sheet-title {
      margin: 0 0 17px;
      text-align: center;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 18px;
      font-weight: 800;
    }

    .field {
      margin-bottom: 15px;
    }

    .field-label {
      display: block;
      margin-bottom: 6px;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
    }

    .text-input,
    .text-area,
    .select-input {
      width: 100%;
      border: 2px solid #f2dfe5;
      outline: 0;
      border-radius: 15px;
      background: white;
      color: var(--text);
      padding: 12px 13px;
      font-size: 15px;
      transition: border-color .15s ease;
    }

    .text-input:focus,
    .text-area:focus,
    .select-input:focus {
      border-color: #efadc2;
    }

    .text-area {
      min-height: 105px;
      resize: vertical;
      line-height: 1.6;
    }

    .field-hint {
      margin-top: 5px;
      font-size: 10px;
      color: var(--muted);
    }

    .icon-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
    }

    .icon-choice {
      aspect-ratio: 1;
      border-radius: 11px;
      background: white;
      font-size: 19px;
      transition:
        transform .17s cubic-bezier(.34,1.56,.64,1),
        background .17s ease;
    }

    .icon-choice.selected {
      background: var(--pink-soft);
      transform: scale(1.08);
    }

    /* ハビット編集画面の「カテゴリー」「進捗リセット」で使う選択ボタン。
       select（プルダウン）ではなく、選択肢をそのまま見せる形式です。 */
    .choice-button-group {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .choice-button {
      min-height: 44px;
      padding: 8px 5px;
      border: 2px solid #f2dfe5;
      border-radius: 13px;
      background: white;
      color: var(--muted);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.35;
      transition:
        transform .17s cubic-bezier(.34,1.56,.64,1),
        border-color .17s ease,
        background .17s ease,
        color .17s ease;
    }

    .choice-button.selected {
      border-color: #efadc2;
      background: var(--pink-soft);
      color: var(--pink-dark);
    }

    .choice-button:active {
      transform: scale(.94);
    }

    .goal-button {
      width: 100%;
      padding: 12px;
      border-radius: 15px;
      background: white;
      border: 2px solid #f2dfe5;
      color: var(--pink-dark);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 15px;
      font-weight: 800;
    }

    .sheet-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 20px;
    }

    .primary-button {
      width: 100%;
      padding: 13px;
      border-radius: 15px;
      background: var(--pink-dark);
      color: white;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 14px;
      font-weight: 800;
    }

    .danger-button {
      width: 100%;
      padding: 12px;
      border-radius: 15px;
      background: #fff0f1;
      color: var(--delete);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 12px;
      font-weight: 800;
    }

    .danger-button[hidden] {
      display: none;
    }

    /* ------------------------------
       目標回数：回転式ピッカー
    ------------------------------ */

    .wheel-sheet {
      width: min(100%, 440px);
    }

    .wheel-wrap {
      position: relative;
      height: 260px;
      overflow: hidden;
      border-radius: 20px;
      background: white;
    }

    .wheel-highlight {
      position: absolute;
      z-index: 1;
      top: 104px;
      left: 14px;
      right: 14px;
      height: 52px;
      border-radius: 15px;
      background: var(--pink-soft);
      pointer-events: none;
    }

    .wheel-list {
      position: relative;
      z-index: 2;
      height: 260px;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      padding: 104px 0;
    }

    .wheel-list::-webkit-scrollbar {
      display: none;
    }

    .wheel-item {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-snap-align: center;

      /* 数字の横幅を揃え、1桁→2桁になっても中央位置がぶれにくくします。 */
      width: 100%;
      text-align: center;
      font-variant-numeric: tabular-nums;

      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #baa8ae;

      transition:
        font-size .15s ease,
        color .15s ease,
        opacity .15s ease;
    }

    .wheel-item.selected {
      color: var(--pink-dark);

      /* transform: scale() を使うと端末によって数字が左右に揺れて見えるため、
         選択中はフォントサイズだけを大きくします。 */
      font-size: 21px;
    }

    /* ------------------------------
       共通：小さな補助ボタン
    ------------------------------ */

    .soft-button {
      width: 100%;
      padding: 11px;
      border-radius: 14px;
      background: white;
      color: var(--pink-dark);
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 12px;
      font-weight: 800;
      transition: transform .18s cubic-bezier(.34,1.56,.64,1);
    }

    @media (max-width: 410px) {
      /* 小さいiPhone幅では4つのタブ文字が窮屈になりやすいので、
         タブ文字だけ少し小さくします。 */
      .main-tab {
        font-size: 10px;
      }

      .habit-card.compact {
        grid-template-columns: 22px 33px minmax(0,1fr) auto;
        gap: 5px;
      }

      .compact-controls {
        grid-template-columns: 27px 37px 27px;
      }

      .compact-button {
        width: 27px;
        height: 27px;
      }

      .icon-grid {
        grid-template-columns: repeat(6, 1fr);
      }

      .timer-ring-wrap {
        width: min(205px, 66vw);
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="header">
      <p class="app-name">HABITS</p>
      <h1 class="date-main" id="dateMain"></h1>
      <div class="date-sub" id="dateSub"></div>
    </header>

    <div class="nav-sticky">
      <nav class="main-tabs" id="mainTabs">
        <button class="main-tab active" data-tab="habits">ハビット</button>
        <button class="main-tab" data-tab="todos">Todo</button>
        <button class="main-tab" data-tab="memos">メモ</button>
        <button class="main-tab" data-tab="timer">タイマー</button>
        <button class="main-add" id="mainAddButton" aria-label="追加">＋</button>
      </nav>
    </div>

    <main class="content">

      <!-- ハビット -->
      <section class="section active" id="habitsSection">

        <div class="habit-toolbar">
          <div class="habit-filters">
            <button class="filter-button active" data-filter="all">すべて</button>
            <button class="filter-button" data-filter="daily">日常</button>
            <button class="filter-button" data-filter="creative">創作</button>
            <button class="filter-button" data-filter="game">ゲーム</button>
          </div>

          <div class="view-switcher" aria-label="表示切り替え">
            <button class="view-button" id="cardViewButton"
                    aria-label="カード表示"
                    title="カード表示">▦</button>

            <button class="view-button" id="compactViewButton"
                    aria-label="一覧表示"
                    title="一覧表示">≡</button>
          </div>
        </div>

        <div class="badge-panel" id="badgePanel" hidden>
          <div id="badgeMessage">
            ホーム画面アイコンに、まだTODAYになっていないハビット数を表示できます。
          </div>
          <button class="badge-enable" id="badgeEnableButton">
            🔔 ホーム画面バッジを有効にする
          </button>
        </div>

        <div id="habitList"></div>
      </section>

      <!-- Todo -->
      <section class="section" id="todosSection">
        <div id="todoList"></div>
      </section>

      <!-- メモ -->
      <section class="section" id="memosSection">
        <div id="memoList"></div>
      </section>

      <!-- タイマー -->
      <section class="section" id="timerSection">
        <div class="timer-card" id="timerCard">

          <div class="timer-kicker">INTERVAL TIMER</div>

          <!-- 円周が「今のステップ」の残り時間に合わせて減っていく表示。 -->
          <div class="timer-ring-wrap" aria-label="残り時間">
            <svg class="timer-ring" viewBox="0 0 200 200" aria-hidden="true">
              <circle class="timer-ring-bg"
                      cx="100" cy="100" r="82"></circle>
              <circle class="timer-ring-progress"
                      id="timerProgressCircle"
                      cx="100" cy="100" r="82"
                      pathLength="100"></circle>
            </svg>

            <div class="timer-center">
              <div class="timer-display" id="timerDisplay">30</div>
              <div class="timer-seconds-label">SECONDS</div>
            </div>
          </div>

          <div class="timer-position" id="timerPosition">
            セット 1 / 1 ・ ステップ 1 / 3
          </div>

          <!-- 例：30秒 → 10秒 → 30秒 の流れを小さく表示します。 -->
          <div class="timer-flow-preview" id="timerFlowPreview"></div>

          <div class="timer-main-actions">
            <button class="timer-main-button" id="timerStartPauseButton">
              スタート
            </button>
            <button class="timer-reset-button" id="timerResetButton">
              リセット
            </button>
          </div>

          <div class="timer-status" id="timerStatus">
            30秒 → 10秒 → 30秒で1セット。
          </div>

          <!--
            タイマー設定。
            各ステップの秒数と、同じ流れを何セット繰り返すかをここで変更できます。
          -->
          <div class="timer-config">
            <div class="timer-config-title">1セットの流れ</div>
            <div class="timer-phase-editor" id="timerPhaseEditor"></div>

            <button class="timer-config-button" id="timerAddPhaseButton">
              ＋ ステップを追加
            </button>

            <div class="timer-config-title" style="margin-top:14px; margin-bottom:6px;">
              セット数
            </div>

            <div class="timer-set-editor">
              <button class="timer-set-button" id="timerSetMinusButton" aria-label="セット数を減らす">−</button>
              <div class="timer-set-count">
                <span class="timer-set-number" id="timerSetCount">1</span>
                <span>セット</span>
              </div>
              <button class="timer-set-button" id="timerSetPlusButton" aria-label="セット数を増やす">＋</button>
            </div>
          </div>

        </div>
      </section>

    </main>
  </div>


  <!-- ハビット追加・編集シート -->
  <div class="sheet-backdrop" id="habitSheetBackdrop">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title" id="habitSheetTitle">ハビット追加</h2>

      <div class="field">
        <label class="field-label" for="habitNameInput">ハビット名</label>
        <input class="text-input"
               id="habitNameInput"
               type="text"
               maxlength="40"
               placeholder="例：水を飲む" />
      </div>

      <div class="field">
        <div class="field-label">アイコン</div>
        <div class="icon-grid" id="iconGrid"></div>
      </div>

      <div class="field">
        <div class="field-label">カテゴリー</div>

        <!--
          ハビットのカテゴリー選択。
          data-category の値はJS側のカテゴリー識別に使うため、
          表示文字だけ変える場合はボタン内の「日常」などだけ変更してください。
        -->
        <div class="choice-button-group" id="habitCategoryButtons">
          <button class="choice-button selected" data-category="daily">日常</button>
          <button class="choice-button" data-category="creative">創作</button>
          <button class="choice-button" data-category="game">ゲーム</button>
        </div>
      </div>

      <div class="field">
        <div class="field-label">目標回数</div>
        <button class="goal-button" id="goalButton">
          1 回
        </button>
      </div>

      <div class="field">
        <div class="field-label">進捗バーのリセット</div>

        <!--
          進捗バーの自動リセット時刻。
          none = リセットなし / midnight = 0:00 / four = 4:00
          data-reset の英字はJSが使う値なので、基本はそのままにしてください。
        -->
        <div class="choice-button-group" id="barResetButtons">
          <button class="choice-button selected" data-reset="none">
            なし
          </button>
          <button class="choice-button" data-reset="midnight">
            毎日<br>0:00
          </button>
          <button class="choice-button" data-reset="four">
            毎日<br>4:00
          </button>
        </div>
      </div>

      <div class="sheet-actions">
        <button class="primary-button" id="saveHabitButton">保存</button>
        <button class="danger-button" id="deleteHabitFromEditor" hidden>
          このハビットを削除
        </button>
      </div>
    </div>
  </div>


  <!-- Todo追加・編集シート -->
  <div class="sheet-backdrop" id="todoSheetBackdrop">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title" id="todoSheetTitle">Todo追加</h2>

      <div class="field">
        <label class="field-label" for="todoTitleInput">タイトル</label>
        <input class="text-input"
               id="todoTitleInput"
               type="text"
               maxlength="70"
               placeholder="例：牛乳を買う" />
      </div>

      <div class="field">
        <label class="field-label" for="todoNoteInput">
          一言メモ
        </label>
        <input class="text-input"
               id="todoNoteInput"
               type="text"
               maxlength="120"
               placeholder="入力しなくてもOK" />
        <div class="field-hint">補足がなければ空欄のままで大丈夫。</div>
      </div>

      <div class="sheet-actions">
        <button class="primary-button" id="saveTodoButton">保存</button>
        <button class="danger-button" id="deleteTodoFromEditor" hidden>
          このTodoを削除
        </button>
      </div>
    </div>
  </div>


  <!-- メモ追加・編集シート -->
  <div class="sheet-backdrop" id="memoSheetBackdrop">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title" id="memoSheetTitle">一言メモ</h2>

      <div class="field">
        <label class="field-label" for="memoTextInput">メモ</label>
        <textarea class="text-area"
                  id="memoTextInput"
                  maxlength="180"
                  placeholder="今日やったことを、ひとこと。"></textarea>

        <div class="field-hint">
          新規作成時の日付は自動で記録されます。
        </div>
      </div>

      <div class="sheet-actions">
        <button class="primary-button" id="saveMemoButton">保存</button>
        <button class="danger-button" id="deleteMemoFromEditor" hidden>
          このメモを削除
        </button>
      </div>
    </div>
  </div>


  <!-- 目標回数の回転式ピッカー -->
  <div class="sheet-backdrop" id="wheelBackdrop">
    <div class="sheet wheel-sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title">目標回数</h2>

      <div class="wheel-wrap">
        <div class="wheel-highlight"></div>
        <div class="wheel-list" id="wheelList"></div>
      </div>

      <div class="sheet-actions">
        <button class="primary-button" id="wheelDoneButton">
          決定
        </button>
      </div>
    </div>
  </div>


<script>
(() => {
  "use strict";

  /* =========================================================
     設定値（あとで数字を調整しやすい場所）
  ========================================================= */

  /* localStorage に保存するときの名前。
     ここを変えると「別アプリのデータ」として扱われ、今までの保存内容を読まなくなるため注意。 */
  const STORAGE_KEY = "habitTrackerData";

  /* 目標回数ピッカーの最大値。
     30 → 50 にすると、回転式ピッカーで50回まで選べます。 */
  const MAX_GOAL = 30;

  /* 回転式ピッカー1行ぶんの高さ。CSSの .wheel-item の 52px と揃える必要があります。 */
  const WHEEL_ITEM_HEIGHT = 52;

  /* 左スワイプで見せる削除ボタンの横幅。
     CSSの --delete-width: 88px と同じ数字にしてください。 */
  const DELETE_REVEAL_WIDTH = 88;

  /* 何px左へ動かしたら削除ボタンを開いた状態にするか。
     小さくすると軽いスワイプでも開きます。 */
  const SWIPE_OPEN_THRESHOLD = 34;

  /* TODAYマークを何ミリ秒長押しすると解除するか。550ms = 0.55秒。 */
  const TODAY_LONG_PRESS_MS = 550;

  /* TODAYを長押し解除したときの「しゅわん」演出を待つ時間。 */
  const TODAY_DISAPPEAR_MS = 340;

  /* 並び替え中、隣カードへ何割重なったら順番を交換するか。0.25 = 25%。 */
  const SWAP_OVERLAP_RATIO = 0.25;

  /* 並び替えで進行方向を急に逆へ戻した時の誤交換を防ぐ距離。単位はpx。 */
  const REVERSE_UNLOCK_DISTANCE = 46;

  /* インターバルタイマー1ステップの最小・最大秒数。
     1〜600秒（10分）まで入力できる設定です。 */
  const TIMER_MIN_SECONDS = 1;
  const TIMER_MAX_SECONDS = 600;

  /* 1セットに登録できるステップ数。現在は最大8個。 */
  const TIMER_MAX_PHASES = 8;

  /* 同じ流れを繰り返せるセット数。 */
  const TIMER_MIN_SETS = 1;
  const TIMER_MAX_SETS = 20;

  const ICONS = [
    "🌷","💗","💧","🎨","✏️","📖","🧹","🛁",
    "💊","🌱","⭐","🐰","🎮","🕹️","🎧","☕"
  ];

  const CATEGORY_NAMES = {
    daily: "日常",
    creative: "創作",
    game: "ゲーム"
  };


  /* =========================================================
     画面内で一時的に使う状態
  ========================================================= */

  let data = loadData();

  let currentTab = "habits";
  let currentHabitFilter = "all";

  let editingHabitId = null;
  let editingTodoId = null;
  let editingMemoId = null;

  let selectedHabitIcon = ICONS[0];
  let selectedGoal = 1;

  /* ハビット編集画面のボタン式選択値。 */
  let selectedHabitCategory = "daily";
  let selectedBarReset = "none";

  /* バーを再描画しても「前の長さ → 新しい長さ」を覚えておくための記録。
     これが「びよーん」と伸縮させるためのポイントです。 */
  const habitProgressHistory = new Map();

  let newHabitId = null;
  let newTodoId = null;
  let newMemoId = null;
  let newTodayHabitId = null;

  let suppressClickUntil = 0;

  let openSwipeRow = null;
  let swipeGesture = null;

  let dragPending = null;
  let dragState = null;

  let todayPress = null;

  /* タイマー設定欄は0.1秒更新で毎回作り直すと入力中のフォーカスが外れるため、
     「設定内容が本当に変わった時だけ」再生成するための印です。 */
  let timerEditorSignature = "";


  /* =========================================================
     HTML要素の取得
  ========================================================= */

  const dateMain = document.getElementById("dateMain");
  const dateSub = document.getElementById("dateSub");

  const habitList = document.getElementById("habitList");
  const todoList = document.getElementById("todoList");
  const memoList = document.getElementById("memoList");

  const mainTabs = document.getElementById("mainTabs");
  const mainAddButton = document.getElementById("mainAddButton");

  const timerCard = document.getElementById("timerCard");
  const timerDisplay = document.getElementById("timerDisplay");
  const timerProgressCircle = document.getElementById("timerProgressCircle");
  const timerPosition = document.getElementById("timerPosition");
  const timerFlowPreview = document.getElementById("timerFlowPreview");
  const timerPhaseEditor = document.getElementById("timerPhaseEditor");
  const timerAddPhaseButton = document.getElementById("timerAddPhaseButton");
  const timerSetMinusButton = document.getElementById("timerSetMinusButton");
  const timerSetPlusButton = document.getElementById("timerSetPlusButton");
  const timerSetCount = document.getElementById("timerSetCount");
  const timerStartPauseButton = document.getElementById("timerStartPauseButton");
  const timerResetButton = document.getElementById("timerResetButton");
  const timerStatus = document.getElementById("timerStatus");

  const cardViewButton = document.getElementById("cardViewButton");
  const compactViewButton = document.getElementById("compactViewButton");

  const badgePanel = document.getElementById("badgePanel");
  const badgeMessage = document.getElementById("badgeMessage");
  const badgeEnableButton = document.getElementById("badgeEnableButton");

  const habitSheetBackdrop =
    document.getElementById("habitSheetBackdrop");

  const habitSheetTitle =
    document.getElementById("habitSheetTitle");

  const habitNameInput =
    document.getElementById("habitNameInput");

  const habitCategoryButtons =
    document.getElementById("habitCategoryButtons");

  const barResetButtons =
    document.getElementById("barResetButtons");

  const iconGrid =
    document.getElementById("iconGrid");

  const goalButton =
    document.getElementById("goalButton");

  const saveHabitButton =
    document.getElementById("saveHabitButton");

  const deleteHabitFromEditor =
    document.getElementById("deleteHabitFromEditor");


  const todoSheetBackdrop =
    document.getElementById("todoSheetBackdrop");

  const todoSheetTitle =
    document.getElementById("todoSheetTitle");

  const todoTitleInput =
    document.getElementById("todoTitleInput");

  const todoNoteInput =
    document.getElementById("todoNoteInput");

  const saveTodoButton =
    document.getElementById("saveTodoButton");

  const deleteTodoFromEditor =
    document.getElementById("deleteTodoFromEditor");


  const memoSheetBackdrop =
    document.getElementById("memoSheetBackdrop");

  const memoSheetTitle =
    document.getElementById("memoSheetTitle");

  const memoTextInput =
    document.getElementById("memoTextInput");

  const saveMemoButton =
    document.getElementById("saveMemoButton");

  const deleteMemoFromEditor =
    document.getElementById("deleteMemoFromEditor");


  const wheelBackdrop =
    document.getElementById("wheelBackdrop");

  const wheelList =
    document.getElementById("wheelList");

  const wheelDoneButton =
    document.getElementById("wheelDoneButton");


  /* =========================================================
     保存データの読み書き
  ========================================================= */

  function defaultData() {
    return {
      habits: [],
      todos: [],
      memos: [],

      /* インターバルタイマー。
         phases = 1セット内の各ステップ秒数。初期値は 30秒 → 10秒 → 30秒。
         sets = その流れを何回繰り返すか。
         currentPhaseIndex = 現在何番目のステップか（0始まり）。
         currentSet = 現在何セット目か（1始まり）。 */
      timer: {
        phases: [30, 10, 30],
        sets: 1,
        currentPhaseIndex: 0,
        currentSet: 1,
        remainingSeconds: 30,
        running: false,
        endAt: null,
        finished: false
      },

      settings: {
        habitView: "card"
      }
    };
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);

      if (!raw) {
        return defaultData();
      }

      const parsed = JSON.parse(raw);

      if (!Array.isArray(parsed.habits)) {
        parsed.habits = [];
      }

      if (!Array.isArray(parsed.todos)) {
        parsed.todos = [];
      }

      if (!Array.isArray(parsed.memos)) {
        parsed.memos = [];
      }

      if (!parsed.settings ||
          typeof parsed.settings !== "object") {
        parsed.settings = {};
      }

      if (!["card","compact"].includes(parsed.settings.habitView)) {
        parsed.settings.habitView = "card";
      }

      /* 旧版の「○分カウントダウン」タイマーから、新しいインターバル式へ安全に移行。
         ハビット / Todo / メモの保存内容には触れません。 */
      const defaultTimerPhases = [30, 10, 30];

      if (!parsed.timer || typeof parsed.timer !== "object") {
        parsed.timer = {};
      }

      /* durationSeconds があるのは前回の「○分タイマー」形式。
         その動作中状態だけは引き継がず、新しい30→10→30の先頭から始めます。 */
      const isLegacyTimer =
        "durationSeconds" in parsed.timer ||
        !Array.isArray(parsed.timer.phases);

      if (!Array.isArray(parsed.timer.phases) || parsed.timer.phases.length === 0) {
        parsed.timer.phases = [...defaultTimerPhases];
      }

      parsed.timer.phases =
        parsed.timer.phases
          .slice(0, TIMER_MAX_PHASES)
          .map((seconds) =>
            clamp(
              Math.round(Number(seconds) || 30),
              TIMER_MIN_SECONDS,
              TIMER_MAX_SECONDS
            )
          );

      parsed.timer.sets =
        clamp(
          Math.round(Number(parsed.timer.sets) || 1),
          TIMER_MIN_SETS,
          TIMER_MAX_SETS
        );

      parsed.timer.currentPhaseIndex =
        clamp(
          Math.round(Number(parsed.timer.currentPhaseIndex) || 0),
          0,
          parsed.timer.phases.length - 1
        );

      parsed.timer.currentSet =
        clamp(
          Math.round(Number(parsed.timer.currentSet) || 1),
          1,
          parsed.timer.sets
        );

      const currentPhaseSeconds =
        parsed.timer.phases[parsed.timer.currentPhaseIndex];

      parsed.timer.remainingSeconds =
        clamp(
          Number(parsed.timer.remainingSeconds) || currentPhaseSeconds,
          0,
          currentPhaseSeconds
        );

      parsed.timer.running = Boolean(parsed.timer.running);
      parsed.timer.endAt = Number(parsed.timer.endAt) || null;
      parsed.timer.finished = Boolean(parsed.timer.finished);

      if (isLegacyTimer) {
        parsed.timer.currentPhaseIndex = 0;
        parsed.timer.currentSet = 1;
        parsed.timer.remainingSeconds = parsed.timer.phases[0];
        parsed.timer.running = false;
        parsed.timer.endAt = null;
        parsed.timer.finished = false;

        /* 旧形式専用の値は今後使わないため削除。 */
        delete parsed.timer.durationSeconds;
      }

      if (parsed.timer.running && !parsed.timer.endAt) {
        parsed.timer.running = false;
      }

      parsed.habits = parsed.habits.map((habit) => ({
        id: habit.id || createId(),
        name: habit.name || "ハビット",
        icon: habit.icon || "🌷",
        category: CATEGORY_NAMES[habit.category]
          ? habit.category
          : "daily",

        goal: Math.max(
          1,
          Number(habit.goal || 1)
        ),

        count: Math.max(
          0,
          Number(habit.count || 0)
        ),

        barReset:
          ["none","midnight","four"].includes(habit.barReset)
            ? habit.barReset
            : "none",

        barResetKey:
          habit.barResetKey || null,

        lastDoneAt:
          Number(habit.lastDoneAt || 0) || null
      }));

      parsed.todos = parsed.todos.map((todo) => ({
        id: todo.id || createId(),
        title: String(todo.title || ""),
        note: String(todo.note || ""),
        done: Boolean(todo.done),
        createdAt:
          Number(todo.createdAt) || Date.now(),
        completedAt:
          Number(todo.completedAt) || null
      }));

      parsed.memos = parsed.memos.map((memo) => ({
        id: memo.id || createId(),
        text: String(memo.text || ""),
        createdAt:
          Number(memo.createdAt) || Date.now(),
        updatedAt:
          Number(memo.updatedAt) || null
      }));

      return parsed;

    } catch (error) {
      console.error("データ読込エラー:", error);
      return defaultData();
    }
  }

  function saveData() {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );
  }

  function createId() {
    if (crypto && crypto.randomUUID) {
      return crypto.randomUUID();
    }

    return (
      Date.now().toString(36) +
      Math.random().toString(36).slice(2)
    );
  }


  /* =========================================================
     共通の補助関数
  ========================================================= */

  function escapeHTML(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function closeAllSheets() {
    [
      habitSheetBackdrop,
      todoSheetBackdrop,
      memoSheetBackdrop,
      wheelBackdrop
    ].forEach((sheet) => {
      sheet.classList.remove("open");
    });
  }


  /* =========================================================
     画面上部の日付
  ========================================================= */

  function renderDate() {
    const now = new Date();

    dateMain.textContent =
      `${now.getMonth() + 1}月${now.getDate()}日`;

    const weekdays = [
      "日曜日","月曜日","火曜日","水曜日",
      "木曜日","金曜日","土曜日"
    ];

    dateSub.textContent =
      `${now.getFullYear()}年 ${weekdays[now.getDay()]}`;
  }


  /* =========================================================
     日付境界・進捗リセット
  ========================================================= */

  function getPeriodKey(timestamp, resetHour) {
    const date = new Date(timestamp);

    const shifted =
      new Date(
        date.getTime() -
        resetHour * 60 * 60 * 1000
      );

    return [
      shifted.getFullYear(),
      String(shifted.getMonth() + 1).padStart(2, "0"),
      String(shifted.getDate()).padStart(2, "0")
    ].join("-");
  }

  function getBarResetHour(habit) {
    if (habit.barReset === "midnight") return 0;
    if (habit.barReset === "four") return 4;
    return null;
  }

  function getTodayResetHour(habit) {
    if (habit.category === "game") {
      return 4;
    }

    return 0;
  }

  function isDoneToday(habit) {
    if (!habit.lastDoneAt) {
      return false;
    }

    const resetHour =
      getTodayResetHour(habit);

    return (
      getPeriodKey(
        habit.lastDoneAt,
        resetHour
      ) ===
      getPeriodKey(
        Date.now(),
        resetHour
      )
    );
  }

  function applyHabitResets() {
    let changed = false;

    for (const habit of data.habits) {
      const resetHour =
        getBarResetHour(habit);

      if (resetHour === null) {
        continue;
      }

      const nowKey =
        getPeriodKey(
          Date.now(),
          resetHour
        );

      if (!habit.barResetKey) {
        habit.barResetKey = nowKey;
        changed = true;
        continue;
      }

      if (habit.barResetKey !== nowKey) {
        habit.count = 0;
        habit.barResetKey = nowKey;
        changed = true;
      }
    }

    if (changed) {
      saveData();
    }

    return changed;
  }


  /* =========================================================
     画面全体の描画
  ========================================================= */

  function renderAll() {
    applyHabitResets();
    renderDate();
    renderNavigation();
    renderHabits();
    renderTodos();
    renderMemos();
    renderTimer();
    renderBadgePanel();
    updateAppBadge();
  }

  function renderNavigation() {
    document
      .querySelectorAll(".main-tab")
      .forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset.tab === currentTab
        );
      });

    document
      .querySelectorAll(".section")
      .forEach((section) => {
        section.classList.remove("active");
      });

    const sectionMap = {
      habits: "habitsSection",
      todos: "todosSection",
      memos: "memosSection",
      timer: "timerSection"
    };

    document
      .getElementById(sectionMap[currentTab])
      .classList.add("active");

    /* タイマーには「新規追加」が無いため、タイマータブだけ＋ボタンを隠します。 */
    mainTabs.classList.toggle(
      "timer-mode",
      currentTab === "timer"
    );
  }


  /* =========================================================
     ハビットの描画
  ========================================================= */

  function renderHabits() {
    const view =
      data.settings.habitView;

    cardViewButton.classList.toggle(
      "active",
      view === "card"
    );

    compactViewButton.classList.toggle(
      "active",
      view === "compact"
    );

    document
      .querySelectorAll(".filter-button")
      .forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset.filter === currentHabitFilter
        );
      });

    const visible =
      data.habits.filter((habit) => {
        if (currentHabitFilter === "all") {
          return true;
        }

        return habit.category === currentHabitFilter;
      });

    if (visible.length === 0) {
      habitList.innerHTML = `
        <div class="empty">
          <span class="empty-symbol">🌷</span>
          まだハビットがありません。<br>
          ＋から追加できます。
        </div>
      `;

      return;
    }

    habitList.innerHTML =
      visible
        .map((habit) => {
          return view === "card"
            ? habitLargeHTML(habit)
            : habitCompactHTML(habit);
        })
        .join("");

    bindSwipeSurfaces(habitList);

    /* innerHTMLでカードを作り直した直後はCSSが「前のバー長」を知らないため、
       JSで前回の長さから今回の長さへ移動させます。 */
    animateHabitProgressBars(visible);

    if (newHabitId) {
      setTimeout(() => {
        newHabitId = null;
      }, 500);
    }

    if (newTodayHabitId) {
      setTimeout(() => {
        newTodayHabitId = null;
      }, 500);
    }
  }

  function habitLargeHTML(habit) {
    const percent =
      clamp(
        (habit.count / habit.goal) * 100,
        0,
        100
      );

    const previousPercent =
      habitProgressHistory.has(habit.id)
        ? habitProgressHistory.get(habit.id)
        : 0;

    const done =
      habit.count >= habit.goal;

    const today =
      isDoneToday(habit);

  /* =========================================================
     インターバルタイマーの描画・操作
  ========================================================= */

  function getCurrentTimerPhaseSeconds() {
    return (
      data.timer.phases[data.timer.currentPhaseIndex] ||
      data.timer.phases[0] ||
      30
    );
  }

  function getTimerRemainingMilliseconds() {
    if (data.timer.running && data.timer.endAt) {
      return Math.max(
        0,
        data.timer.endAt - Date.now()
      );
    }

    return Math.max(
      0,
      Number(data.timer.remainingSeconds || 0) * 1000
    );
  }

  function resetTimerProgress() {
    data.timer.running = false;
    data.timer.endAt = null;
    data.timer.finished = false;
    data.timer.currentPhaseIndex = 0;
    data.timer.currentSet = 1;
    data.timer.remainingSeconds = data.timer.phases[0] || 30;
  }

  /* 今のステップが終わったとき、次のステップ／次セットへ進みます。
     もう次が無ければ true を返して「全セット終了」にします。 */
  function moveTimerToNextPhase() {
    const lastPhaseIndex =
      data.timer.phases.length - 1;

    if (data.timer.currentPhaseIndex < lastPhaseIndex) {
      data.timer.currentPhaseIndex += 1;
    } else if (data.timer.currentSet < data.timer.sets) {
      data.timer.currentSet += 1;
      data.timer.currentPhaseIndex = 0;
    } else {
      data.timer.running = false;
      data.timer.endAt = null;
      data.timer.remainingSeconds = 0;
      data.timer.finished = true;
      return true;
    }

    data.timer.remainingSeconds =
      getCurrentTimerPhaseSeconds();

    return false;
  }

  /* アプリを閉じていた間にステップ終了時刻を過ぎていた場合も、
     経過したぶんだけ次のステップへ追いつかせます。 */
  function syncTimerState() {
    if (!data.timer.running || !data.timer.endAt) {
      return { changed: false, finishedNow: false };
    }

    let changed = false;
    let finishedNow = false;
    const now = Date.now();

    while (data.timer.running && data.timer.endAt <= now) {
      const overflowMilliseconds =
        now - data.timer.endAt;

      const finished =
        moveTimerToNextPhase();

      changed = true;

      if (finished) {
        finishedNow = true;
        break;
      }

      const nextDurationMilliseconds =
        getCurrentTimerPhaseSeconds() * 1000;

      data.timer.endAt =
        now +
        nextDurationMilliseconds -
        overflowMilliseconds;

      /* 1回の同期で複数ステップぶん時間が過ぎていれば、whileでさらに先へ進みます。 */
    }

    if (data.timer.running) {
      data.timer.remainingSeconds =
        Math.max(
          0,
          Math.ceil(
            (data.timer.endAt - Date.now()) / 1000
          )
        );
    }

    if (changed) {
      saveData();
    }

    return { changed, finishedNow };
  }

  function renderTimerFlowPreview() {
    timerFlowPreview.innerHTML =
      data.timer.phases
        .map((seconds, index) => {
          const activeClass =
            index === data.timer.currentPhaseIndex &&
            !data.timer.finished
              ? " active"
              : "";

          const arrow =
            index < data.timer.phases.length - 1
              ? `<span class="timer-flow-arrow">→</span>`
              : "";

          return `
            <span class="timer-flow-step${activeClass}">
              ${seconds}秒
            </span>
            ${arrow}
          `;
        })
        .join("");
  }

  function renderTimerPhaseEditor() {
    const signature =
      `${data.timer.phases.join(",")}|sets:${data.timer.sets}`;

    /* 円周アニメーションは0.1秒ごとに描画しますが、
       設定欄まで毎回作り直すと数字入力中にカーソルが飛ぶため、
       秒数やセット数が変わった時だけHTMLを更新します。 */
    if (
      signature === timerEditorSignature &&
      timerPhaseEditor.children.length > 0
    ) {
      return;
    }

    timerEditorSignature = signature;

    timerPhaseEditor.innerHTML =
      data.timer.phases
        .map((seconds, index) => `
          <div class="timer-phase-row" data-phase-index="${index}">
            <div class="timer-phase-label">STEP ${index + 1}</div>

            <input class="timer-phase-input"
                   type="number"
                   inputmode="numeric"
                   min="${TIMER_MIN_SECONDS}"
                   max="${TIMER_MAX_SECONDS}"
                   value="${seconds}"
                   data-action="timer-phase-seconds"
                   data-phase-index="${index}"
                   aria-label="ステップ${index + 1}の秒数">

            <div class="timer-phase-unit">秒</div>

            <button class="timer-phase-delete"
                    data-action="timer-delete-phase"
                    data-phase-index="${index}"
                    aria-label="ステップ${index + 1}を削除"
                    ${data.timer.phases.length <= 1 ? "disabled" : ""}>
              ×
            </button>
          </div>
        `)
        .join("");

    timerAddPhaseButton.disabled =
      data.timer.phases.length >= TIMER_MAX_PHASES;

    timerAddPhaseButton.textContent =
      data.timer.phases.length >= TIMER_MAX_PHASES
        ? `最大 ${TIMER_MAX_PHASES} ステップ`
        : "＋ ステップを追加";

    timerSetCount.textContent =
      data.timer.sets;
  }

  function renderTimer() {
    const syncResult =
      syncTimerState();

    const phaseSeconds =
      Math.max(1, getCurrentTimerPhaseSeconds());

    const remainingMilliseconds =
      data.timer.finished
        ? 0
        : getTimerRemainingMilliseconds();

    const remainingSeconds =
      Math.max(
        0,
        Math.ceil(remainingMilliseconds / 1000)
      );

    const progressPercent =
      clamp(
        (remainingMilliseconds / (phaseSeconds * 1000)) * 100,
        0,
        100
      );

    /* pathLength=100 なので、0 = 円が全部見える / 100 = 全部消える。 */
    timerProgressCircle.style.strokeDashoffset =
      String(100 - progressPercent);

    timerDisplay.textContent =
      remainingSeconds;

    timerPosition.textContent =
      data.timer.finished
        ? `全 ${data.timer.sets} セット終了`
        : `セット ${data.timer.currentSet} / ${data.timer.sets} ・ ステップ ${data.timer.currentPhaseIndex + 1} / ${data.timer.phases.length}`;

    renderTimerFlowPreview();
    renderTimerPhaseEditor();

    if (data.timer.running) {
      timerStartPauseButton.textContent = "一時停止";
      timerStartPauseButton.classList.add("paused");
      timerStatus.textContent =
        "カウント中。ステップ終了後は自動で次へ進みます。";

    } else if (data.timer.finished) {
      timerStartPauseButton.textContent = "もう一度";
      timerStartPauseButton.classList.remove("paused");
      timerStatus.textContent = "全セット終了！";

    } else if (
      remainingSeconds < phaseSeconds ||
      data.timer.currentPhaseIndex > 0 ||
      data.timer.currentSet > 1
    ) {
      timerStartPauseButton.textContent = "再開";
      timerStartPauseButton.classList.remove("paused");
      timerStatus.textContent = "一時停止中。";

    } else {
      timerStartPauseButton.textContent = "スタート";
      timerStartPauseButton.classList.remove("paused");
      timerStatus.textContent =
        data.timer.phases.map((seconds) => `${seconds}秒`).join(" → ") +
        ` で1セット × ${data.timer.sets}`;
    }

    if (syncResult.finishedNow) {
      timerCard.classList.remove("timer-finished");
      void timerCard.offsetWidth;
      timerCard.classList.add("timer-finished");
      navigator.vibrate?.([35, 45, 35]);
    } else if (syncResult.changed) {
      navigator.vibrate?.(18);
    }
  }

  function applyTimerConfigurationChange() {
    /* 設定を触ったら、途中経過は一旦先頭へ戻します。
       「設定変更したのに途中ステップから始まる」を防ぐためです。 */
    resetTimerProgress();
    saveData();
    renderTimer();
  }

  timerPhaseEditor.addEventListener("change", (event) => {
    const input =
      event.target.closest('[data-action="timer-phase-seconds"]');

    if (!input) return;

    const index =
      Number(input.dataset.phaseIndex);

    if (!Number.isInteger(index) || !data.timer.phases[index]) {
      return;
    }

    data.timer.phases[index] =
      clamp(
        Math.round(Number(input.value) || 30),
        TIMER_MIN_SECONDS,
        TIMER_MAX_SECONDS
      );

    applyTimerConfigurationChange();
  });

  timerPhaseEditor.addEventListener("click", (event) => {
    const button =
      event.target.closest('[data-action="timer-delete-phase"]');

    if (!button || data.timer.phases.length <= 1) {
      return;
    }

    const index =
      Number(button.dataset.phaseIndex);

    if (!Number.isInteger(index)) return;

    data.timer.phases.splice(index, 1);
    applyTimerConfigurationChange();
  });

  timerAddPhaseButton.addEventListener("click", () => {
    if (data.timer.phases.length >= TIMER_MAX_PHASES) {
      return;
    }

    /* 新しいステップは30秒で追加。あとから数字欄を直接変更できます。 */
    data.timer.phases.push(30);
    applyTimerConfigurationChange();
  });

  function changeTimerSetCount(amount) {
    const nextSets =
      clamp(
        data.timer.sets + amount,
        TIMER_MIN_SETS,
        TIMER_MAX_SETS
      );

    if (nextSets === data.timer.sets) {
      return;
    }

    data.timer.sets = nextSets;
    applyTimerConfigurationChange();
  }

  timerSetMinusButton.addEventListener("click", () => {
    changeTimerSetCount(-1);
  });

  timerSetPlusButton.addEventListener("click", () => {
    changeTimerSetCount(1);
  });

  timerStartPauseButton.addEventListener("click", () => {
    if (data.timer.running) {
      /* 一時停止：現在の残り秒数を確定して保存。 */
      data.timer.remainingSeconds =
        Math.max(
          0,
          Math.ceil(
            getTimerRemainingMilliseconds() / 1000
          )
        );

      data.timer.running = false;
      data.timer.endAt = null;

    } else {
      if (data.timer.finished) {
        resetTimerProgress();
      }

      let remainingSeconds =
        Math.max(
          0,
          Number(data.timer.remainingSeconds) || 0
        );

      if (remainingSeconds <= 0) {
        remainingSeconds =
          getCurrentTimerPhaseSeconds();

        data.timer.remainingSeconds =
          remainingSeconds;
      }

      data.timer.finished = false;
      data.timer.running = true;
      data.timer.endAt =
        Date.now() + remainingSeconds * 1000;
    }

    saveData();
    renderTimer();
  });

  habitList.addEventListener("click", (event) => {
    if (Date.now() < suppressClickUntil) {
      return;
    }

    const target =
      event.target.closest("[data-action]");

    if (!target) return;

    const action =
      target.dataset.action;

    const id =
      target.dataset.id;

    if (action === "habit-plus") {
      changeHabitCount(id, 1, target);
      return;
    }

    if (action === "habit-minus") {
      changeHabitCount(id, -1, target);
      return;
    }

    if (action === "edit-habit") {
      openHabitEditor(id);
      return;
    }

    if (action === "delete-habit") {
      deleteHabit(id);
    }
  });

  function changeHabitCount(id, amount, button) {
    const habit =
      data.habits.find(
        (item) => item.id === id
      );

    if (!habit) return;

    const wasToday =
      isDoneToday(habit);

    habit.count =
      Math.max(
        0,
        habit.count + amount
      );

    if (amount > 0 && !wasToday) {
      habit.lastDoneAt = Date.now();
      newTodayHabitId = habit.id;
    }

    saveData();

    if (button) {
      button.classList.remove("pop");
      void button.offsetWidth;
      button.classList.add("pop");
    }

    renderHabits();
    updateAppBadge();
  }

  function deleteHabit(id) {
    const habit =
      data.habits.find(
        (item) => item.id === id
      );

    if (!habit) return;

    if (!confirm(`「${habit.name}」を削除しますか？`)) {
      return;
    }

    data.habits =
      data.habits.filter(
        (item) => item.id !== id
      );

    closeOpenSwipe();
    saveData();
    renderHabits();
    updateAppBadge();
  }

  function bindSwipeSurfaces(container) {

  function isSwipeBlockedTarget(target) {
    return Boolean(
      target.closest(

        ".compact-today," +
        "input," +
        "textarea," +
        "select," +
        "a"

  function startSwipe(event) {
    if (dragState || dragPending) {
      return;
    }

    if (isSwipeBlockedTarget(event.target)) {
      return;
    }

    const surface =
      event.currentTarget;

    const row =
      surface.closest(".swipe-row");

    if (!row) return;

    if (
      openSwipeRow &&
      openSwipeRow !== row
    ) {
      closeOpenSwipe();
    }

    const wasOpen =
      row === openSwipeRow;

    swipeGesture = {
      pointerId: event.pointerId,
      row,
      surface,
      startX: event.clientX,
      startY: event.clientY,
      startOffset:
        wasOpen
          ? -DELETE_REVEAL_WIDTH
          : 0,
      currentOffset:
        wasOpen
          ? -DELETE_REVEAL_WIDTH
          : 0,
      mode: null,
      moved: false,
      wasOpen
    };

    surface.style.transition = "none";

    "pointermove",
    (event) => {

      if (!swipeGesture) {
        return;
      }

      if (
        event.pointerId !==
        swipeGesture.pointerId
      ) {
        return;
      }

      const dx =
        event.clientX -
        swipeGesture.startX;

      const dy =
        event.clientY -
        swipeGesture.startY;

      if (!swipeGesture.mode) {
        if (
          Math.abs(dx) < 6 &&
          Math.abs(dy) < 6
        ) {
          return;
        }

        if (
          Math.abs(dx) >
          Math.abs(dy) * 1.16
        ) {
          swipeGesture.mode = "horizontal";
        } else {
          swipeGesture.mode = "vertical";
          swipeGesture.surface.style.transition = "";
          swipeGesture = null;
          return;
        }
      }

      if (
        swipeGesture.mode !== "horizontal"
      ) {
        return;
      }

      event.preventDefault();

      swipeGesture.moved = true;

      let offset =
        swipeGesture.startOffset + dx;

      if (offset > 0) {

        offset <

          DELETE_REVEAL_WIDTH;
