<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HABITS</title>

  <meta
    name="theme-color"
    content="#f6cbd8"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="HABITS"
  >

  <link
    rel="apple-touch-icon"
    href="icon.png"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <style>

    @import url(
      'https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap'
    );


    /* =========================
       基本
    ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f6cbd8;
    }

    body {
      color: #51464a;

      font-family:
        "Zen Maru Gothic",
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      -webkit-tap-highlight-color: transparent;
    }

    button,
    input {
      font-family:
        "M PLUS Rounded 1c",
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
    }

    button {
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      max-width: 520px;

      margin: 0 auto;

      padding:
        max(30px, env(safe-area-inset-top))
        18px
        max(80px, env(safe-area-inset-bottom));
    }


    /* =========================
       ヘッダー
    ========================= */

    header {
      margin-bottom: 22px;
    }

    .app-title {
      margin: 0;

      color: white;

      font-family:
        "M PLUS Rounded 1c",
        sans-serif;

      font-size: 19px;
      font-weight: 800;

      letter-spacing: 0.18em;

      opacity: 0.92;
    }

    .big-date {
      margin-top: 4px;

      color: white;

      font-size: 31px;
      font-weight: 700;

      line-height: 1.25;
    }

    .date-sub {
      margin-top: 4px;

      color:
        rgba(255,255,255,0.88);

      font-size: 13px;
    }


    /* =========================
       今日判定設定
    ========================= */

    .global-setting {
      margin-top: 17px;

      padding: 11px 13px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 10px;

      background:
        rgba(255,255,255,0.30);

      border-radius: 16px;

      color: white;
    }

    .global-setting-label {
      font-size: 12px;
      font-weight: 600;
    }

    .tiny-segment {
      display: flex;

      padding: 3px;

      background:
        rgba(255,255,255,0.25);

      border-radius: 999px;
    }

    .tiny-segment button {
      border: none;
      border-radius: 999px;

      padding: 6px 11px;

      background: transparent;

      color: white;

      font-size: 11px;
      font-weight: 800;
    }

    .tiny-segment button.active {
      background: white;
      color: #d77794;
    }


    /* =========================
       タブ
    ========================= */

    .tabs {
      display: flex;

      gap: 7px;

      margin-bottom: 16px;

      overflow-x: auto;

      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-button {
      flex: 1;

      min-width: 80px;

      border: none;
      border-radius: 999px;

      padding: 10px 13px;

      background:
        rgba(255,255,255,0.36);

      color: white;

      font-size: 13px;
      font-weight: 700;
    }

    .tab-button.active {
      background: white;
      color: #d67391;

      box-shadow:
        0 5px 15px
        rgba(105,70,80,0.07);
    }


    /* =========================
       習慣カード
    ========================= */

    .habit-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .habit-card {
      position: relative;

      padding: 18px 18px 16px;

      background: white;

      border-radius: 24px;

      box-shadow:
        0 7px 20px
        rgba(105,70,80,0.08);

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        opacity 0.18s ease;
    }

    .habit-card.new-card {
      animation:
        cardDrop
        0.65s
        cubic-bezier(
          0.22,
          1.25,
          0.45,
          1
        );
    }

    @keyframes cardDrop {

      0% {
        opacity: 0;

        transform:
          translateY(-85px)
          scale(0.96);
      }

      65% {
        opacity: 1;

        transform:
          translateY(10px)
          scale(1.015);
      }

      82% {
        transform:
          translateY(-5px)
          scale(0.995);
      }

      100% {
        transform:
          translateY(0)
          scale(1);
      }
    }

    .habit-card.completed-pop {
      animation:
        completedPop
        0.42s ease;
    }

    @keyframes completedPop {

      45% {
        transform:
          scale(1.025);
      }

      70% {
        transform:
          scale(0.99);
      }
    }


    /* =========================
       並び替え
    ========================= */

    .habit-card.dragging {
      z-index: 100;

      opacity: 0.94;

      box-shadow:
        0 18px 38px
        rgba(100,65,75,0.22);

      transform:
        scale(1.025);
    }

    .drag-handle {
      width: 34px;
      height: 34px;

      flex-shrink: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      border: none;
      border-radius: 50%;

      background: #f9edf0;

      color: #c8aab3;

      font-size: 18px;

      touch-action: none;
    }


    /* =========================
       カード上部
    ========================= */

    .habit-top {
      display: flex;
      align-items: center;

      gap: 10px;
    }

    .habit-icon {
      width: 44px;
      height: 44px;

      flex-shrink: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #fff0f4;

      border-radius: 15px;

      font-size: 23px;
    }

    .habit-title-area {
      min-width: 0;
      flex: 1;
    }

    .habit-name {
      font-size: 18px;
      font-weight: 700;

      word-break: break-word;
    }

    .habit-category {
      margin-top: 2px;

      color: #b5a2a8;

      font-family:
        "M PLUS Rounded 1c",
        sans-serif;

      font-size: 10px;
      font-weight: 700;
    }


    /* =========================
       TODAY
    ========================= */

    .today-badge {
      flex-shrink: 0;

      padding: 6px 9px;

      border-radius: 999px;

      background: #fbe4eb;

      color: #d66e8e;

      font-family:
        "M PLUS Rounded 1c",
        sans-serif;

      font-size: 10px;
      font-weight: 800;

      opacity: 0;

      transform:
        scale(0.65);

      transition:
        opacity 0.25s ease,
        transform 0.35s
        cubic-bezier(
          0.34,
          1.56,
          0.64,
          1
        );
    }

    .today-badge.visible {
      opacity: 1;
      transform: scale(1);
    }


    /* =========================
       カウント
    ========================= */

    .progress-info {
      margin-top: 15px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .count {
      color: #8d7f84;

      font-family:
        "M PLUS Rounded 1c",
        sans-serif;

      font-size: 13px;
      font-weight: 700;
    }

    .done {
      color: #d97796;

      font-family:
        "M PLUS Rounded 1c",
        sans-serif;

      font-size: 11px;
      font-weight: 800;

      opacity: 0;

      transition: opacity 0.25s;
    }

    .done.visible {
      opacity: 1;
    }


    /* =========================
       バー
    ========================= */

    .progress-bg {
      width: 100%;
      height: 13px;

      margin-top: 8px;

      overflow: hidden;

      background: #f3e5e9;

      border-radius: 999px;
    }

    .progress-bar {
      width: 0;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          #f2b0c2,
          #eb8fac
        );

      border-radius: 999px;

      transition:
        width
        0.55s
        cubic-bezier(
          0.34,
          1.56,
          0.64,
          1
        );
    }


    /* =========================
       プラスマイナス
    ========================= */

    .habit-actions {
      margin-top: 13px;

      display: flex;
      justify-content: flex-end;

      gap: 8px;
    }

    .round-button {
      width: 44px;
      height: 44px;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 0;

      border: none;
      border-radius: 50%;

      background: #f5d7df;
      color: #7e646d;

      font-size: 22px;
      font-weight: 700;
    }

    .round-button.plus {
      background: #ee9fb6;
      color: white;
    }

    .round-button:active {
      transform: scale(0.82);
    }

    .round-button.button-pop {
      animation:
        buttonPop
        0.32s ease;
    }

    @keyframes buttonPop {

      0% {
        transform: scale(0.82);
      }

      55% {
        transform: scale(1.18);
      }

      75% {
        transform: scale(0.95);
      }

      100% {
        transform: scale(1);
      }
    }


    /* =========================
       バーリセット設定
    ========================= */

    .habit-settings {
      margin-top: 14px;
      padding-top: 12px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 8px;

      border-top:
        1px solid #f4e7eb;
    }

    .bar-reset-label {
      color: #a39197;

      font-family:
        "M PLUS Rounded 1c",
        sans-serif;

      font-size: 10px;
    }

    .bar-reset-button {
      border: none;
      border-radius: 999px;

      padding: 7px 10px;

      background: #f7dce4;

      color: #c66d88;

      font-size: 10px;
      font-weight: 800;
    }

    .delete-button {
      margin-top: 10px;

      border: none;
      padding: 0;

      background: transparent;

      color: #c6b6bb;

      font-size: 10px;
    }


    /* =========================
       追加欄
    ========================= */

    .add-card {
      margin-top: 20px;

      padding: 20px;

      background:
        rgba(255,255,255,0.68);

      border-radius: 24px;
    }

    .add-title {
      margin-bottom: 15px;

      font-size: 17px;
      font-weight: 700;
    }

    .field-label {
      display: block;

      margin:
        11px 0 7px;

      color: #917b82;

      font-family:
        "M PLUS Rounded 1c",
        sans-serif;

      font-size: 11px;
      font-weight: 700;
    }

    #habitName {
      width: 100%;

      border: none;
      outline: none;

      border-radius: 14px;

      padding: 13px 14px;

      background: white;

      color: #4f4549;

      font-size: 16px;
    }


    /* =========================
       アイコン選択
    ========================= */

    .icon-grid {
      display: grid;

      grid-template-columns:
        repeat(6, 1fr);

      gap: 7px;
    }

    .icon-choice {
      aspect-ratio: 1;

      border: 2px solid transparent;
      border-radius: 13px;

      background:
        rgba(255,255,255,0.75);

      font-size: 21px;
    }

    .icon-choice.selected {
      border-color: #ed9db5;
      background: white;

      transform: scale(1.08);
    }


    /* =========================
       カテゴリ選択
    ========================= */

    .category-choice {
      display: flex;
      gap: 8px;
    }

    .category-button {
      flex: 1;

      border: none;
      border-radius: 13px;

      padding: 10px;

      background:
        rgba(255,255,255,0.65);

      color: #917b82;

      font-size: 12px;
      font-weight: 700;
    }

    .category-button.selected {
      background: white;
      color: #d36f8d;
    }


    /* =========================
       目標回数
    ========================= */

    .goal-picker-button {
      width: 100%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border: none;
      border-radius: 14px;

      padding: 13px 15px;

      background: white;

      color: #594b50;

      font-size: 14px;
      font-weight: 700;
    }

    .goal-picker-value {
      color: #d77492;

      font-size: 18px;
      font-weight: 800;
    }


    /* =========================
       バー更新選択
    ========================= */

    .reset-selector {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 6px;
    }

    .reset-option {
      border: none;
      border-radius: 13px;

      padding: 10px 5px;

      background:
        rgba(255,255,255,0.60);

      color: #917b82;

      font-size: 10px;
      font-weight: 700;
    }

    .reset-option.selected {
      background: white;
      color: #d36f8d;
    }


    /* =========================
       追加
    ========================= */

    .add-button {
      width: 100%;

      margin-top: 18px;

      border: none;
      border-radius: 16px;

      padding: 14px;

      background: white;
      color: #d56f8e;

      font-size: 15px;
      font-weight: 800;
    }

    .add-button:active {
      transform: scale(0.97);
    }


    /* =========================
       空
    ========================= */

    .empty {
      padding: 30px 20px;

      text-align: center;

      color:
        rgba(255,255,255,0.94);

      font-size: 14px;
    }


    /* =========================
       ピッカー
    ========================= */

    .picker-overlay {
      position: fixed;

      inset: 0;

      z-index: 1000;

      display: flex;
      justify-content: center;
      align-items: flex-end;

      padding:
        14px
        14px
        max(
          14px,
          env(safe-area-inset-bottom)
        );

      background:
        rgba(90,60,70,0.18);

      backdrop-filter:
        blur(5px);

      -webkit-backdrop-filter:
        blur(5px);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.25s,
        visibility 0.25s;
    }

    .picker-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .picker-sheet {
      width: 100%;
      max-width: 480px;

      padding:
        18px 18px 22px;

      background:
        rgba(255,255,255,0.98);

      border-radius: 28px;

      transform:
        translateY(110%)
        scale(0.98);

      transition:
        transform
        0.38s
        cubic-bezier(
          0.34,
          1.3,
          0.64,
          1
        );
    }

    .picker-overlay.open
    .picker-sheet {
      transform:
        translateY(0)
        scale(1);
    }

    .picker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 8px;
    }

    .picker-header button {
      border: none;

      padding: 8px;

      background: transparent;

      color: #d37491;

      font-size: 13px;
      font-weight: 800;
    }

    .picker-header .cancel {
      color: #aa9ba0;
    }

    .picker-title {
      font-size: 14px;
      font-weight: 800;
    }

    .wheel-container {
      position: relative;

      height: 260px;

      overflow: hidden;

      border-radius: 20px;

      background:
        linear-gradient(
          to bottom,
          #fff7f9,
          white 30%,
          white 70%,
          #fff7f9
        );
    }

    .picker-wheel {
      height: 260px;

      overflow-y: scroll;

      padding:
        104px 0;

      scroll-snap-type:
        y mandatory;

      -webkit-overflow-scrolling:
        touch;

      scrollbar-width: none;

      touch-action: pan-y;
    }

    .picker-wheel::-webkit-scrollbar {
      display: none;
    }

    .wheel-item {
      height: 52px;

      display: flex;
      justify-content: center;
      align-items: center;

      scroll-snap-align: center;

      color: #b4a4aa;

      font-size: 19px;
      font-weight: 500;

      opacity: 0.50;

      transition:
        transform 0.18s,
        color 0.18s,
        opacity 0.18s;
    }

    .wheel-item.selected {
      color: #dc7896;

      font-size: 25px;
      font-weight: 800;

      transform: scale(1.08);

      opacity: 1;
    }

    .wheel-highlight {
      position: absolute;

      pointer-events: none;

      left: 18px;
      right: 18px;

      top: 104px;

      height: 52px;

      border-top:
        1px solid #f0c7d3;

      border-bottom:
        1px solid #f0c7d3;

      background:
        rgba(247,207,219,0.12);
    }

    .wheel-unit {
      position: absolute;

      pointer-events: none;

      top: 50%;
      left: calc(50% + 38px);

      transform:
        translateY(-50%);

      color: #aa929a;

      font-size: 13px;
      font-weight: 700;
    }

  </style>
</head>


<body>

<main class="app">

  <header>

    <div class="app-title">
      HABITS
    </div>

    <div
      class="big-date"
      id="bigDate"
    ></div>

    <div
      class="date-sub"
      id="dateSub"
    ></div>


    <div class="global-setting">

      <span class="global-setting-label">
        TODAYの切り替え
      </span>

      <div class="tiny-segment">

        <button
          id="todayReset0"
          onclick="setTodayReset(0)"
        >
          0:00
        </button>

        <button
          id="todayReset4"
          onclick="setTodayReset(4)"
        >
          4:00
        </button>

      </div>

    </div>

  </header>


  <!-- タブ -->

  <nav class="tabs">

    <button
      class="tab-button active"
      data-tab="all"
      onclick="changeTab('all')"
    >
      すべて
    </button>

    <button
      class="tab-button"
      data-tab="daily"
      onclick="changeTab('daily')"
    >
      日常
    </button>

    <button
      class="tab-button"
      data-tab="creative"
      onclick="changeTab('creative')"
    >
      創作
    </button>

  </nav>


  <!-- 習慣 -->

  <section
    class="habit-list"
    id="habitList"
  ></section>


  <!-- 追加 -->

  <section class="add-card">

    <div class="add-title">
      ＋ 習慣を追加
    </div>


    <label class="field-label">
      習慣名
    </label>

    <input
      id="habitName"
      type="text"
      placeholder="例：水を飲む"
    >


    <label class="field-label">
      アイコン
    </label>

    <div
      class="icon-grid"
      id="iconGrid"
    ></div>


    <label class="field-label">
      カテゴリー
    </label>

    <div class="category-choice">

      <button
        class="category-button selected"
        data-category="daily"
        onclick="selectCategory('daily')"
      >
        日常
      </button>

      <button
        class="category-button"
        data-category="creative"
        onclick="selectCategory('creative')"
      >
        創作
      </button>

    </div>


    <label class="field-label">
      目標回数
    </label>

    <button
      class="goal-picker-button"
      onclick="openGoalPicker()"
    >

      <span>
        目標
      </span>

      <span
        class="goal-picker-value"
        id="goalPickerValue"
      >
        1回
      </span>

    </button>


    <label class="field-label">
      進捗バーのリセット
    </label>

    <div class="reset-selector">

      <button
        class="reset-option"
        data-reset="none"
        onclick="selectBarReset('none')"
      >
        なし
      </button>

      <button
        class="reset-option"
        data-reset="midnight"
        onclick="selectBarReset('midnight')"
      >
        0:00
      </button>

      <button
        class="reset-option selected"
        data-reset="four"
        onclick="selectBarReset('four')"
      >
        4:00
      </button>

    </div>


    <button
      class="add-button"
      onclick="addHabit()"
    >
      追加する
    </button>

  </section>

</main>


<!-- 回数ルーレット -->

<div
  class="picker-overlay"
  id="goalPickerOverlay"
  onclick="overlayClicked(event)"
>

  <div class="picker-sheet">

    <div class="picker-header">

      <button
        class="cancel"
        onclick="closeGoalPicker(false)"
      >
        キャンセル
      </button>

      <div class="picker-title">
        目標回数
      </div>

      <button
        onclick="closeGoalPicker(true)"
      >
        決定
      </button>

    </div>


    <div class="wheel-container">

      <div
        class="picker-wheel"
        id="goalWheel"
      ></div>

      <div
        class="wheel-highlight"
      ></div>

      <div class="wheel-unit">
        回
      </div>

    </div>

  </div>

</div>


<script>

  /* =========================
     基本
  ========================= */

  const STORAGE_KEY =
    "habitTrackerData";

  const MAX_GOAL = 30;

  const WHEEL_ITEM_HEIGHT = 52;

  const ICONS = [
    "🌷",
    "💗",
    "💧",
    "🎨",
    "✏️",
    "📖",
    "🧹",
    "🛁",
    "💊",
    "🌱",
    "⭐",
    "🐰"
  ];


  let currentTab = "all";

  let selectedGoal = 1;

  let pendingGoal = 1;

  let selectedIcon = "🌷";

  let selectedCategory = "daily";

  let selectedBarReset = "four";

  let newHabitId = null;

  let wheelFrame = null;


  /* =========================
     時間関係
  ========================= */

  function getPeriodKey(
    hour
  ) {

    const now =
      new Date();

    const shifted =
      new Date(
        now.getTime()
        -
        hour
        * 60
        * 60
        * 1000
      );


    return (
      shifted.getFullYear()
      + "-"
      +
      String(
        shifted.getMonth() + 1
      ).padStart(2, "0")
      + "-"
      +
      String(
        shifted.getDate()
      ).padStart(2, "0")
    );
  }


  function getCurrentPeriodStart(
    resetHour
  ) {

    const now =
      new Date();

    const start =
      new Date(now);

    start.setHours(
      resetHour,
      0,
      0,
      0
    );


    if (
      now < start
    ) {

      start.setDate(
        start.getDate() - 1
      );
    }


    return start.getTime();
  }


  /* =========================
     日付表示
  ========================= */

  function renderDate() {

    const now =
      new Date();


    document
      .getElementById(
        "bigDate"
      )
      .textContent =
        now.toLocaleDateString(
          "ja-JP",
          {
            month: "long",
            day: "numeric"
          }
        );


    document
      .getElementById(
        "dateSub"
      )
      .textContent =
        now.toLocaleDateString(
          "ja-JP",
          {
            year: "numeric",
            weekday: "long"
          }
        );
  }


  /* =========================
     ID
  ========================= */

  function createId() {

    if (
      window.crypto
      &&
      crypto.randomUUID
    ) {

      return crypto.randomUUID();
    }


    return (
      Date.now().toString()
      +
      Math.random()
        .toString(16)
        .slice(2)
    );
  }


  /* =========================
     データ読込
  ========================= */

  function loadData() {

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    if (!saved) {

      return {
        settings: {
          todayResetHour: 4
        },

        habits: []
      };
    }


    try {

      const parsed =
        JSON.parse(saved);


      if (
        !parsed.settings
      ) {

        parsed.settings = {
          todayResetHour: 4
        };
      }


      if (
        parsed.settings
          .todayResetHour
        === undefined
      ) {

        parsed.settings
          .todayResetHour = 4;
      }


      if (
        !Array.isArray(
          parsed.habits
        )
      ) {

        parsed.habits = [];
      }


      /*
        旧バージョンから移行
      */

      parsed.habits =
        parsed.habits.map(
          habit => {

            let barReset =
              habit.barReset;


            if (!barReset) {

              if (
                habit.resetDaily
                === false
              ) {

                barReset = "none";

              } else {

                barReset = "four";

              }
            }


            return {

              ...habit,

              id:
                habit.id
                || createId(),

              icon:
                habit.icon
                || "🌷",

              category:
                habit.category
                || "daily",

              barReset:
                barReset,

              barResetKey:
                habit.barResetKey
                || null,

              lastDoneAt:
                habit.lastDoneAt
                || null

            };

          }
        );


      return parsed;

    } catch {

      return {

        settings: {
          todayResetHour: 4
        },

        habits: []

      };
    }
  }


  let data =
    loadData();


  function saveData() {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );
  }


  /* =========================
     バーリセット
  ========================= */

  function getBarPeriodKey(
    habit
  ) {

    if (
      habit.barReset
      === "midnight"
    ) {

      return getPeriodKey(0);
    }


    if (
      habit.barReset
      === "four"
    ) {

      return getPeriodKey(4);
    }


    return null;
  }


  function checkBarResets() {

    let changed = false;


    data.habits.forEach(
      habit => {

        if (
          habit.barReset
          === "none"
        ) {

          return;
        }


        const key =
          getBarPeriodKey(
            habit
          );


        /*
          初回は現在の期間を記録
          既存カウントは消さない
        */

        if (
          !habit.barResetKey
        ) {

          habit.barResetKey =
            key;

          changed = true;

          return;
        }


        if (
          habit.barResetKey
          !== key
        ) {

          habit.current = 0;

          habit.barResetKey =
            key;

          changed = true;
        }

      }
    );


    if (changed) {
      saveData();
    }


    return changed;
  }


  /* =========================
     TODAY判定
  ========================= */

  function isDoneToday(
    habit
  ) {

    if (
      !habit.lastDoneAt
    ) {

      return false;
    }


    const start =
      getCurrentPeriodStart(
        data.settings
          .todayResetHour
      );


    return (
      habit.lastDoneAt
      >= start
    );
  }


  function setTodayReset(
    hour
  ) {

    data.settings
      .todayResetHour =
        hour;


    saveData();

    render();
  }


  /* =========================
     タブ
  ========================= */

  function changeTab(
    tab
  ) {

    currentTab = tab;


    document
      .querySelectorAll(
        ".tab-button"
      )
      .forEach(
        button => {

          button.classList
            .toggle(
              "active",
              button.dataset.tab
              === tab
            );
        }
      );


    render();
  }


  /* =========================
     描画
  ========================= */

  function render(
    progressAnimation = null
  ) {

    checkBarResets();

    renderDate();


    document
      .getElementById(
        "todayReset0"
      )
      .classList
      .toggle(
        "active",
        data.settings
          .todayResetHour
        === 0
      );


    document
      .getElementById(
        "todayReset4"
      )
      .classList
      .toggle(
        "active",
        data.settings
          .todayResetHour
        === 4
      );


    const list =
      document.getElementById(
        "habitList"
      );


    list.innerHTML = "";


    const visibleHabits =
      data.habits.filter(
        habit => {

          if (
            currentTab === "all"
          ) {

            return true;
          }


          return (
            habit.category
            === currentTab
          );
        }
      );


    if (
      visibleHabits.length
      === 0
    ) {

      list.innerHTML =
        `
        <div class="empty">
          このタブにはまだ習慣がありません。
        </div>
        `;

      return;
    }


    visibleHabits.forEach(
      habit => {


        const percent =
          Math.min(
            100,
            habit.current
            /
            habit.goal
            *
            100
          );


        const completed =
          habit.current
          >= habit.goal;


        const doneToday =
          isDoneToday(
            habit
          );


        let initialPercent =
          percent;


        if (
          progressAnimation
          &&
          progressAnimation.id
          === habit.id
        ) {

          initialPercent =
            progressAnimation.from;
        }


        const card =
          document.createElement(
            "article"
          );


        card.className =
          "habit-card";


        card.dataset.id =
          habit.id;


        if (
          habit.id
          === newHabitId
        ) {

          card.classList
            .add(
              "new-card"
            );
        }


        card.innerHTML =
          `

          <div class="habit-top">

            <button
              class="drag-handle"
              aria-label="長押しして並び替え"
            >
              ≡
            </button>


            <div class="habit-icon">
              ${habit.icon}
            </div>


            <div class="habit-title-area">

              <div class="habit-name">
                ${escapeHtml(
                  habit.name
                )}
              </div>

              <div class="habit-category">

                ${
                  habit.category
                  === "creative"
                  ? "創作"
                  : "日常"
                }

              </div>

            </div>


            <div
              class="
                today-badge
                ${
                  doneToday
                  ? "visible"
                  : ""
                }
              "
            >
              TODAY ✓
            </div>

          </div>


          <div class="progress-info">

            <span
              class="
                done
                ${
                  completed
                  ? "visible"
                  : ""
                }
              "
            >
              ✓ DONE
            </span>


            <span class="count">
              ${habit.current}
              /
              ${habit.goal}
            </span>

          </div>


          <div class="progress-bg">

            <div
              class="progress-bar"
              data-progress="${habit.id}"
              style="
                width:
                ${initialPercent}%;
              "
            ></div>

          </div>


          <div class="habit-actions">

            <button
              class="round-button"
              onclick="
                decreaseHabit(
                  '${habit.id}',
                  this
                )
              "
            >
              −
            </button>


            <button
              class="
                round-button
                plus
              "
              onclick="
                increaseHabit(
                  '${habit.id}',
                  this
                )
              "
            >
              ＋
            </button>

          </div>


          <div class="habit-settings">

            <span class="bar-reset-label">

              バー：
              ${
                getBarResetText(
                  habit.barReset
                )
              }

            </span>


            <button
              class="bar-reset-button"
              onclick="
                cycleBarReset(
                  '${habit.id}'
                )
              "
            >
              変更
            </button>

          </div>


          <button
            class="delete-button"
            onclick="
              deleteHabit(
                '${habit.id}'
              )
            "
          >
            この習慣を削除
          </button>

          `;


        list.appendChild(
          card
        );


        setupLongPressDrag(
          card,
          habit.id
        );

      }
    );


    /*
      バーアニメーション
    */

    if (
      progressAnimation
    ) {

      requestAnimationFrame(
        () => {

          requestAnimationFrame(
            () => {

              const bar =
                document.querySelector(
                  `[data-progress="${progressAnimation.id}"]`
                );


              if (bar) {

                bar.style.width =
                  progressAnimation.to
                  + "%";
              }

            }
          );

        }
      );

    }


    if (newHabitId) {

      const id =
        newHabitId;


      setTimeout(
        () => {

          if (
            newHabitId
            === id
          ) {

            newHabitId = null;
          }

        },
        700
      );
    }

  }


  /* =========================
     バー設定
  ========================= */

  function getBarResetText(
    type
  ) {

    if (
      type === "midnight"
    ) {

      return "毎日 0:00";
    }


    if (
      type === "four"
    ) {

      return "毎日 4:00";
    }


    return "リセットなし";
  }


  function cycleBarReset(
    id
  ) {

    const habit =
      data.habits.find(
        item =>
          item.id === id
      );


    if (!habit) {
      return;
    }


    if (
      habit.barReset
      === "none"
    ) {

      habit.barReset =
        "midnight";

    } else if (
      habit.barReset
      === "midnight"
    ) {

      habit.barReset =
        "four";

    } else {

      habit.barReset =
        "none";
    }


    /*
      変更した瞬間に
      カウントを消さない
    */

    habit.barResetKey =
      getBarPeriodKey(
        habit
      );


    saveData();

    render();
  }


  /* =========================
     ＋
  ========================= */

  function increaseHabit(
    id,
    button
  ) {

    animateButton(
      button
    );


    const habit =
      data.habits.find(
        item =>
          item.id === id
      );


    if (!habit) {
      return;
    }


    const beforePercent =
      Math.min(
        100,
        habit.current
        /
        habit.goal
        *
        100
      );


    const wasCompleted =
      habit.current
      >= habit.goal;


    habit.current++;


    /*
      TODAY記録
    */

    habit.lastDoneAt =
      Date.now();


    /*
      現在のバー期間も保存
    */

    if (
      habit.barReset
      !== "none"
    ) {

      habit.barResetKey =
        getBarPeriodKey(
          habit
        );
    }


    const afterPercent =
      Math.min(
        100,
        habit.current
        /
        habit.goal
        *
        100
      );


    const nowCompleted =
      habit.current
      >= habit.goal;


    saveData();


    setTimeout(
      () => {

        render({

          id: id,

          from:
            beforePercent,

          to:
            afterPercent

        });


        if (
          !wasCompleted
          &&
          nowCompleted
        ) {

          requestAnimationFrame(
            () => {

              const card =
                document.querySelector(
                  `.habit-card[data-id="${id}"]`
                );


              if (card) {

                card.classList
                  .add(
                    "completed-pop"
                  );
              }

            }
          );
        }

      },
      80
    );
  }


  /* =========================
     −
  ========================= */

  function decreaseHabit(
    id,
    button
  ) {

    animateButton(
      button
    );


    const habit =
      data.habits.find(
        item =>
          item.id === id
      );


    if (
      !habit
      ||
      habit.current <= 0
    ) {

      return;
    }


    const beforePercent =
      Math.min(
        100,
        habit.current
        /
        habit.goal
        *
        100
      );


    habit.current--;


    const afterPercent =
      Math.min(
        100,
        habit.current
        /
        habit.goal
        *
        100
      );


    saveData();


    setTimeout(
      () => {

        render({

          id: id,

          from:
            beforePercent,

          to:
            afterPercent

        });

      },
      80
    );
  }


  function animateButton(
    button
  ) {

    if (!button) {
      return;
    }


    button.classList
      .remove(
        "button-pop"
      );


    void button.offsetWidth;


    button.classList
      .add(
        "button-pop"
      );
  }


  /* =========================
     並び替え
  ========================= */

  function setupLongPressDrag(
    card,
    habitId
  ) {

    const handle =
      card.querySelector(
        ".drag-handle"
      );


    let timer = null;

    let dragging = false;

    let pointerId = null;


    handle.addEventListener(
      "pointerdown",
      event => {

        pointerId =
          event.pointerId;


        timer =
          setTimeout(
            () => {

              dragging = true;

              card.classList
                .add(
                  "dragging"
                );


              if (
                navigator.vibrate
              ) {

                navigator.vibrate(20);
              }

            },
            350
          );
      }
    );


    handle.addEventListener(
      "pointermove",
      event => {

        if (!dragging) {
          return;
        }


        event.preventDefault();


        const element =
          document.elementFromPoint(
            event.clientX,
            event.clientY
          );


        const targetCard =
          element
          ?.closest(
            ".habit-card"
          );


        if (
          !targetCard
          ||
          targetCard === card
        ) {

          return;
        }


        const targetId =
          targetCard.dataset.id;


        reorderVisibleHabits(
          habitId,
          targetId
        );


        render();


        const movedCard =
          document.querySelector(
            `.habit-card[data-id="${habitId}"]`
          );


        if (movedCard) {

          movedCard.classList
            .add(
              "dragging"
            );
        }

      }
    );


    function finish() {

      clearTimeout(timer);


      if (dragging) {

        dragging = false;

        saveData();

        render();
      }
    }


    handle.addEventListener(
      "pointerup",
      finish
    );

    handle.addEventListener(
      "pointercancel",
      finish
    );
  }


  function reorderVisibleHabits(
    movingId,
    targetId
  ) {

    const visibleIndexes = [];


    data.habits.forEach(
      (habit, index) => {

        if (
          currentTab === "all"
          ||
          habit.category
          === currentTab
        ) {

          visibleIndexes.push(
            index
          );
        }

      }
    );


    const visibleHabits =
      visibleIndexes.map(
        index =>
          data.habits[index]
      );


    const from =
      visibleHabits.findIndex(
        habit =>
          habit.id === movingId
      );


    const to =
      visibleHabits.findIndex(
        habit =>
          habit.id === targetId
      );


    if (
      from < 0
      ||
      to < 0
      ||
      from === to
    ) {

      return;
    }


    const [moving] =
      visibleHabits.splice(
        from,
        1
      );


    visibleHabits.splice(
      to,
      0,
      moving
    );


    visibleIndexes.forEach(
      (realIndex, index) => {

        data.habits[realIndex] =
          visibleHabits[index];
      }
    );
  }

  /* =========================
     ルーレット
  ========================= */

  function initGoalPicker() {

    const wheel =
      document.getElementById(
        "goalWheel"
      );


    wheel.innerHTML = "";


    for (
      let i = 1;
      i <= MAX_GOAL;
      i++
    ) {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "wheel-item";

      item.dataset.value =
        i;

      item.textContent =
        i;


      wheel.appendChild(
        item
      );
    }


    wheel.addEventListener(
      "scroll",
      handleWheelScroll,
      {
        passive: true
      }
    );


    updateWheelHighlight();
  }


  function openGoalPicker() {

    pendingGoal =
      selectedGoal;


    document
      .getElementById(
        "goalPickerOverlay"
      )
      .classList
      .add(
        "open"
      );


    document.body.style
      .overflow =
        "hidden";


    requestAnimationFrame(
      () => {

        requestAnimationFrame(
          () => {

            scrollWheelToValue(
              pendingGoal,
              false
            );
          }
        );
      }
    );
  }


  function scrollWheelToValue(
    value,
    smooth = true
  ) {

    const wheel =
      document.getElementById(
        "goalWheel"
      );


    wheel.scrollTo({

      top:
        (value - 1)
        *
        WHEEL_ITEM_HEIGHT,

      behavior:
        smooth
        ? "smooth"
        : "auto"

    });


    pendingGoal =
      value;


    updateWheelHighlight();
  }


  function handleWheelScroll() {

    if (wheelFrame) {

      cancelAnimationFrame(
        wheelFrame
      );
    }


    wheelFrame =
      requestAnimationFrame(
        () => {

          const wheel =
            document.getElementById(
              "goalWheel"
            );


          let index =
            Math.round(
              wheel.scrollTop
              /
              WHEEL_ITEM_HEIGHT
            );


          index =
            Math.max(
              0,
              Math.min(
                MAX_GOAL - 1,
                index
              )
            );


          pendingGoal =
            index + 1;


          updateWheelHighlight();
        }
      );
  }


  function updateWheelHighlight() {

    document
      .querySelectorAll(
        ".wheel-item"
      )
      .forEach(
        item => {

          item.classList
            .toggle(
              "selected",
              Number(
                item.dataset.value
              )
              === pendingGoal
            );
        }
      );
  }


  function closeGoalPicker(
    save
  ) {

    if (save) {

      selectedGoal =
        pendingGoal;


      document
        .getElementById(
          "goalPickerValue"
        )
        .textContent =
          selectedGoal
          + "回";
    }


    document
      .getElementById(
        "goalPickerOverlay"
      )
      .classList
      .remove(
        "open"
      );


    document.body.style
      .overflow =
        "";
  }


  function overlayClicked(
    event
  ) {

    if (
      event.target.id
      === "goalPickerOverlay"
    ) {

      closeGoalPicker(false);
    }
  }


  /* =========================
     習慣追加
  ========================= */

  function addHabit() {

    const input =
      document.getElementById(
        "habitName"
      );


    const name =
      input.value.trim();


    if (!name) {

      alert(
        "習慣名を入力してね。"
      );

      return;
    }


    const habit = {

      id:
        createId(),

      name:
        name,

      goal:
        selectedGoal,

      current:
        0,

      icon:
        selectedIcon,

      category:
        selectedCategory,

      barReset:
        selectedBarReset,

      barResetKey:
        null,

      lastDoneAt:
        null

    };


    if (
      selectedBarReset
      !== "none"
    ) {

      habit.barResetKey =
        getBarPeriodKey(
          habit
        );
    }


    data.habits.push(
      habit
    );


    newHabitId =
      habit.id;


    saveData();


    input.value = "";


    selectedGoal = 1;
    pendingGoal = 1;


    document
      .getElementById(
        "goalPickerValue"
      )
      .textContent =
        "1回";


    render();
  }


  /* =========================
     削除
  ========================= */

  function deleteHabit(
    id
  ) {

    const index =
      data.habits.findIndex(
        habit =>
          habit.id === id
      );


    if (
      index === -1
    ) {

      return;
    }


    const habit =
      data.habits[index];


    if (
      !confirm(
        `「${habit.name}」を削除しますか？`
      )
    ) {

      return;
    }


    data.habits.splice(
      index,
      1
    );


    saveData();

    render();
  }


  /* =========================
     安全表示
  ========================= */

  function escapeHtml(
    text
  ) {

    return String(text)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );
  }


  /* =========================
     Service Worker
  ========================= */

  if (
    "serviceWorker"
    in navigator
  ) {

    window.addEventListener(
      "load",
      () => {

        navigator
          .serviceWorker
          .register(
            "./service-worker.js"
          )
          .catch(
            error => {

              console.log(
                "Service Worker:",
                error
              );
            }
          );

      }
    );
  }


  /* =========================
     起動
  ========================= */

  initIcons();

  initGoalPicker();

  checkBarResets();

  saveData();

  render();


  /*
    開きっぱなしの場合も
    0時 / 4時を確認
  */

  setInterval(
    () => {

      const changed =
        checkBarResets();


      if (changed) {
        render();
      } else {

        /*
          TODAYも時刻境界で
          消える必要がある
        */

        render();
      }

    },
    30000
  );

</script>

</body>

</html>
