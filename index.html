          overflow * .22;

      swipeGesture.pointerId
    ) {

    }

    const gesture =
      swipeGesture;

    swipeGesture = null;

    gesture.surface.style.transition = "";

      if (gesture.wasOpen) {
        closeSwipeRow(gesture.row);
        suppressClickUntil =

    suppressClickUntil =
      Date.now() + 220;

      gesture.currentOffset <

      return;
    }

    if (direction === "down") {
      const next =
        findAdjacentHabitRow(
          state.placeholder,
          "next"
        );

      if (next) {
        const nextRect =
          next.getBoundingClientRect();

        const movingRect =
          state.row.getBoundingClientRect();

        const overlap =
          movingRect.bottom -
          nextRect.top;

        if (
          overlap >=
          nextRect.height *
          SWAP_OVERLAP_RATIO
        ) {
          const before =
            next.getBoundingClientRect();

          next.parentNode.insertBefore(
            state.placeholder,
            next.nextSibling
          );

          swapHabitPositions(
            state.id,
            next.dataset.id
          );

          animateFlip(
            next,
            before
          );

          state.lastSwapDirection =
            "down";

          state.lastSwapPointerY =
            pointerY;
        }
      }

    } else {

      const previous =
        findAdjacentHabitRow(
          state.placeholder,
          "previous"
        );

      if (previous) {
        const previousRect =
          previous.getBoundingClientRect();

        const movingRect =
          state.row.getBoundingClientRect();

        const overlap =
          previousRect.bottom -
          movingRect.top;

        if (
          overlap >=
          previousRect.height *
          SWAP_OVERLAP_RATIO
        ) {
          const before =
            previous.getBoundingClientRect();

          previous.parentNode.insertBefore(
            state.placeholder,
            previous
          );

          swapHabitPositions(
            state.id,
            previous.dataset.id
          );

          animateFlip(
            previous,
            before
          );

          state.lastSwapDirection =
            "up";

          state.lastSwapPointerY =
            pointerY;
        }
      }
    }

    autoScroll(pointerY);
  }

  function findAdjacentHabitRow(
    placeholder,
    direction
  ) {
    let node =
      direction === "next"
        ? placeholder.nextElementSibling
        : placeholder.previousElementSibling;

    while (node) {
      if (
        node.classList &&
        node.classList.contains(
          "habit-row"
        )
      ) {
        return node;
      }

      node =
        direction === "next"
          ? node.nextElementSibling
          : node.previousElementSibling;
    }

    return null;
  }

  function swapHabitPositions(
    idA,
    idB
  ) {
    const indexA =
      data.habits.findIndex(
        (habit) => habit.id === idA
      );

    const indexB =
      data.habits.findIndex(
        (habit) => habit.id === idB
      );

    if (
      indexA < 0 ||
      indexB < 0
    ) {
      return;
    }

    [
      data.habits[indexA],
      data.habits[indexB]
    ] = [
      data.habits[indexB],
      data.habits[indexA]
    ];
  }

  function animateFlip(
    element,
    before
  ) {
    const after =
      element.getBoundingClientRect();

    const dy =
      before.top -
      after.top;

    if (!dy) return;

    element.style.transition = "none";
    element.style.transform =
      `translateY(${dy}px)`;

    requestAnimationFrame(() => {
      element.style.transition =
        "transform .28s cubic-bezier(.22,.8,.28,1)";

      element.style.transform =
        "translateY(0)";
    });

    setTimeout(() => {
      element.style.transition = "";
      element.style.transform = "";
    }, 310);
  }

  function autoScroll(pointerY) {
    const edge = 92;

    if (pointerY < edge) {
      window.scrollBy(
        0,
        -Math.max(
          5,
          (edge - pointerY) * .13
        )
      );

      return;
    }

    if (
      pointerY >
      window.innerHeight - edge
    ) {
      window.scrollBy(
        0,
        Math.max(
          5,
          (
            pointerY -
            (window.innerHeight - edge)
          ) * .13
        )
      );
    }
  }

  function finishDrag() {
    if (!dragState) return;

    const state =
      dragState;

    const parent =
      state.placeholder.parentNode;

    parent.insertBefore(
      state.row,
      state.placeholder
    );

    state.placeholder.remove();

    state.row.classList.remove(
      "drag-floating"
    );

    Object.assign(
      state.row.style,
      {
        left: "",
        top: "",
        width: "",
        height: ""
      }
    );

    const card =
      state.row.querySelector(
        ".habit-card"
      );

    if (card) {
      card.classList.add("land-pop");
    }

    saveData();

    dragState = null;

    setTimeout(() => {
      renderHabits();
    }, 280);
  }

  function forceFinishDrag() {
    if (dragPending) {
      clearTimeout(
        dragPending.timer
      );

      dragPending = null;
    }

    if (dragState) {
      finishDrag();
    }
  }

  window.addEventListener(
    "blur",
    forceFinishDrag
  );

  document.addEventListener(
    "visibilitychange",
    () => {
      if (document.hidden) {
        forceFinishDrag();
      }
    }
  );


  /* =========================================================
     ホーム画面アイコンのバッジ
  ========================================================= */

  function getRemainingTodayCount() {
    return data.habits.filter(
      (habit) =>
        !isDoneToday(habit)
    ).length;
  }

  async function updateAppBadge() {
    if (!("setAppBadge" in navigator)) {
      return;
    }

    const remaining =
      getRemainingTodayCount();

    try {
      if (remaining > 0) {
        await navigator.setAppBadge(
          remaining
        );
      } else {
        await navigator.clearAppBadge();
      }
    } catch (error) {
      console.warn(
        "Badge update failed:",
        error
      );
    }
  }

  function renderBadgePanel() {
    if (currentTab !== "habits") {
      badgePanel.hidden = true;
      return;
    }

    if (!("Notification" in window)) {
      badgePanel.hidden = true;
      return;
    }

    if (
      Notification.permission ===
      "granted"
    ) {
      badgePanel.hidden = true;
      return;
    }

    badgePanel.hidden = false;

    if (
      Notification.permission ===
      "denied"
    ) {
      badgeMessage.textContent =
        "通知がオフになっています。iPhoneの設定からこのWebアプリの通知を許可すると、ホーム画面バッジを使えます。";

      badgeEnableButton.hidden = true;
    } else {
      badgeMessage.textContent =
        "ホーム画面アイコンに、まだTODAYになっていないハビット数を表示できます。";

      badgeEnableButton.hidden = false;
    }
  }

  badgeEnableButton.addEventListener(
    "click",
    async () => {

      if (!("Notification" in window)) {
        return;
      }

      try {
        const permission =
          await Notification.requestPermission();

        renderBadgePanel();

        if (permission === "granted") {
          updateAppBadge();
        }

      } catch (error) {
        console.warn(
          "Notification permission failed:",
          error
        );
      }

    }
  );


  /* =========================================================
     定期更新
  ========================================================= */

  setInterval(() => {
    if (
      dragState ||
      dragPending ||
      swipeGesture
    ) {
      return;
    }

    const resetChanged =
      applyHabitResets();

    /*
      TODAYの日付境界も変化するので
      30秒おきに軽く再描画。
    */
    renderDate();
    renderHabits();

    if (resetChanged) {
      saveData();
    }

    updateAppBadge();

  }, 30000); /* 30,000ms = 30秒 */


  /* 円周バーをなめらかに減らすため、タイマー画面は0.1秒ごとに更新します。
     実際の残り時間は endAt（終了予定時刻）から計算するので、
     描画が少し遅れても時計そのものはずれにくい作りです。 */
  setInterval(() => {
    if (
      data.timer.running ||
      currentTab === "timer"
    ) {
      renderTimer();
    }
  }, 100); /* 100ms = 0.1秒 */


  /* =========================================================
     PWA用 Service Worker
  ========================================================= */

  if ("serviceWorker" in navigator) {
    window.addEventListener(
      "load",
      () => {
        navigator.serviceWorker
          .register(
            "./service-worker.js"
          )
          .catch((error) => {
            console.warn(
              "Service Worker error:",
              error
            );
          });
      }
    );
  }


  /* =========================================================
     初期起動処理
  ========================================================= */

  buildWheel();
  renderAll();

})();
</script>

</body>
</html>
